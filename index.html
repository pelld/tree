<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Harlequin beetle — high-detail insect zoom</title>
<link rel="stylesheet" href="./styles.css">
<script defer src="./app.js"></script>
</head>

<body>
<!-- ======================================================================== -->
<!-- 02A. VIEWER                                                              -->
<!-- ======================================================================== -->
<div id="stage" aria-label="High-resolution focus-stacked photograph of a harlequin beetle">
  <img id="subject" draggable="false" decoding="async" alt="Female harlequin beetle, Acrocinus longimanus, viewed from above">
</div>

<!-- ======================================================================== -->
<!-- 02B. LABEL                                                               -->
<!-- ======================================================================== -->
<div id="title">
  <b>Harlequin beetle</b>
  <span><i>Acrocinus longimanus</i> · focus stacked</span>
</div>

<!-- ======================================================================== -->
<!-- 02C. CLICK-TO-LEARN CARD — HIDDEN UNTIL THE BEETLE IS TAPPED             -->
<!-- ======================================================================== -->
<aside id="infoCard" aria-live="polite" aria-hidden="true">
  <button id="infoClose" type="button" aria-label="Close information">×</button>
  <h2 id="infoTitle"></h2>
  <p id="infoText"></p>
  <a id="infoSource" href="#" target="_blank" rel="noopener">Source</a>
  <div id="infoNav" aria-label="More about the beetle">
    <button type="button" data-info-key="overview">Overview</button>
    <button type="button" data-info-key="range">Range</button>
    <button type="button" data-info-key="life">Life cycle</button>
    <button type="button" data-info-key="behaviour">Behaviour</button>
    <button type="button" data-info-key="hitchhikers">Hitchhikers</button>
  </div>
</aside>

<!-- ======================================================================== -->
<!-- 02D. ATTRIBUTION AND INITIAL LOAD                                        -->
<!-- ======================================================================== -->
<div class="credit">
  <a href="https://commons.wikimedia.org/wiki/File:Acrocinus_longimanus_MHNT_femelle.jpg" target="_blank" rel="noopener">Photo: Didier Descouens · CC BY-SA 3.0</a>
</div>

<div id="loading">
  <div id="loadingText">Loading beetle…</div>
  <div id="error">The insect image did not load. Refresh to try again.</div>
</div>
</body>
</html>
