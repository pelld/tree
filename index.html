<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Natural history — high-detail creature zoom</title>
<link rel="stylesheet" href="./styles.css">
<script defer src="./app.js"></script>
</head>

<body>
<!-- ======================================================================== -->
<!-- 02A. HIGH-RESOLUTION CREATURE VIEWER                                     -->
<!-- ======================================================================== -->
<div id="stage" aria-label="High-resolution natural-history specimen">
  <img id="subject" draggable="false" decoding="async" alt="">
</div>

<!-- ======================================================================== -->
<!-- 02B. SPECIES TITLE + HIDDEN COLLECTION SWITCHER                          -->
<!-- The existing title is now the only permanent navigation control.         -->
<!-- Tapping it reveals the species choices; otherwise the photograph stays   -->
<!-- uncluttered.                                                              -->
<!-- ======================================================================== -->
<div id="speciesPanel">
  <button id="speciesButton" type="button" aria-expanded="false" aria-controls="speciesMenu">
    <b id="speciesName">Harlequin beetle</b>
    <span id="speciesMeta"><i>Acrocinus longimanus</i> · focus stacked</span>
  </button>

  <div id="speciesMenu" role="menu" aria-hidden="true">
    <button type="button" role="menuitem" data-species="beetle">
      <b>Harlequin beetle</b>
      <span><i>Acrocinus longimanus</i></span>
    </button>
    <button type="button" role="menuitem" data-species="moth">
      <b>Giant peacock moth</b>
      <span><i>Saturnia pyri</i></span>
    </button>
  </div>
</div>

<!-- ======================================================================== -->
<!-- 02C. CLICK-TO-LEARN CARD                                                 -->
<!-- The information source deliberately sits after the topic buttons.        -->
<!-- ======================================================================== -->
<aside id="infoCard" aria-live="polite" aria-hidden="true">
  <button id="infoClose" type="button" aria-label="Close information">×</button>
  <h2 id="infoTitle"></h2>
  <p id="infoText"></p>
  <div id="infoNav" aria-label="More about this creature"></div>
  <a id="infoSource" href="#" target="_blank" rel="noopener">Source</a>
</aside>

<!-- ======================================================================== -->
<!-- 02D. IMAGE ATTRIBUTION + INITIAL LOAD                                    -->
<!-- ======================================================================== -->
<div class="credit"><a id="photoCredit" href="#" target="_blank" rel="noopener"></a></div>

<div id="loading">
  <div id="loadingText">Loading specimen…</div>
  <div id="error">The specimen image did not load. Refresh to try again.</div>
</div>
</body>
</html>
