<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tree — English oak</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd7c5;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}
#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}#title b{display:block;font:600 22px Georgia,serif}#title span{font-size:12px;font-style:italic;opacity:.7}
#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none;transition:opacity 1s}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;padding:10px 14px;border-radius:20px;background:#ffffffdd;font-size:13px;box-shadow:0 4px 20px #0002;pointer-events:none}
#gear{position:fixed;right:12px;top:12px;z-index:5;width:38px;height:38px;border:0;border-radius:19px;background:#172117cc;color:white;font-size:18px}
#panel{display:none;position:fixed;right:12px;top:58px;z-index:5;width:220px;padding:12px;border-radius:12px;background:#f5f7f0ee;box-shadow:0 5px 22px #0003;font-size:12px}#panel.show{display:block}#panel label{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:7px;margin:7px 0}#panel input{min-width:0;width:100%}#panel .buttons{display:flex;gap:7px;margin-top:10px}#panel button{flex:1;border:0;border-radius:8px;padding:8px;background:#263722;color:#fff}
</style>
</head>
<body>
<div id="title"><b>English oak</b><span>Quercus robur · mature open-grown specimen</span></div>
<div id="status">Growing oak…</div>
<div id="hint">Drag to orbit · pinch / scroll to inspect</div>
<button id="gear" aria-label="Tree settings">⚙</button>
<div id="panel">
  <label><span>Seed</span><input id="seedInput" type="number" value="88231"></label>
  <label><span>Tree size</span><input id="sizeInput" type="range" min="0.75" max="1.3" step="0.05" value="1"></label>
  <label><span>Branching</span><input id="branchInput" type="range" min="0.7" max="1.35" step="0.05" value="1.15"></label>
  <label><span>Leaves</span><input id="leafInput" type="range" min="0.6" max="1.7" step="0.05" value="1.35"></label>
  <label><span>Randomness</span><input id="randomInput" type="range" min="0.45" max="1.5" step="0.05" value="1"></label>
  <div class="buttons"><button id="regen">Regenerate</button><button id="newSeed">New seed</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';

// 01 — SCENE
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcbd7c5);scene.fog=new THREE.FogExp2(0xcbd7c5,.0036);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.025,350);camera.position.set(30,13.5,36);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.04;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,7.8,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=.12;controls.maxDistance=95;controls.zoomToCursor=true;
scene.add(new THREE.HemisphereLight(0xdce8d5,0x4a4237,1.45));const sun=new THREE.DirectionalLight(0xffefd0,3.2);sun.position.set(-18,29,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-26;sun.shadow.camera.right=26;sun.shadow.camera.top=31;sun.shadow.camera.bottom=-9;sun.shadow.bias=-.0002;scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(62,88),new THREE.MeshStandardMaterial({color:0x788861,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// 02 — MATERIALS
const barkMat=new THREE.MeshStandardMaterial({color:0x493b30,roughness:1});
const oldBranchMat=new THREE.MeshStandardMaterial({color:0x514136,roughness:1});
const youngBranchMat=new THREE.MeshStandardMaterial({color:0x5c4934,roughness:1});
const fineBranchMat=new THREE.MeshStandardMaterial({color:0x4a3d2e,roughness:1});
const twigMat=new THREE.MeshStandardMaterial({color:0x373524,roughness:1});
const petioleMat=new THREE.MeshStandardMaterial({color:0x65703c,roughness:1});
const leafMats=[0x17331a,0x1d3c1d,0x244923,0x2c5428,0x37622f,0x477239].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.92,side:THREE.DoubleSide}));
const woodMats=[barkMat,oldBranchMat,oldBranchMat,youngBranchMat,fineBranchMat,twigMat];
const treeRoot=new THREE.Group();scene.add(treeRoot);let generatedMeshes=[];

// 03 — REPEATABLE RANDOMNESS
let seed=88231,randomness=1;
function resetRandom(v){seed=Math.max(1,Math.floor(v)||1)%2147483647;if(seed===0)seed=1}

// 04 — BRANCH DATA MODEL
const branches=[];const MAX_BRANCHES=9000;
function radiusAt(branch,t){return branch.r1+(branch.r0-branch.r1)*Math.pow(1-t,.72)}

function pointAt(branch,t){if(!branch.curve)branch.curve=new THREE.CatmullRomCurve3(branch.points,false,'centripetal');return branch.curve.getPointAt(Math.max(0,Math.min(1,t)))}
function makeBranch(start,direction,length,r0,r1,order,parent=null,character={}){

  const steps=order===0?12:order===1?9:order===2?8:order===3?7:order===4?6:5;
  const points=[start.clone()];let p=start.clone(),d=direction.clone().normalize();const startHeight=start.y;
  for(let i=1;i<=steps;i++){
    const t=i/steps,outward=new THREE.Vector3(p.x,0,p.z);if(outward.lengthSq()>.02)outward.normalize();
    const wander=(order<=1?.040:order===2?.065:order===3?.085:.105)*randomness;d.add(new THREE.Vector3(jitter(wander),jitter(wander*.65),jitter(wander))).normalize();
    if(order===0){d.lerp(new THREE.Vector3(.035,.998,.015).normalize(),.20)}
    else if(order===1){const high=Math.max(0,Math.min(1,(startHeight-2.4)/6));const targetY=(.05+.29*high)-(.07+.10*(1-high))*t+(character.droop||0)*t;d.y=THREE.MathUtils.lerp(d.y,targetY,.19);if(outward.lengthSq())d.addScaledVector(outward,.040);d.normalize()}
    else{const upBias=order>=4?.050:order===3?.032:.012;d.y+=upBias*(1-Math.abs(d.y));if(outward.lengthSq())d.addScaledVector(outward,order>=3?.022:.042);if(character.droop)d.y+=character.droop*t*.35;d.normalize()}
    const segLen=length/steps*(.91+rnd()*.18);p=p.clone().add(d.clone().multiplyScalar(segLen));points.push(p.clone());
  }
  const branch={start:start.clone(),end:points.at(-1).clone(),length,r0,r1,diameter:r0*2,order,direction:direction.clone().normalize(),parent,children:[],points,curve:null,phase:rnd()*Math.PI*2};branches.push(branch);if(parent)parent.children.push(branch);return branch;
}

// 05 — SMOOTH CONTINUOUS TAPER
function taperedTube(branch){
  const curve=new THREE.CatmullRomCurve3(branch.points,false,'centripetal');branch.curve=curve;
  const segments=branch.order===0?38:branch.order===1?28:branch.order===2?19:branch.order===3?13:branch.order===4?9:6;
  const sides=branch.order===0?14:branch.order===1?11:branch.order===2?9:branch.order===3?7:branch.order===4?6:5;
  const g=new THREE.TubeGeometry(curve,segments,1,sides,false),pos=g.attributes.position,uv=g.attributes.uv,c=new THREE.Vector3(),v=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){const t=uv.getX(i);curve.getPointAt(t,c);v.set(pos.getX(i),pos.getY(i),pos.getZ(i)).sub(c);const barkRipple=1+(branch.order<=2?.018:.010)*Math.sin(t*18+branch.phase)+(branch.order===0?jitter(.009):0),r=radiusAt(branch,t)*barkRipple;v.multiplyScalar(r);pos.setXYZ(i,c.x+v.x,c.y+v.y,c.z+v.z)}

}
function renderWood(){const buckets=Array.from({length:6},()=>[]);for(const b of branches)buckets[b.order].push(taperedTube(b));buckets.forEach((geoms,order)=>{if(!geoms.length)return;const merged=mergeGeometries(geoms,false);geoms.forEach(g=>g.dispose());const mesh=new THREE.Mesh(merged,woodMats[order]);mesh.castShadow=order<=2;mesh.receiveShadow=order<=3;treeRoot.add(mesh);generatedMeshes.push(mesh)})}

// 06 — MATURE OPEN-GROWN OAK ARCHITECTURE
function buildArchitecture(size,branchDensity){
  branches.length=0;
  // The bole stops being a pole: it flows directly into one dominant leader and two co-dominant leaders.
  const trunkH=7.8*size,trunk=makeBranch(new THREE.Vector3(0,0,0),new THREE.Vector3(.018,1,.008),trunkH,1.30*size,.50*size,0,null);
  const rootCount=6+Math.floor(rnd()*3);for(let i=0;i<rootCount;i++){const a=rnd()*Math.PI*2,dir=new THREE.Vector3(Math.cos(a),-.02+rnd()*.045,Math.sin(a)).normalize(),len=randRange(1.45,2.65)*size;makeBranch(new THREE.Vector3(jitter(.10),.16,jitter(.10)),dir,len,randRange(.23,.34)*size,.045*size,1,trunk,{droop:-.06})}

  const leaders=[];
  const topT=.985,top=pointAt(trunk,topT),topR=radiusAt(trunk,topT),topTang=tangentAt(trunk,topT);
  let d=topTang.clone().multiplyScalar(.82).add(new THREE.Vector3(jitter(.30),.32,jitter(.30))).normalize();leaders.push(makeBranch(top,d,randRange(4.7,6.0)*size,topR*.96,.040*size,1,trunk,{droop:0}));
  [randRange(.70,.78),randRange(.77,.86)].forEach((t,idx)=>{const p=pointAt(trunk,t),r=radiusAt(trunk,t),az=randRange(0,Math.PI*2)+idx*2.1,dir=new THREE.Vector3(Math.cos(az),randRange(.28,.48),Math.sin(az)).normalize();leaders.push(makeBranch(p,dir,randRange(4.5,6.4)*size,r*randRange(.60,.76),.040*size,1,trunk,{droop:idx===0?-.02:0}))});

  const primary=[];let angle=rnd()*Math.PI*2,primaryCount=Math.round((8+Math.floor(rnd()*3))*branchDensity);
  for(let i=0;i<primaryCount;i++){
    const baseT=.25+.52*((i+rnd()*.55)/Math.max(1,primaryCount-1));angle+=randRange(.62,1.62);const start=pointAt(trunk,baseT),localR=radiusAt(trunk,baseT),heightRatio=start.y/trunkH,az=angle+jitter(.42),elev=.06+.25*heightRatio+jitter(.18),dir=new THREE.Vector3(Math.cos(az),elev,Math.sin(az)).normalize();
    const exceptional=rnd()<.18?1.18:1,len=randRange(5.2,8.4)*size*exceptional,r0=localR*randRange(.40,.60)*exceptional,r1=Math.max(.042*size,r0*randRange(.08,.14)),droop=heightRatio<.48&&rnd()<.50?-.08-randRange(0,.06):0;
    const b=makeBranch(start,dir,len,r0,r1,1,trunk,{droop});if(b)primary.push(b);
  }

  function childDirection(parent,t,continuation,childOrder){
    const tang=tangentAt(parent,t),ref=Math.abs(tang.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0),u=new THREE.Vector3().crossVectors(tang,ref).normalize(),v=new THREE.Vector3().crossVectors(tang,u).normalize(),ang=rnd()*Math.PI*2,side=u.multiplyScalar(Math.cos(ang)).add(v.multiplyScalar(Math.sin(ang))).normalize(),origin=pointAt(parent,t),outward=new THREE.Vector3(origin.x,0,origin.z);if(outward.lengthSq()>.02)outward.normalize();
    const keep=continuation?randRange(.80,.94):randRange(.38,.64),spread=continuation?randRange(.12,.29):randRange(.58,.96),dir=tang.clone().multiplyScalar(keep).add(side.multiplyScalar(spread));if(outward.lengthSq())dir.addScaledVector(outward,childOrder<=2?.17:.09);const h=origin.y/(13*size);dir.y+=childOrder<=2?.04+.15*h:.055;if(parent.order<=2&&h<.43&&rnd()<.13)dir.y-=randRange(.10,.22);return dir.normalize();
  }
  function spawn(parent){
    if(!parent||parent.order>=5||branches.length>=MAX_BRANCHES)return;const order=parent.order,next=order+1;
    let baseCount=order===1?randRange(5.2,7.5):order===2?randRange(4.0,5.8):order===3?randRange(3.1,4.6):randRange(4.5,6.8);baseCount=Math.max(1,Math.round(baseCount*branchDensity*randRange(.84,1.16)));if(rnd()<.09)baseCount=Math.max(1,Math.floor(baseCount*.55));if(rnd()<.08)baseCount+=2;
    for(let n=0;n<baseCount&&branches.length<MAX_BRANCHES;n++){
      const continuation=n===0,t=continuation?randRange(.77,.95):randRange(.20,.92),origin=pointAt(parent,t),localR=radiusAt(parent,t);let rf=continuation?randRange(.61,.78):randRange(.29,.51);if(!continuation&&order<=2&&rnd()<.09)rf=randRange(.55,.68);const r0=Math.max(.0032*size,localR*rf),r1=Math.max(next===5?.00065*size:.0018*size,r0*(next===5?randRange(.04,.085):randRange(.10,.21))),lf=continuation?randRange(.56,.76):randRange(.36,.62),len=Math.max(.14*size,parent.length*lf*(next>=4?.82:1)),dir=childDirection(parent,t,continuation,next),droop=(next<=3&&rnd()<.07)?-randRange(.05,.13):0,child=makeBranch(origin,dir,len,r0,r1,next,parent,{droop});spawn(child);
    }
  }
  [...leaders,...primary].forEach(spawn);return trunk;
}

// 07 — OAK LEAVES, ONLY ON CURRENT SHOOTS
function leafShape(variant){const s=new THREE.Shape();s.moveTo(0,0);const widen=1+variant*.025,notch=(variant%2)*.035,pts=[[.07,.08],[.15,.17],[.30*widen,.23],[.36,.34],[.24,.42],[.43,.52+notch],[.45*widen,.64],[.30,.71],[.39,.83],[.32,.95],[.16,.98],[.20,1.09],[.09,1.18],[0,1.29],[-.09,1.18],[-.20,1.09],[-.16,.98],[-.32,.95],[-.39,.83],[-.30,.71],[-.45*widen,.64],[-.43,.52+notch],[-.24,.42],[-.36,.34],[-.30*widen,.23],[-.15,.17],[-.07,.08]];pts.forEach(p=>s.lineTo(p[0],p[1]));s.closePath();return new THREE.ShapeGeometry(s)}
const leafGeos=[0,1,2,3].map(leafShape);
function renderLeaves(leafDensity){
  const shoots=branches.filter(b=>b.order===5),leafSpecs=Array.from({length:leafGeos.length},()=>Array.from({length:leafMats.length},()=>[])),petioles=[],crownBox=new THREE.Box3();for(const b of branches)for(const p of b.points)crownBox.expandByPoint(p);const crownCenter=crownBox.getCenter(new THREE.Vector3()),crownSize=crownBox.getSize(new THREE.Vector3()),sunDir=sun.position.clone().normalize(),localY=new THREE.Vector3(0,1,0);let leafCount=0;
  function bucket(p){const rel=p.clone().sub(crownCenter),depth=Math.min(1,Math.sqrt((rel.x/(crownSize.x*.5))**2+(rel.y/(crownSize.y*.5))**2+(rel.z/(crownSize.z*.5))**2)),sunFacing=(rel.normalize().dot(sunDir)+1)*.5,ex=.54*depth+.46*sunFacing+jitter(.10);return Math.max(0,Math.min(leafMats.length-1,Math.floor(ex*leafMats.length)))}
  for(const shoot of shoots){const curve=shoot.curve||new THREE.CatmullRomCurve3(shoot.points,false,'centripetal'),nodes=Math.max(7,Math.round(randRange(11,17)*leafDensity)),phase=rnd()*Math.PI*2;for(let i=0;i<nodes;i++){const f=(i+.30+rnd()*.34)/nodes,t=.18+.80*Math.pow(f,.68),attach=curve.getPointAt(Math.min(.992,t)),axis=curve.getTangentAt(Math.min(.992,t)).normalize(),ref=Math.abs(axis.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0),u=new THREE.Vector3().crossVectors(axis,ref).normalize(),v=new THREE.Vector3().crossVectors(axis,u).normalize(),ang=phase+i*2.399963+jitter(.28),side=u.multiplyScalar(Math.cos(ang)).add(v.multiplyScalar(Math.sin(ang))).normalize(),petLen=randRange(.032,.068),leafBase=attach.clone().add(side.clone().multiplyScalar(petLen));petioles.push({a:attach,b:leafBase,r:randRange(.0013,.0021)});const leafDir=side.clone().multiplyScalar(.89).add(axis.clone().multiplyScalar(.13+jitter(.08))).add(new THREE.Vector3(0,.03+jitter(.05),0)).normalize(),q=new THREE.Quaternion().setFromUnitVectors(localY,leafDir),roll=new THREE.Quaternion().setFromAxisAngle(leafDir,jitter(.36));q.premultiply(roll);const size=randRange(.074,.116),shape=Math.floor(rnd()*leafGeos.length),mat=bucket(leafBase);leafSpecs[shape][mat].push({p:leafBase,q,s:new THREE.Vector3(size*randRange(.80,1.0),size,size)});leafCount++}}
  const up=new THREE.Vector3(0,1,0),mid=new THREE.Vector3(),delta=new THREE.Vector3(),quat=new THREE.Quaternion(),scaleV=new THREE.Vector3(),matrix=new THREE.Matrix4();
  if(petioles.length){const geo=new THREE.CylinderGeometry(.62,1,1,4,1,false),inst=new THREE.InstancedMesh(geo,petioleMat,petioles.length);inst.receiveShadow=true;petioles.forEach((s,k)=>{delta.subVectors(s.b,s.a);mid.copy(s.a).add(s.b).multiplyScalar(.5);quat.setFromUnitVectors(up,delta.clone().normalize());scaleV.set(s.r,delta.length(),s.r);matrix.compose(mid,quat,scaleV);inst.setMatrixAt(k,matrix)});inst.instanceMatrix.needsUpdate=true;treeRoot.add(inst);generatedMeshes.push(inst)}
  leafSpecs.forEach((byMat,shape)=>byMat.forEach((items,mat)=>{if(!items.length)return;const inst=new THREE.InstancedMesh(leafGeos[shape],leafMats[mat],items.length);inst.castShadow=false;inst.receiveShadow=true;items.forEach((v,k)=>{matrix.compose(v.p,v.q,v.s);inst.setMatrixAt(k,matrix)});inst.instanceMatrix.needsUpdate=true;treeRoot.add(inst);generatedMeshes.push(inst)}));return{leafCount,crownBox};
}

// 08 — SIMPLE FILLED CANOPY SHADOW
function addCanopyShadow(box){const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),mat=new THREE.MeshBasicMaterial({color:0x000000,colorWrite:false,depthWrite:false}),geo=new THREE.SphereGeometry(1,14,8),blobs=[{p:center.clone().add(new THREE.Vector3(0,size.y*.05,0)),s:new THREE.Vector3(size.x*.38,size.y*.23,size.z*.37)},{p:center.clone().add(new THREE.Vector3(-size.x*.22,-size.y*.05,0)),s:new THREE.Vector3(size.x*.24,size.y*.18,size.z*.27)},{p:center.clone().add(new THREE.Vector3(size.x*.22,-size.y*.02,0)),s:new THREE.Vector3(size.x*.24,size.y*.18,size.z*.27)}];blobs.forEach(b=>{const m=new THREE.Mesh(geo,mat);m.position.copy(b.p);m.scale.copy(b.s);m.castShadow=true;treeRoot.add(m);generatedMeshes.push(m)})}

// 09 — BUILD / REBUILD
function clearTree(){for(const m of generatedMeshes){if(m.geometry&&m.geometry!==ground.geometry)m.geometry.dispose();treeRoot.remove(m)}generatedMeshes=[];while(treeRoot.children.length)treeRoot.remove(treeRoot.children[0])}
function generate(){document.querySelector('#status').style.display='block';document.querySelector('#status').textContent='Growing oak…';setTimeout(()=>{clearTree();const size=+document.querySelector('#sizeInput').value,branchDensity=+document.querySelector('#branchInput').value,leafDensity=+document.querySelector('#leafInput').value;randomness=+document.querySelector('#randomInput').value;resetRandom(+document.querySelector('#seedInput').value);buildArchitecture(size,branchDensity);renderWood();const result=renderLeaves(leafDensity);addCanopyShadow(result.crownBox);console.log(`oak: ${branches.length} woody branches, ${branches.filter(b=>b.order===5).length} current shoots, ${result.leafCount} attached leaves`);document.querySelector('#status').style.display='none'},20)}

// 10 — UI + RENDER LOOP
document.querySelector('#gear').onclick=()=>document.querySelector('#panel').classList.toggle('show');document.querySelector('#regen').onclick=generate;document.querySelector('#newSeed').onclick=()=>{document.querySelector('#seedInput').value=Math.floor(1+Math.random()*999999999);generate()};function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();generate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.24,6000);
</script>
</body>
