  const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3()),mat=new THREE.MeshBasicMaterial({color:0x000000,colorWrite:false,depthWrite:false}),geo=new THREE.SphereGeometry(1,14,8),blobs=[
    {p:center.clone().add(new THREE.Vector3(0,size.y*.05,0)),s:new THREE.Vector3(size.x*.38,size.y*.23,size.z*.37)},
    {p:center.clone().add(new THREE.Vector3(-size.x*.22,-size.y*.05,0)),s:new THREE.Vector3(size.x*.24,size.y*.18,size.z*.27)},
    {p:center.clone().add(new THREE.Vector3(size.x*.22,-size.y*.02,0)),s:new THREE.Vector3(size.x*.24,size.y*.18,size.z*.27)}
  ];
  blobs.forEach(b=>{const m=new THREE.Mesh(geo,mat);m.position.copy(b.p);m.scale.copy(b.s);m.castShadow=true;treeRoot.add(m);generatedMeshes.push(m)});
}

// 09 — BUILD / REBUILD
function clearTree(){for(const m of generatedMeshes){if(m.geometry&&m.geometry!==ground.geometry)m.geometry.dispose();treeRoot.remove(m)}generatedMeshes=[];while(treeRoot.children.length)treeRoot.remove(treeRoot.children[0])}
function generate(){
  document.querySelector('#status').style.display='block';document.querySelector('#status').textContent='Growing oak…';
  setTimeout(()=>{clearTree();const size=+document.querySelector('#sizeInput').value,branchDensity=+document.querySelector('#branchInput').value,leafDensity=+document.querySelector('#leafInput').value;randomness=+document.querySelector('#randomInput').value;resetRandom(+document.querySelector('#seedInput').value);buildArchitecture(size,branchDensity);renderWood();const result=renderLeaves(leafDensity);addCanopyShadow(result.crownBox);console.log(`oak: ${branches.length} woody branches, ${branches.filter(b=>b.order===5).length} current shoots, ${result.leafCount} attached leaves`);document.querySelector('#status').style.display='none'},20);
}

// 10 — UI + RENDER LOOP
document.querySelector('#gear').onclick=()=>document.querySelector('#panel').classList.toggle('show');document.querySelector('#regen').onclick=generate;document.querySelector('#newSeed').onclick=()=>{document.querySelector('#seedInput').value=Math.floor(1+Math.random()*999999999);generate()};
function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();generate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.24,6000);
</script>
