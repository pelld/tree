<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tree — English oak branch study</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd7c5;font-family:system-ui;color:#182016}
canvas{display:block;touch-action:none}
#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}
#title b{display:block;font:600 22px Georgia,serif}
#title span{font-size:12px;font-style:italic;opacity:.76}
#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none;transition:opacity 1s}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;padding:10px 14px;border-radius:20px;background:#ffffffdd;font-size:13px;box-shadow:0 4px 20px #0002;pointer-events:none}
#gear{position:fixed;right:12px;top:12px;z-index:5;width:38px;height:38px;border:0;border-radius:19px;background:#172117cc;color:#fff;font-size:18px}
#panel{display:none;position:fixed;right:12px;top:58px;z-index:5;width:220px;padding:12px;border-radius:12px;background:#f5f7f0ee;box-shadow:0 5px 22px #0003;font-size:12px}
#panel.show{display:block}
#panel label{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:7px;margin:7px 0}
#panel input{min-width:0;width:100%}
#panel .buttons{display:flex;gap:7px;margin-top:10px}
#panel button{flex:1;border:0;border-radius:8px;padding:8px;background:#263722;color:#fff}
</style>
</head>
<body>
<div id="title"><b>English oak</b><span>branch study · spread secondary framework · no leaves</span></div>
<div id="status">Growing oak branch…</div>
<div id="hint">Drag to orbit · pinch / scroll to inspect</div>
<button id="gear">⚙</button>
<div id="panel">
  <label><span>Seed</span><input id="seedInput" type="number" value="88231"></label>
  <label><span>Branching</span><input id="densityInput" type="range" min="0.80" max="1.20" step="0.05" value="1"></label>
  <label><span>Randomness</span><input id="randomInput" type="range" min="0.1" max="0.5" step="0.05" value="0.16"></label>
  <div class="buttons"><button id="regen">Regenerate</button><button id="newSeed">New seed</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

// 01 — SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xcbd7c5);
scene.fog=new THREE.FogExp2(0xcbd7c5,.0032);
const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.03,220);
camera.position.set(10.2,8.15,18.0);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-4.9,5.35,-.35);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.minDistance=.18;
controls.maxDistance=50;
controls.zoomToCursor=true;
scene.add(new THREE.HemisphereLight(0xdce8d5,0x4a4237,1.55));
const sun=new THREE.DirectionalLight(0xffefd0,3.0);
sun.position.set(-14,24,11);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-7;scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,72),new THREE.MeshStandardMaterial({color:0x788861,roughness:1}));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// 02 — MODEL + SEEDED RANDOMNESS
const mats=[0x493b30,0x514136,0x554437,0x594838,0x493b2f].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));
const treeRoot=new THREE.Group();scene.add(treeRoot);
let meshes=[];const branches=[];let seed=88231,randomness=.16;
function reset(v){seed=Math.max(1,Math.floor(v)||1)%2147483647;if(!seed)seed=1}
function rnd(){seed=seed*16807%2147483647;return(seed-1)/2147483646}
function rr(a,b){return a+(b-a)*rnd()}
function jit(a){return(rnd()-.5)*a*randomness}
function branch(points,r0,r1,order,parent=null){const curve=new THREE.CatmullRomCurve3(points,false,'centripetal'),b={points,r0,r1,order,parent,children:[],curve,length:curve.getLength(),phase:rnd()*6.283};if(parent)parent.children.push(b);branches.push(b);return b}
function pointAt(b,t){return b.curve.getPointAt(THREE.MathUtils.clamp(t,0,1))}
function tangentAt(b,t){return b.curve.getTangentAt(THREE.MathUtils.clamp(t,0,1)).normalize()}
function radiusAt(b,t){return b.r1+(b.r0-b.r1)*Math.pow(1-t,.68)}
function frameAt(parent,t){const tan=tangentAt(parent,t),ref=Math.abs(tan.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0),u=new THREE.Vector3().crossVectors(tan,ref).normalize(),v=new THREE.Vector3().crossVectors(u,tan).normalize();return{tan,u,v}}
function dirAround(parent,t,azimuth,angle,verticalBias=0){const {tan,u,v}=frameAt(parent,t),radial=u.clone().multiplyScalar(Math.cos(azimuth)).add(v.clone().multiplyScalar(Math.sin(azimuth))).normalize(),d=tan.clone().multiplyScalar(Math.cos(angle)).add(radial.multiplyScalar(Math.sin(angle)));d.y+=verticalBias;return d.normalize()}

// 03 — ORGANIC AXIS
// Large branches leave tangentially, stay fairly flat at first and only then adopt
// their mature direction. A late-rise term lets an oak limb lift farther from the fork.
function growAxis(parent,t,targetDir,len,r0,r1,order,{rise=0,lateRise=0,droop=0,wander=1,elbow=0}={}){
  const start=pointAt(parent,t),parentTan=tangentAt(parent,t),steps=order===2?18:order===3?15:12,pts=[start.clone()];
  const ref=Math.abs(targetDir.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
  const side=new THREE.Vector3().crossVectors(targetDir,ref).normalize().multiplyScalar(elbow);
  let p=start.clone();
  for(let i=1;i<=steps;i++){
    const f=i/steps,endTurn=order===2?.86:order===3?.80:.74,ease=THREE.MathUtils.smoothstep(f,.05,endTurn),d=parentTan.clone().lerp(targetDir,ease);
    d.addScaledVector(side,Math.sin(Math.PI*Math.max(0,(f-.30)/.70))*.30);
    const wig=(order===2?.008:order===3?.014:.021)*wander;
    d.x+=jit(wig);d.z+=jit(wig);
    d.y+=jit(wig*.45)+rise*Math.sin(Math.PI*f)+lateRise*THREE.MathUtils.smoothstep(f,.48,.95)-droop*f*f;
    d.normalize();
    p=p.clone().add(d.multiplyScalar(len/steps*(.994+rr(-.009,.012))));pts.push(p.clone());
  }
  return branch(pts,r0,r1,order,parent);
}

// 04 — SMOOTH TAPER + STRONGER BRANCH COLLARS
function render(){
  const buckets=Array.from({length:5},()=>[]);
  for(const b of branches){
    const seg=b.order===0?48:b.order===1?54:b.order===2?42:b.order===3?31:22,sides=b.order===0?14:b.order===1?12:b.order===2?10:b.order===3?8:6;
    const g=new THREE.TubeGeometry(b.curve,seg,1,sides,false),pos=g.attributes.position,uv=g.attributes.uv,c=new THREE.Vector3(),v=new THREE.Vector3();
    for(let i=0;i<pos.count;i++){
      const t=uv.getX(i);b.curve.getPointAt(t,c);v.set(pos.getX(i),pos.getY(i),pos.getZ(i)).sub(c);
      const collar=b.parent&&t<.20?1+(b.order===2?.40:b.order===3?.26:.14)*(1-t/.20):1;
      const r=radiusAt(b,t)*collar*(1+(b.order<3?.0045:.0022)*Math.sin(15*t+b.phase));
      v.multiplyScalar(r);pos.setXYZ(i,c.x+v.x,c.y+v.y,c.z+v.z);
    }
    g.computeVertexNormals();buckets[b.order].push(g);
  }
  buckets.forEach((gs,o)=>{if(!gs.length)return;const merged=mergeGeometries(gs,false);gs.forEach(g=>g.dispose());const m=new THREE.Mesh(merged,mats[o]);m.castShadow=true;m.receiveShadow=true;treeRoot.add(m);meshes.push(m)});
}

// 05 — ONE SECONDARY SYSTEM
// Exactly one mid-lateral and one distal fork. Order-2 systems get one further
// structural generation so the outer half is not just a set of bare sticks.
function growSystem(axis,phase,density=1){
  const next=Math.min(4,axis.order+1);

  const midT=rr(.54,.66),midR=radiusAt(axis,midT),midAz=phase+(rnd()<.5?-1:1)*rr(1.45,2.05),midBias=rr(-.035,.065);
  const mid=growAxis(axis,midT,dirAround(axis,midT,midAz,rr(.50,.70),midBias),axis.length*rr(.38,.47)*density,midR*rr(.50,.59),midR*rr(.18,.24),next,{rise:midBias>0?.003:0,droop:midBias<0?.012:0,wander:.40,elbow:rr(-.08,.08)});

  const t=.978,r=radiusAt(axis,t),contBias=rr(.015,.050);
  const cont=growAxis(axis,t,dirAround(axis,t,phase+jit(.05),rr(.13,.23),contBias),axis.length*rr(.57,.66),r*rr(.86,.91),r*rr(.43,.50),next,{rise:.002,lateRise:axis.order===2?.015:0,wander:.30,elbow:rr(-.05,.05)});
  const latAz=phase+(rnd()<.5?-1:1)*rr(1.65,2.20),latBias=rr(-.035,.070);
  const lat=growAxis(axis,t,dirAround(axis,t,latAz,rr(.55,.76),latBias),axis.length*rr(.43,.52),r*rr(.60,.68),r*rr(.28,.35),next,{rise:latBias>0?.002:0,droop:latBias<0?.011:0,wander:.37,elbow:rr(-.08,.08)});

  if(axis.order===2){
    growSystem(mid,phase+rr(.72,1.05),density*.88);
    growSystem(cont,phase+rr(.35,.62),density*.94);
    growSystem(lat,phase-rr(.45,.78),density*.90);
  }
  return{mid,cont,lat};
}

function build(density){
  branches.length=0;
  const trunkPts=[new THREE.Vector3(0,0,0),new THREE.Vector3(.02,1.25,.01),new THREE.Vector3(.04,2.50,.02),new THREE.Vector3(.02,3.75,.04),new THREE.Vector3(-.02,4.95,.06),new THREE.Vector3(-.05,5.65,.08)];
  const trunk=branch(trunkPts,1.0,.54,0,null),attach=pointAt(trunk,.73),tr=radiusAt(trunk,.73);

  const p=[attach.clone(),attach.clone().add(new THREE.Vector3(-.70,.30,-.02)),attach.clone().add(new THREE.Vector3(-1.58,.58,-.10)),attach.clone().add(new THREE.Vector3(-2.58,.79,-.22)),attach.clone().add(new THREE.Vector3(-3.62,.88,-.37)),attach.clone().add(new THREE.Vector3(-4.62,.85,-.50)),attach.clone().add(new THREE.Vector3(-5.56,.73,-.58)),attach.clone().add(new THREE.Vector3(-6.38,.62,-.57)),attach.clone().add(new THREE.Vector3(-7.08,.64,-.46))];
  const primary=branch(p,tr*.66,tr*.23,1,trunk);

  // Spread the three main secondaries along the scaffold instead of bunching them near the trunk.
  const systems=[];
  const specs=[
    // Upper: almost flat at take-off, then rises farther out.
    {t:.28,dir:new THREE.Vector3(-1,.08,-.24),len:4.15,base:.66,tip:.28,lateRise:.12,elbow:-.07},
    // Lower/back: a modest downward start, not a hanging branch.
    {t:.52,dir:new THREE.Vector3(-1,-.20,.50),len:3.70,base:.60,tip:.25,droop:.018,elbow:.08},
    // Middle/front: close to horizontal, with only a gentle lift.
    {t:.74,dir:new THREE.Vector3(-1,.10,.46),len:3.35,base:.58,tip:.24,lateRise:.035,elbow:.06}
  ];
  for(const s of specs){
    const r=radiusAt(primary,s.t);
    systems.push(growAxis(primary,s.t,s.dir.clone().normalize(),s.len,r*s.base,r*s.tip,2,{lateRise:s.lateRise||0,droop:s.droop||0,wander:.30,elbow:s.elbow}));
  }

  // A substantial distal fork closes the scaffold instead of leaving a bare pipe ending.
  const forkT=.94,forkR=radiusAt(primary,forkT);
  const upper=growAxis(primary,forkT,new THREE.Vector3(-1,.16,-.24).normalize(),3.15,forkR*.82,forkR*.34,2,{lateRise:.055,wander:.28,elbow:-.05});
  const outer=growAxis(primary,forkT,new THREE.Vector3(-1,.03,.48).normalize(),2.95,forkR*.71,forkR*.30,2,{wander:.28,elbow:.07});
  systems.push(upper,outer);

  systems.forEach((s,i)=>growSystem(s,i*.91,+density));
}

// 06 — UI
function clear(){for(const m of meshes){if(m.geometry)m.geometry.dispose();treeRoot.remove(m)}meshes=[];while(treeRoot.children.length)treeRoot.remove(treeRoot.children[0])}
function generate(){document.querySelector('#status').style.display='block';setTimeout(()=>{clear();randomness=+document.querySelector('#randomInput').value;reset(+document.querySelector('#seedInput').value);build(+document.querySelector('#densityInput').value);render();document.querySelector('#status').style.display='none';console.log(`oak limb: ${branches.length} woody axes`)},20)}
document.querySelector('#gear').onclick=()=>document.querySelector('#panel').classList.toggle('show');
document.querySelector('#regen').onclick=generate;
document.querySelector('#newSeed').onclick=()=>{document.querySelector('#seedInput').value=Math.floor(1+Math.random()*999999999);generate()};
function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}
animate();generate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
setTimeout(()=>document.querySelector('#hint').style.opacity=.24,6000);
</script>
</body>
</html>
