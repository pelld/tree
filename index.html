<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tree — English oak</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd7c5;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}
#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}#title b{display:block;font:600 22px Georgia,serif}#title span{font-size:12px;font-style:italic;opacity:.7}
#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none;transition:opacity 1s}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;padding:10px 14px;border-radius:20px;background:#ffffffcc;font-size:13px;box-shadow:0 4px 20px #0002;pointer-events:none}
</style>
</head>
<body>
<div id="title"><b>English oak</b><span>Quercus robur · mature open-grown specimen</span></div>
<div id="status">Growing oak…</div>
<div id="hint">Drag to orbit · pinch / scroll to inspect</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// 01 — SCENE
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcbd7c5);scene.fog=new THREE.FogExp2(0xcbd7c5,.0045);
const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.02,300);camera.position.set(28,12.5,32);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,8.2,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=.15;controls.maxDistance=80;controls.zoomToCursor=true;
scene.add(new THREE.HemisphereLight(0xeaf2e2,0x514939,2.2));const sun=new THREE.DirectionalLight(0xffefd0,2.7);sun.position.set(-16,27,11);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-8;scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(55,80),new THREE.MeshStandardMaterial({color:0x788861,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// 02 — REPEATABLE NATURAL VARIATION
let seed=73019;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};const j=a=>(rnd()-.5)*a;
const barkMat=new THREE.MeshStandardMaterial({color:0x493d32,roughness:1,flatShading:true});const branchMat=new THREE.MeshStandardMaterial({color:0x564535,roughness:1,flatShading:true});const twigMat=new THREE.MeshStandardMaterial({color:0x65523c,roughness:.98});const fissureMat=new THREE.MeshStandardMaterial({color:0x28211c,roughness:1});
const leafMats=[0x244721,0x2d5427,0x365e2c,0x406832,0x31582a,0x486f38].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.9,side:THREE.DoubleSide}));

// 03 — UNIQUE HEAVY WOOD: bole and roots
function woodMesh(a,b,r0,r1,material=barkMat,sides=10){const d=new THREE.Vector3().subVectors(b,a),len=d.length();const g=new THREE.CylinderGeometry(r1,r0,len,sides,3,false);const pos=g.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),n=1+j(Math.min(.10,r0*.12));pos.setX(i,x*n);pos.setZ(i,z*n)}g.computeVertexNormals();const m=new THREE.Mesh(g,material);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());m.castShadow=m.receiveShadow=true;scene.add(m);return m}

// 04 — BOLE AND ROOT FLARE
const trunkRadius=y=>Math.max(.62,1.55-y*.092);let prev=new THREE.Vector3(0,0,0);
for(let i=1;i<=13;i++){const y=i*.62,p=new THREE.Vector3(.007*y*y+Math.sin(i*.67)*.045,y,Math.sin(i*.41)*.075);woodMesh(prev,p,trunkRadius((i-1)*.62),trunkRadius(y),barkMat,12);prev=p}
for(let n=0;n<13;n++){const a=n/13*6.283+j(.16),s=new THREE.Vector3(Math.cos(a)*.78,.42,Math.sin(a)*.78),m=new THREE.Vector3(Math.cos(a+j(.08))*(1.45+rnd()*.72),.14,Math.sin(a+j(.08))*(1.45+rnd()*.72)),e=new THREE.Vector3(Math.cos(a+j(.13))*(3.2+rnd()*2.6),.025,Math.sin(a+j(.13))*(3.2+rnd()*2.6));woodMesh(s,m,.48,.19,barkMat,9);woodMesh(m,e,.19,.025,barkMat,7)}

// 05 — OLD OAK BARK FISSURES
for(let n=0;n<58;n++){const a=n/58*6.283+j(.08),y=.18+rnd()*5.8,len=.5+rnd()*1.45,r=trunkRadius(y)+.018,curve=new THREE.CatmullRomCurve3([new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r),new THREE.Vector3(Math.cos(a+j(.065))*r,y+len*.48,Math.sin(a+j(.065))*r),new THREE.Vector3(Math.cos(a+j(.09))*r,y+len,Math.sin(a+j(.09))*r)]);scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,4,.018+rnd()*.012,3,false),fissureMat))}

// 06 — INSTANCED BRANCH SYSTEM. Thousands of segments, but only three draw calls.
const branchBuckets=[[],[],[]];const MAX_BRANCH_SEGMENTS=14000;let branchCount=0;const foliageCenters=[];const tips=[];
function queueWood(a,b,r){if(branchCount>=MAX_BRANCH_SEGMENTS)return false;const bucket=r>.15?0:r>.055?1:2;branchBuckets[bucket].push({a:a.clone(),b:b.clone(),r});branchCount++;return true}
function grow(start,dir,len,r,order,energy=1){if(branchCount>=MAX_BRANCH_SEGMENTS||len<.08||r<.007)return;let p=start.clone(),d=dir.clone().normalize(),rr=r;const units=order>=4?3:2;
 for(let s=0;s<units;s++){const nd=d.clone();nd.x+=j(.15);nd.z+=j(.15);nd.y+=j(.09);nd.normalize();const q=p.clone().add(nd.clone().multiplyScalar((len/units)*(.88+rnd()*.20)));if(!queueWood(p,q,rr))return;p=q;d.lerp(nd,.72).normalize();rr*=.88;if(order<=2&&order>0&&rnd()<.48){const side=d.clone();side.x+=j(1.05);side.z+=j(1.05);side.y+=j(.42)+.07;grow(p,side,len*.27,rr*.42,order-1,energy*.58)}}
 if(order<=2)foliageCenters.push({p:p.clone(),d:d.clone(),energy});if(order===0){tips.push({p:p.clone(),d:d.clone(),energy});return}
 const children=order>=4?3:(rnd()<.54?3:2);for(let k=0;k<children;k++){const c=d.clone(),spread=order>3?.52:order>1?.72:.88;c.x+=j(spread);c.z+=j(spread);c.y+=j(.33)+(order<3?.075:0);const dominant=k===0?1:.72+rnd()*.18;grow(p,c,len*(.50+rnd()*.12)*dominant,rr*(.58+rnd()*.07),order-1,energy*dominant)}}

// 07 — PRIMARY OAK ARCHITECTURE: broad, unequal scaffold limbs and overlapping subordinate crowns.
const limbs=[[3.0,.16,.18,6.4,.72],[3.55,2.58,.12,6.0,.67],[4.15,4.18,.20,6.1,.64],[4.75,5.52,.17,5.8,.60],[5.25,1.30,.27,5.6,.56],[5.78,3.18,.24,5.4,.53],[6.30,4.78,.33,5.1,.49],[6.82,.48,.38,4.8,.46],[7.28,2.12,.44,4.3,.41],[7.65,3.72,.50,4.0,.37]];
limbs.forEach(([y,a,rise,len,r])=>{const p=new THREE.Vector3(.007*y*y,y,Math.sin(y*.41)*.075),d=new THREE.Vector3(Math.cos(a),rise,Math.sin(a)).normalize();grow(p,d,len,r,5,1)});
for(let n=0;n<12;n++){const y=3.6+rnd()*4.0,a=rnd()*6.283,rise=.16+rnd()*.48,p=new THREE.Vector3(.007*y*y,y,Math.sin(y*.41)*.075),d=new THREE.Vector3(Math.cos(a),rise,Math.sin(a)).normalize();grow(p,d,2.5+rnd()*1.3,.13+rnd()*.10,3,.75)}

// 08 — BUILD INSTANCED BRANCHES
const unitGeos=[new THREE.CylinderGeometry(.80,1,1,9,1,false),new THREE.CylinderGeometry(.76,1,1,7,1,false),new THREE.CylinderGeometry(.70,1,1,5,1,false)];const mats=[barkMat,branchMat,twigMat];const up=new THREE.Vector3(0,1,0),mid=new THREE.Vector3(),delta=new THREE.Vector3(),quat=new THREE.Quaternion(),scaleV=new THREE.Vector3(),matrix=new THREE.Matrix4();
branchBuckets.forEach((items,b)=>{if(!items.length)return;const inst=new THREE.InstancedMesh(unitGeos[b],mats[b],items.length);inst.castShadow=b<2;inst.receiveShadow=b===0;items.forEach((s,i)=>{delta.subVectors(s.b,s.a);const length=delta.length();mid.copy(s.a).add(s.b).multiplyScalar(.5);quat.setFromUnitVectors(up,delta.clone().normalize());scaleV.set(s.r,length,s.r);matrix.compose(mid,quat,scaleV);inst.setMatrixAt(i,matrix)});inst.instanceMatrix.needsUpdate=true;scene.add(inst)});

// 09 — TRUE LOBED OAK LEAVES, INSTANCED FOR MOBILE PERFORMANCE
function makeLeaf(){const s=new THREE.Shape();s.moveTo(0,-.53);[[.12,-.48],[.26,-.45],[.31,-.34],[.23,-.26],[.43,-.16],[.45,-.04],[.30,.05],[.42,.17],[.36,.29],[.19,.32],[.27,.43],[.13,.52],[0,.62],[-.13,.52],[-.27,.43],[-.19,.32],[-.36,.29],[-.42,.17],[-.30,.05],[-.45,-.04],[-.43,-.16],[-.23,-.26],[-.31,-.34],[-.26,-.45],[-.12,-.48]].forEach(v=>s.lineTo(...v));return new THREE.ShapeGeometry(s)}
const leafGeo=makeLeaf();const leafSpecs=[[],[],[],[],[],[]];const MAX_LEAVES=24000;let leafCount=0;
function addLeafSpec(p,size){if(leafCount>=MAX_LEAVES)return;const e=new THREE.Euler(j(1.25),rnd()*6.283,j(.95)),q=new THREE.Quaternion().setFromEuler(e),sx=size*(.72+rnd()*.45),sy=size*(.84+rnd()*.30);leafSpecs[Math.floor(rnd()*leafSpecs.length)].push({p:p.clone(),q,s:new THREE.Vector3(sx,sy,size)});leafCount++}
foliageCenters.forEach(c=>{if(leafCount>=MAX_LEAVES)return;const base=4+Math.floor(6*c.energy+rnd()*6),rad=.26+rnd()*.46;for(let i=0;i<base;i++){const a=rnd()*6.283,z=j(rad*.8),r=rad*Math.sqrt(rnd()),p=c.p.clone().add(new THREE.Vector3(Math.cos(a)*r,z,Math.sin(a)*r));addLeafSpec(p,.18+rnd()*.10)}});
tips.forEach(t=>{if(leafCount>=MAX_LEAVES)return;const count=10+Math.floor(rnd()*11),rad=.38+rnd()*.55;for(let i=0;i<count;i++){const a=rnd()*6.283,z=j(rad*.75),r=rad*Math.sqrt(rnd()),p=t.p.clone().add(new THREE.Vector3(Math.cos(a)*r,z,Math.sin(a)*r));addLeafSpec(p,.20+rnd()*.11)}});
leafSpecs.forEach((items,i)=>{if(!items.length)return;const inst=new THREE.InstancedMesh(leafGeo,leafMats[i],items.length);inst.castShadow=false;items.forEach((v,k)=>{matrix.compose(v.p,v.q,v.s);inst.setMatrixAt(k,matrix)});inst.instanceMatrix.needsUpdate=true;scene.add(inst)});

// 10 — SMALL EPICORMIC SHOOTS NEAR THE BOLE
for(let n=0;n<16;n++){const y=2.5+rnd()*4.5,a=rnd()*6.283,r=trunkRadius(y),p=new THREE.Vector3(.007*y*y+Math.cos(a)*r,y,Math.sin(a)*r),d=new THREE.Vector3(Math.cos(a),.28+rnd()*.35,Math.sin(a)).normalize(),q=p.clone().add(d.multiplyScalar(.45+rnd()*.5));woodMesh(p,q,.032,.014,twigMat,5)}

// 11 — RENDER
const status=document.querySelector('#status');status.style.display='none';
function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.25,6000);
</script>
</body>
</html>
