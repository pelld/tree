<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tree — English oak branch study</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd7c5;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}#title b{display:block;font:600 22px Georgia,serif}#title span{font-size:12px;font-style:italic;opacity:.76}#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none;transition:opacity 1s}#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;padding:10px 14px;border-radius:20px;background:#ffffffdd;font-size:13px;box-shadow:0 4px 20px #0002;pointer-events:none}#gear{position:fixed;right:12px;top:12px;z-index:5;width:38px;height:38px;border:0;border-radius:19px;background:#172117cc;color:#fff;font-size:18px}#panel{display:none;position:fixed;right:12px;top:58px;z-index:5;width:220px;padding:12px;border-radius:12px;background:#f5f7f0ee;box-shadow:0 5px 22px #0003;font-size:12px}#panel.show{display:block}#panel label{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:7px;margin:7px 0}#panel input{min-width:0;width:100%}#panel .buttons{display:flex;gap:7px;margin-top:10px}#panel button{flex:1;border:0;border-radius:8px;padding:8px;background:#263722;color:#fff}</style></head><body><div id="title"><b>English oak</b><span>branch study · one scaffold limb, no leaves</span></div><div id="status">Growing oak branch…</div><div id="hint">Drag to orbit · pinch / scroll to inspect</div><button id="gear">⚙</button><div id="panel"><label><span>Seed</span><input id="seedInput" type="number" value="88231"></label><label><span>Branching</span><input id="branchInput" type="range" min="0.7" max="1.4" step="0.05" value="1"></label><label><span>Randomness</span><input id="randomInput" type="range" min="0.25" max="1.2" step="0.05" value="0.65"></label><div class="buttons"><button id="regen">Regenerate</button><button id="newSeed">New seed</button></div></div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcbd7c5);scene.fog=new THREE.FogExp2(0xcbd7c5,.0035);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.03,250);camera.position.set(18,9.5,25);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.06;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-3.2,5.8,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=.2;controls.maxDistance=60;controls.zoomToCursor=true;scene.add(new THREE.HemisphereLight(0xdce8d5,0x4a4237,1.55));const sun=new THREE.DirectionalLight(0xffefd0,3.0);sun.position.set(-15,25,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-7;scene.add(sun);const ground=new THREE.Mesh(new THREE.CircleGeometry(45,72),new THREE.MeshStandardMaterial({color:0x788861,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const mats=[0x493b30,0x514136,0x554437,0x5a4938,0x4a3d2e,0x373524].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));const treeRoot=new THREE.Group();scene.add(treeRoot);let meshes=[];let seed=88231,randomness=.65;const branches=[];function reset(v){seed=Math.max(1,Math.floor(v)||1)%2147483647}function rnd(){seed=seed*16807%2147483647;return(seed-1)/2147483646}function rr(a,b){return a+(b-a)*rnd()}function jit(a){return(rnd()-.5)*a*randomness}
function curveBranch(points,r0,r1,order,parent=null){const b={points,r0,r1,order,parent,children:[],curve:new THREE.CatmullRomCurve3(points,false,'centripetal'),phase:rnd()*6.283};if(parent)parent.children.push(b);branches.push(b);return b}function pointAt(b,t){return b.curve.getPointAt(THREE.MathUtils.clamp(t,0,1))}function tangentAt(b,t){return b.curve.getTangentAt(THREE.MathUtils.clamp(t,0,1)).normalize()}function radiusAt(b,t){return b.r1+(b.r0-b.r1)*Math.pow(1-t,.82)}
function pathFrom(start,dir,len,order,shape={}){const n=order===0?14:order===1?12:order===2?9:order===3?7:order===4?6:5,pts=[start.clone()];let p=start.clone(),d=dir.clone().normalize();for(let i=1;i<=n;i++){const t=i/n;d.x+=jit((order<2?.025:.05));d.z+=jit((order<2?.025:.05));d.y+=jit(order<2?.015:.035);if(shape.arch)d.y+=shape.arch*(.5-t)/n;if(shape.droop)d.y-=shape.droop*t/n;if(shape.up)d.y+=shape.up*(1-t*.4)/n;d.normalize();p=p.clone().add(d.clone().multiplyScalar(len/n*(.96+rr(-.04,.05))));pts.push(p)}return pts}
function addBranch(start,dir,len,r0,r1,order,parent,shape={}){return curveBranch(pathFrom(start,dir,len,order,shape),r0,r1,order,parent)}
function frame(tan){const ref=Math.abs(tan.y)<.88?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0),u=new THREE.Vector3().crossVectors(tan,ref).normalize(),v=new THREE.Vector3().crossVectors(tan,u).normalize();return{u,v}}
function childDir(parent,t,az,forward=.55,up=.1){const tang=tangentAt(parent,t),{u,v}=frame(tang),side=u.multiplyScalar(Math.cos(az)).add(v.multiplyScalar(Math.sin(az)));return tang.clone().multiplyScalar(forward).add(side.multiplyScalar(.82)).add(new THREE.Vector3(0,up,0)).normalize()}
function render(){const buckets=Array.from({length:6},()=>[]);for(const b of branches){const seg=b.order===0?46:b.order===1?34:b.order===2?24:b.order===3?16:b.order===4?11:7,sides=b.order===0?14:b.order===1?11:b.order===2?9:b.order===3?7:b.order===4?6:5,g=new THREE.TubeGeometry(b.curve,seg,1,sides,false),pos=g.attributes.position,uv=g.attributes.uv,c=new THREE.Vector3(),v=new THREE.Vector3();for(let i=0;i<pos.count;i++){const t=uv.getX(i);b.curve.getPointAt(t,c);v.set(pos.getX(i),pos.getY(i),pos.getZ(i)).sub(c);const r=radiusAt(b,t)*(1+(b.order<3?.012:.006)*Math.sin(17*t+b.phase));v.multiplyScalar(r);pos.setXYZ(i,c.x+v.x,c.y+v.y,c.z+v.z)}g.computeVertexNormals();buckets[b.order].push(g)}buckets.forEach((gs,o)=>{if(!gs.length)return;const merged=mergeGeometries(gs,false);gs.forEach(g=>g.dispose());const m=new THREE.Mesh(merged,mats[o]);m.castShadow=o<5;m.receiveShadow=true;treeRoot.add(m);meshes.push(m)})}
function build(density){branches.length=0;const trunk=addBranch(new THREE.Vector3(0,0,0),new THREE.Vector3(.015,1,.005),10.8,1.25,.045,0,null,{up:.05});const attach=pointAt(trunk,.43),tr=radiusAt(trunk,.43);const primary=addBranch(attach,new THREE.Vector3(-1,.18,-.10),8.0,tr*.52,.12,1,trunk,{arch:.20,droop:.13});
const secT=[.22,.35,.49,.63,.76,.87];const secs=[];secT.forEach((t,i)=>{const base=pointAt(primary,t),az=(i%2?1:-1)*(1.00+rr(-.22,.28))+(i>3?rr(-.25,.25):0),dir=childDir(primary,t,az,.56,i===0?.18:i===1?.28:i===2?.12:i===3?.24:.16),r=radiusAt(primary,t),len=rr(2.6,4.0)*(1-.18*t);secs.push(addBranch(base,dir,len,r*rr(.30,.40),r*rr(.075,.11),2,primary,{up:rr(.05,.15),droop:i===4?.06:0}))});
function growSecondary(sec){const tertiaryN=Math.max(2,Math.round(rr(2.4,3.6)*density));for(let i=0;i<tertiaryN;i++){const t=.28+(i+1)/(tertiaryN+1)*.58+jit(.05),base=pointAt(sec,t),r=radiusAt(sec,t),az=(i%2?1:-1)*rr(.9,1.45),ter=addBranch(base,childDir(sec,t,az,.50,rr(.05,.16)),rr(1.35,2.15),r*rr(.28,.38),r*rr(.055,.085),3,sec,{up:rr(.04,.10),droop:rnd()<.12?.05:0});growTertiary(ter)}const cont=addBranch(pointAt(sec,.96),tangentAt(sec,.96).clone().add(new THREE.Vector3(jit(.08),.04,jit(.08))).normalize(),rr(1.25,1.8),sec.r1*.92,sec.r1*.18,3,sec,{up:.05});growTertiary(cont)}
function growTertiary(ter){const fineN=Math.max(2,Math.round(rr(2.2,3.2)*density));for(let i=0;i<fineN;i++){const t=.35+(i+1)/(fineN+1)*.5+jit(.04),base=pointAt(ter,t),r=radiusAt(ter,t),az=(i%2?1:-1)*rr(.75,1.35),fine=addBranch(base,childDir(ter,t,az,.58,rr(.06,.14)),rr(.65,1.05),r*rr(.24,.34),r*rr(.06,.10),4,ter,{up:.08});growFine(fine)}const cont=addBranch(pointAt(ter,.96),tangentAt(ter,.96).clone().add(new THREE.Vector3(jit(.10),.05,jit(.10))).normalize(),rr(.65,.9),ter.r1*.9,ter.r1*.15,4,ter,{up:.06});growFine(cont)}
function growFine(fine){const twigN=Math.max(2,Math.round(rr(2.4,3.6)*density));for(let i=0;i<twigN;i++){const t=.48+(i+1)/(twigN+1)*.44+jit(.025),base=pointAt(fine,t),r=radiusAt(fine,t),az=(i%2?1:-1)*rr(.55,1.15);addBranch(base,childDir(fine,t,az,.72,rr(.04,.10)),rr(.28,.48),Math.max(.006,r*rr(.18,.26)),.0018,5,fine,{up:.06})}addBranch(pointAt(fine,.96),tangentAt(fine,.96).clone().add(new THREE.Vector3(jit(.08),.04,jit(.08))).normalize(),rr(.30,.48),Math.max(.006,fine.r1*.9),.0015,5,fine,{up:.05})}
secs.forEach(growSecondary)}
function clear(){for(const m of meshes){if(m.geometry)m.geometry.dispose();treeRoot.remove(m)}meshes=[];while(treeRoot.children.length)treeRoot.remove(treeRoot.children[0])}function generate(){document.querySelector('#status').style.display='block';setTimeout(()=>{clear();randomness=+document.querySelector('#randomInput').value;reset(+document.querySelector('#seedInput').value);build(+document.querySelector('#branchInput').value);render();document.querySelector('#status').style.display='none';console.log(`branch study: ${branches.length} branch sections`)},20)}document.querySelector('#gear').onclick=()=>document.querySelector('#panel').classList.toggle('show');document.querySelector('#regen').onclick=generate;document.querySelector('#newSeed').onclick=()=>{document.querySelector('#seedInput').value=Math.floor(1+Math.random()*999999999);generate()};function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();generate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.24,6000);
</script></body></html>
