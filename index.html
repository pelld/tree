<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tree — English oak branch study</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd7c5;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}
#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}#title b{display:block;font:600 22px Georgia,serif}#title span{font-size:12px;font-style:italic;opacity:.76}
#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none;transition:opacity 1s}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;padding:10px 14px;border-radius:20px;background:#ffffffdd;font-size:13px;box-shadow:0 4px 20px #0002;pointer-events:none}
#gear{position:fixed;right:12px;top:12px;z-index:5;width:38px;height:38px;border:0;border-radius:19px;background:#172117cc;color:#fff;font-size:18px}
#panel{display:none;position:fixed;right:12px;top:58px;z-index:5;width:220px;padding:12px;border-radius:12px;background:#f5f7f0ee;box-shadow:0 5px 22px #0003;font-size:12px}#panel.show{display:block}#panel label{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:7px;margin:7px 0}#panel input{min-width:0;width:100%}#panel .buttons{display:flex;gap:7px;margin-top:10px}#panel button{flex:1;border:0;border-radius:8px;padding:8px;background:#263722;color:#fff}
</style>
</head>
<body>
<div id="title"><b>English oak</b><span>branch study · scaffold architecture · no leaves</span></div>
<div id="status">Growing oak branch…</div><div id="hint">Drag to orbit · pinch / scroll to inspect</div>
<button id="gear">⚙</button>
<div id="panel"><label><span>Seed</span><input id="seedInput" type="number" value="88231"></label><label><span>Fine growth</span><input id="densityInput" type="range" min="0.7" max="1.3" step="0.05" value="1"></label><label><span>Randomness</span><input id="randomInput" type="range" min="0.1" max="0.7" step="0.05" value="0.28"></label><div class="buttons"><button id="regen">Regenerate</button><button id="newSeed">New seed</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

// 01 — SCENE
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcbd7c5);scene.fog=new THREE.FogExp2(0xcbd7c5,.0034);
const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.03,220);camera.position.set(10.5,7.4,18.2);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.06;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-4.9,5.15,-.3);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=.18;controls.maxDistance=50;controls.zoomToCursor=true;
scene.add(new THREE.HemisphereLight(0xdce8d5,0x4a4237,1.55));const sun=new THREE.DirectionalLight(0xffefd0,3.0);sun.position.set(-14,24,11);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-7;scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,72),new THREE.MeshStandardMaterial({color:0x788861,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// 02 — MODEL + RANDOMNESS
const mats=[0x493b30,0x514136,0x554437,0x594838,0x493b2f].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));
const treeRoot=new THREE.Group();scene.add(treeRoot);let meshes=[];const branches=[];let seed=88231,randomness=.28;
function reset(v){seed=Math.max(1,Math.floor(v)||1)%2147483647;if(!seed)seed=1}
function rnd(){seed=seed*16807%2147483647;return(seed-1)/2147483646}
function rr(a,b){return a+(b-a)*rnd()}
function jit(a){return(rnd()-.5)*a*randomness}
function branch(points,r0,r1,order,parent=null){const curve=new THREE.CatmullRomCurve3(points,false,'centripetal'),b={points,r0,r1,order,parent,children:[],curve,length:curve.getLength(),phase:rnd()*6.283};if(parent)parent.children.push(b);branches.push(b);return b}
function pointAt(b,t){return b.curve.getPointAt(THREE.MathUtils.clamp(t,0,1))}
function tangentAt(b,t){return b.curve.getTangentAt(THREE.MathUtils.clamp(t,0,1)).normalize()}
function radiusAt(b,t){return b.r1+(b.r0-b.r1)*Math.pow(1-t,.76)}
function frameAt(parent,t){const tan=tangentAt(parent,t),ref=Math.abs(tan.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0),u=new THREE.Vector3().crossVectors(tan,ref).normalize(),v=new THREE.Vector3().crossVectors(u,tan).normalize();return{tan,u,v}}
function dirAround(parent,t,azimuth,angle,verticalBias=0){const {tan,u,v}=frameAt(parent,t),radial=u.clone().multiplyScalar(Math.cos(azimuth)).add(v.clone().multiplyScalar(Math.sin(azimuth))).normalize(),d=tan.clone().multiplyScalar(Math.cos(angle)).add(radial.multiplyScalar(Math.sin(angle)));d.y+=verticalBias;return d.normalize()}

// 03 — ORGANIC CHILD AXIS
function growChild(parent,t,targetDir,len,r0,r1,order,{rise=0,droop=0,wander=1}={}){
  const start=pointAt(parent,t),parentTan=tangentAt(parent,t),steps=order===2?16:order===3?13:10,pts=[start.clone()];let p=start.clone();
  for(let i=1;i<=steps;i++){
    const f=i/steps,endTurn=order===2?.88:order===3?.82:.76,ease=THREE.MathUtils.smoothstep(f,.06,endTurn),d=parentTan.clone().lerp(targetDir,ease),wig=(order===2?.011:order===3?.018:.028)*wander;
    d.x+=jit(wig);d.z+=jit(wig);d.y+=jit(wig*.5)+rise*Math.sin(Math.PI*f)-droop*f*f;d.normalize();
    p=p.clone().add(d.multiplyScalar(len/steps*(.99+rr(-.014,.018))));pts.push(p.clone());
  }
  return branch(pts,r0,r1,order,parent);
}

// 04 — SMOOTH CONTINUOUS TAPER
function render(){const buckets=Array.from({length:5},()=>[]);for(const b of branches){const seg=b.order===0?48:b.order===1?50:b.order===2?36:b.order===3?26:18,sides=b.order===0?14:b.order===1?12:b.order===2?10:b.order===3?8:6,g=new THREE.TubeGeometry(b.curve,seg,1,sides,false),pos=g.attributes.position,uv=g.attributes.uv,c=new THREE.Vector3(),v=new THREE.Vector3();for(let i=0;i<pos.count;i++){const t=uv.getX(i);b.curve.getPointAt(t,c);v.set(pos.getX(i),pos.getY(i),pos.getZ(i)).sub(c);const r=radiusAt(b,t)*(1+(b.order<3?.005:.0025)*Math.sin(15*t+b.phase));v.multiplyScalar(r);pos.setXYZ(i,c.x+v.x,c.y+v.y,c.z+v.z)}g.computeVertexNormals();buckets[b.order].push(g)}buckets.forEach((gs,o)=>{if(!gs.length)return;const merged=mergeGeometries(gs,false);gs.forEach(g=>g.dispose());const m=new THREE.Mesh(merged,mats[o]);m.castShadow=true;m.receiveShadow=true;treeRoot.add(m);meshes.push(m)})}

// 05 — ONE MATURE OAK LIMB: BUILD LARGE FORKS FIRST
function build(density){
  branches.length=0;
  const trunkPts=[new THREE.Vector3(0,0,0),new THREE.Vector3(.02,1.3,.01),new THREE.Vector3(.04,2.6,.02),new THREE.Vector3(.02,3.9,.04),new THREE.Vector3(-.02,5.1,.06),new THREE.Vector3(-.05,5.8,.08)];
  const trunk=branch(trunkPts,1.0,.54,0,null),attach=pointAt(trunk,.72),tr=radiusAt(trunk,.72);

  const p=[attach.clone(),attach.clone().add(new THREE.Vector3(-.68,.28,-.02)),attach.clone().add(new THREE.Vector3(-1.55,.54,-.10)),attach.clone().add(new THREE.Vector3(-2.55,.76,-.25)),attach.clone().add(new THREE.Vector3(-3.65,.86,-.43)),attach.clone().add(new THREE.Vector3(-4.78,.82,-.60)),attach.clone().add(new THREE.Vector3(-5.86,.67,-.73)),attach.clone().add(new THREE.Vector3(-6.86,.52,-.78)),attach.clone().add(new THREE.Vector3(-7.75,.48,-.69)),attach.clone().add(new THREE.Vector3(-8.50,.57,-.51)),attach.clone().add(new THREE.Vector3(-9.12,.70,-.28))];
  const primary=branch(p,tr*.64,.055,1,trunk);

  // These five axes are deliberately different: upper, lower/forward, upper/forward, rear and distal.
  const specs=[
    {t:.22,az:-1.15,angle:.66,len:4.55,bias:.15,base:.56,tip:.16},
    {t:.36,az:1.72,angle:.72,len:4.05,bias:-.06,base:.49,tip:.15,droop:.045},
    {t:.50,az:.30,angle:.68,len:3.95,bias:.18,base:.51,tip:.15},
    {t:.64,az:-2.10,angle:.70,len:3.35,bias:.03,base:.43,tip:.14},
    {t:.77,az:1.08,angle:.58,len:2.55,bias:.10,base:.37,tip:.13}
  ];
  const secondaries=[];
  for(const s of specs){const r=radiusAt(primary,s.t),dir=dirAround(primary,s.t,s.az+jit(.035),s.angle+jit(.02),s.bias+jit(.015));secondaries.push(growChild(primary,s.t,dir,s.len*rr(.99,1.01),r*s.base,r*s.tip,2,{rise:s.bias>0?.004:0,droop:s.droop||0,wander:.42}))}

  // Distal continuation: the primary does not simply stop.
  const tipT=.86,tipR=radiusAt(primary,tipT),tipDir=tangentAt(primary,tipT).clone().add(new THREE.Vector3(-.02,.12,.07)).normalize();
  secondaries.push(growChild(primary,tipT,tipDir,2.20,tipR*.76,tipR*.16,2,{rise:.005,wander:.35}));

  function growSecondary(sec,index){
    // Two substantial tertiary laterals plus one continuation. No twig hair yet.
    const ts=[.43,.70];
    for(let i=0;i<ts.length;i++){
      const t=ts[i]+jit(.018),r=radiusAt(sec,t),az=(i?1:-1)*rr(.82,1.42)+index*.41,angle=rr(.48,.68),bias=rr(-.025,.08),dir=dirAround(sec,t,az,angle,bias);
      const ter=growChild(sec,t,dir,sec.length*rr(.34,.43),r*rr(.46,.56),r*rr(.15,.20),3,{rise:bias>0?.004:0,droop:bias<0?.015:0,wander:.55});growTertiary(ter,index*3+i);
    }
    const t=.97,r=radiusAt(sec,t),dir=tangentAt(sec,t).clone().add(new THREE.Vector3(jit(.014),.020,jit(.014))).normalize();
    const ter=growChild(sec,t,dir,sec.length*rr(.31,.38),r*.94,r*.21,3,{rise:.003,wander:.42});growTertiary(ter,index*3+2);
  }

  function growTertiary(ter,index){
    const count=Math.max(1,Math.round((1.2+rr(0,.45))*density));
    for(let i=0;i<count;i++){
      const t=.58+i*.18+jit(.015),r=radiusAt(ter,t),az=(i%2?1:-1)*rr(.68,1.18)+index*.27,angle=rr(.38,.56),bias=rr(-.015,.055),dir=dirAround(ter,t,az,angle,bias);
      growChild(ter,t,dir,ter.length*rr(.28,.36),r*rr(.42,.52),r*rr(.16,.22),4,{rise:bias>0?.003:0,droop:bias<0?.008:0,wander:.66});
    }
    const t=.975,r=radiusAt(ter,t),dir=tangentAt(ter,t).clone().add(new THREE.Vector3(jit(.016),.012,jit(.016))).normalize();
    growChild(ter,t,dir,ter.length*rr(.28,.34),r*.92,r*.20,4,{wander:.52});
  }
  secondaries.forEach(growSecondary);
}

// 06 — UI
function clear(){for(const m of meshes){if(m.geometry)m.geometry.dispose();treeRoot.remove(m)}meshes=[];while(treeRoot.children.length)treeRoot.remove(treeRoot.children[0])}
function generate(){document.querySelector('#status').style.display='block';setTimeout(()=>{clear();randomness=+document.querySelector('#randomInput').value;reset(+document.querySelector('#seedInput').value);build(+document.querySelector('#densityInput').value);render();document.querySelector('#status').style.display='none';console.log(`oak limb: ${branches.length} woody axes`)},20)}
document.querySelector('#gear').onclick=()=>document.querySelector('#panel').classList.toggle('show');document.querySelector('#regen').onclick=generate;document.querySelector('#newSeed').onclick=()=>{document.querySelector('#seedInput').value=Math.floor(1+Math.random()*999999999);generate()};
function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();generate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.24,6000);
</script>
</body>
</html>
