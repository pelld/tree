<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tree — English oak</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd6c2;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}#title b{display:block;font:600 22px Georgia,serif}#title span{font-size:12px;font-style:italic;opacity:.7}#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none}</style></head><body><div id="title"><b>English oak</b><span>Quercus robur · mature open-grown form</span></div><div id="hint">Drag to rotate · pinch / scroll to explore</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
// 01 — scene
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcbd6c2);scene.fog=new THREE.FogExp2(0xcbd6c2,.008);const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,.02,250);camera.position.set(25,13,30);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,8.5,0);controls.enableDamping=true;controls.minDistance=.15;controls.maxDistance=70;controls.zoomToCursor=true;scene.add(new THREE.HemisphereLight(0xeaf2df,0x5e533f,2.3));const sun=new THREE.DirectionalLight(0xfff0d0,2.8);sun.position.set(-14,25,12);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-10;scene.add(sun);const ground=new THREE.Mesh(new THREE.CircleGeometry(50,96),new THREE.MeshStandardMaterial({color:0x75865d,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// 02 — deterministic natural variation
let seed=872341;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646},j=a=>(rnd()-.5)*a;const bark=new THREE.MeshStandardMaterial({color:0x514334,roughness:1,flatShading:true}),youngBark=new THREE.MeshStandardMaterial({color:0x66533b,roughness:.95}),leafMats=[0x31572b,0x3c672f,0x466f35,0x294d27].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.86,side:THREE.DoubleSide}));
// 03 — tapered woody segments, deliberately low-sided to suggest fissured bark
function wood(a,b,r0,r1,young=false){const d=new THREE.Vector3().subVectors(b,a),len=d.length(),g=new THREE.CylinderGeometry(r1,r0,len,r0>.25?9:6,2,false);const m=new THREE.Mesh(g,young?youngBark:bark);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());m.rotation.y=j(.3);m.castShadow=m.receiveShadow=true;scene.add(m)}
// 04 — oak leaf: short petiole, auricled base, irregular rounded lobes
function leafGeo(){const s=new THREE.Shape();s.moveTo(0,-.56);[[.12,-.49],[.25,-.46],[.31,-.35],[.23,-.27],[.43,-.17],[.46,-.04],[.31,.04],[.43,.17],[.38,.28],[.20,.31],[.27,.43],[.13,.52],[0,.62],[-.13,.52],[-.27,.43],[-.20,.31],[-.38,.28],[-.43,.17],[-.31,.04],[-.46,-.04],[-.43,-.17],[-.23,-.27],[-.31,-.35],[-.25,-.46],[-.12,-.49]].forEach(p=>s.lineTo(...p));return new THREE.ShapeGeometry(s,1)}const lgeo=leafGeo();function leaf(p,scale=.28){const m=new THREE.Mesh(lgeo,leafMats[Math.floor(rnd()*leafMats.length)]);m.position.copy(p);m.scale.setScalar(scale*(.75+rnd()*.45));m.rotation.set(j(1.0),rnd()*6.28,j(.8));m.castShadow=true;scene.add(m)}
// 05 — trunk: massive low bole, flare, taper and slight lean
const tp=[];for(let i=0;i<=12;i++){const y=i*.82,lean=i*i*.006;tp.push(new THREE.Vector3(lean+j(.035),y,Math.sin(i*.48)*.08));if(i)wood(tp[i-1],tp[i],Math.max(.55,1.28-i*.064),Math.max(.49,1.24-i*.066))}
// root flare / buttresses
for(let n=0;n<11;n++){const a=n/11*6.283+j(.16),start=new THREE.Vector3(Math.cos(a)*.68,.34,Math.sin(a)*.68),mid=new THREE.Vector3(Math.cos(a)*(1.25+rnd()*.65),.12,Math.sin(a)*(1.25+rnd()*.65)),end=new THREE.Vector3(Math.cos(a)*(2.4+rnd()*2.5),.025,Math.sin(a)*(2.4+rnd()*2.5));wood(start,mid,.38,.18);wood(mid,end,.18,.025)}
// 06 — recursive limb system. Strong oak scaffold limbs first, then repeated crooked bifurcation.
const twigTips=[];function grow(a,dir,len,r,depth,droop=0){let nd=dir.clone();nd.y+=j(.17)-droop;nd.x+=j(.18);nd.z+=j(.18);nd.normalize();const b=a.clone().add(nd.multiplyScalar(len));wood(a,b,r,r*(depth>1?.70:.58),depth<2);if(depth===0){twigTips.push({p:b,d:nd});return}const count=depth>=4?2+(rnd()>.7?1:0):2+(rnd()>.52?1:0);for(let k=0;k<count;k++){const child=nd.clone();const spread=depth>=3?.65:.9;child.x+=j(spread);child.z+=j(spread);child.y+=j(.45)+(depth<3?.12:0);grow(b,child,len*(.61+rnd()*.13),r*.66,depth-1,droop+(depth<2?.03:0))}}
// Major limbs emerge irregularly and travel outward before the fine crown develops.
const limbs=[
 [3.0,0.15,.18,5.2,.52],[3.8,2.65,.12,5.8,.55],[4.6,4.15,.25,5.4,.50],[5.3,5.55,.18,5.8,.50],[6.1,1.35,.34,5.4,.46],[6.8,3.25,.30,5.0,.44],[7.5,4.85,.38,4.8,.41],[8.3,.55,.42,4.5,.38],[9.0,2.15,.48,4.1,.35],[9.5,4.0,.52,3.8,.33]];
limbs.forEach(([y,a,rise,len,r])=>{const p=new THREE.Vector3(y*y*.006,y,Math.sin(y*.58)*.08),d=new THREE.Vector3(Math.cos(a),rise,Math.sin(a)).normalize();grow(p,d,len,r,4,rise<.2?.025:0)});
// 07 — terminal foliage clusters. Leaves bunch near shoot ends rather than forming a spherical cloud.
twigTips.forEach(t=>{const cluster=4+Math.floor(rnd()*5);for(let q=0;q<cluster;q++){const p=t.p.clone().add(new THREE.Vector3(j(.7),j(.5),j(.7)));leaf(p,.25+rnd()*.11)}});
// sparse epicormic shoots break up the bare trunk edge
for(let n=0;n<9;n++){const y=2+rnd()*6,a=rnd()*6.28,p=new THREE.Vector3(Math.cos(a)*(.92-y*.045),y,Math.sin(a)*(.92-y*.045)),d=new THREE.Vector3(Math.cos(a),.35+rnd()*.25,Math.sin(a)).normalize();grow(p,d,.65+rnd()*.6,.045,1)}
// 08 — render
function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.3,6000);
</script></body></html>
