<title>Tree — English oak</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd7c5;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}

</style>
</head>
<body>
<div id="title"><b>English oak</b><span>Quercus robur · mature open-grown specimen</span></div>
<div id="status">Growing oak…</div>
<div id="hint">Drag to orbit · pinch / scroll to inspect</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// 01 — SCENE
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcbd7c5);scene.fog=new THREE.FogExp2(0xcbd7c5,.0037);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.02,320);camera.position.set(30,13.5,35);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.4));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,7.7,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=.12;controls.maxDistance=90;controls.zoomToCursor=true;
scene.add(new THREE.HemisphereLight(0xdce8d5,0x4b4337,1.55));
const sun=new THREE.DirectionalLight(0xfff0cf,3.25);sun.position.set(-17,28,13);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-8;sun.shadow.bias=-.00025;scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(58,80),new THREE.MeshStandardMaterial({color:0x788861,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// 02 — DETERMINISTIC INDIVIDUAL + MATERIALS
let seed=88231;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};const j=a=>(rnd()-.5)*a;
const barkMat=new THREE.MeshStandardMaterial({color:0x493b30,roughness:1,flatShading:true});
const oldBranchMat=new THREE.MeshStandardMaterial({color:0x514134,roughness:1,flatShading:true});
const youngBranchMat=new THREE.MeshStandardMaterial({color:0x62503a,roughness:.98});
const twigMat=new THREE.MeshStandardMaterial({color:0x403b27,roughness:1});
const petioleMat=new THREE.MeshStandardMaterial({color:0x65703c,roughness:1});
const fissureMat=new THREE.MeshStandardMaterial({color:0x2a211b,roughness:1});
const leafMats=[0x162f18,0x1c3a1c,0x244722,0x2d5428,0x37612e,0x426d35,0x527b3d].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.92,side:THREE.DoubleSide}));

// 03 — HEAVY WOOD
function woodMesh(a,b,r0,r1,material=barkMat,sides=11){const d=new THREE.Vector3().subVectors(b,a),len=d.length(),g=new THREE.CylinderGeometry(r1,r0,len,sides,3,false),pos=g.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),n=1+j(Math.min(.07,r0*.11));pos.setX(i,x*n);pos.setZ(i,z*n)}g.computeVertexNormals();const m=new THREE.Mesh(g,material);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());m.castShadow=m.receiveShadow=true;scene.add(m);return m}
const trunkR=y=>Math.max(.34,.94-y*.058);let last=new THREE.Vector3(0,0,0);for(let i=1;i<=18;i++){const y=i*.58,p=new THREE.Vector3(.0055*y*y+Math.sin(i*.62)*.035,y,Math.sin(i*.43)*.06);woodMesh(last,p,trunkR((i-1)*.58),trunkR(y),barkMat,12);last=p}
for(let n=0;n<8;n++){const a=n/8*6.283+j(.25),s=new THREE.Vector3(Math.cos(a)*.72,.33,Math.sin(a)*.72),m=new THREE.Vector3(Math.cos(a+j(.10))*(1.15+rnd()*.35),.12,Math.sin(a+j(.10))*(1.15+rnd()*.35)),e=new THREE.Vector3(Math.cos(a+j(.12))*(1.75+rnd()*.55),.018,Math.sin(a+j(.12))*(1.75+rnd()*.55));woodMesh(s,m,.30+rnd()*.07,.14,barkMat,8);woodMesh(m,e,.14,.035,barkMat,7)}
for(let n=0;n<46;n++){const a=n/46*6.283+j(.08),y=.2+rnd()*5.2,len=.45+rnd()*1.25,r=trunkR(y)+.014,curve=new THREE.CatmullRomCurve3([new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r),new THREE.Vector3(Math.cos(a+j(.065))*r,y+len*.48,Math.sin(a+j(.065))*r),new THREE.Vector3(Math.cos(a+j(.09))*r,y+len,Math.sin(a+j(.09))*r)]);scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,4,.014+rnd()*.010,3,false),fissureMat))}

// 04 — CROWN VOLUMES
const lobes=[
 {c:new THREE.Vector3(-6.3,7.4,-1.4),r:new THREE.Vector3(3.2,2.0,2.8),p:-1},{c:new THREE.Vector3(-5.1,9.4,2.5),r:new THREE.Vector3(3.1,2.3,2.8),p:0},{c:new THREE.Vector3(-4.0,10.8,-3.0),r:new THREE.Vector3(3.0,2.2,2.7),p:0},{c:new THREE.Vector3(-2.0,12.0,1.2),r:new THREE.Vector3(3.2,2.1,2.8),p:-1},
 {c:new THREE.Vector3(.8,12.5,-1.7),r:new THREE.Vector3(3.2,2.1,2.8),p:-1},{c:new THREE.Vector3(3.7,11.2,2.0),r:new THREE.Vector3(3.3,2.2,2.9),p:-1},{c:new THREE.Vector3(5.7,9.3,-1.5),r:new THREE.Vector3(3.2,2.3,2.8),p:5},{c:new THREE.Vector3(6.5,7.3,2.3),r:new THREE.Vector3(3.3,2.1,2.9),p:-1},
 {c:new THREE.Vector3(4.2,7.0,-3.6),r:new THREE.Vector3(3.1,2.0,2.7),p:7},{c:new THREE.Vector3(.8,7.8,-4.7),r:new THREE.Vector3(3.1,2.1,2.8),p:-1},{c:new THREE.Vector3(-3.4,7.2,-4.1),r:new THREE.Vector3(3.1,2.0,2.7),p:9},{c:new THREE.Vector3(-1.6,7.8,4.6),r:new THREE.Vector3(3.2,2.2,2.9),p:-1},
 {c:new THREE.Vector3(2.6,7.8,4.3),r:new THREE.Vector3(3.1,2.1,2.8),p:11},{c:new THREE.Vector3(0,9.8,.7),r:new THREE.Vector3(3.0,2.2,2.7),p:3},{c:new THREE.Vector3(-5.7,6.2,2.0),r:new THREE.Vector3(2.8,1.8,2.5),p:0},{c:new THREE.Vector3(5.2,6.1,.1),r:new THREE.Vector3(2.8,1.8,2.5),p:7}
];
function trunkAt(y){return new THREE.Vector3(.0055*y*y,y,Math.sin((y/.58)*.43)*.06)}

// 05 — BRANCH NETWORK
const branchBuckets=[[],[],[]];const up=new THREE.Vector3(0,1,0),mid=new THREE.Vector3(),delta=new THREE.Vector3(),quat=new THREE.Quaternion(),scaleV=new THREE.Vector3(),matrix=new THREE.Matrix4();
function queueSegment(a,b,r){branchBuckets[r>.18?0:r>.055?1:2].push({a:a.clone(),b:b.clone(),r})}
function curvedBranch(a,b,r0,bend=.5,sag=.15,segments=8){const d=new THREE.Vector3().subVectors(b,a),perp=new THREE.Vector3(-d.z,0,d.x);if(perp.lengthSq()<.001)perp.set(1,0,0);perp.normalize();const c1=a.clone().add(d.clone().multiplyScalar(.30)).add(perp.clone().multiplyScalar(bend)).add(new THREE.Vector3(0,-Math.abs(sag),0));const c2=a.clone().add(d.clone().multiplyScalar(.68)).add(perp.clone().multiplyScalar(-bend*.35)).add(new THREE.Vector3(0,Math.abs(sag)*.65,0));const curve=new THREE.CatmullRomCurve3([a,c1,c2,b]),pts=curve.getPoints(segments);for(let i=0;i<segments;i++){const t=i/segments;queueSegment(pts[i],pts[i+1],Math.max(.010,r0*(1-t*.72)))}return b.clone()}
const anchors=[],mainAttachments=[3.0,3.5,4.1,4.6,5.2,5.7,6.2,4.0,5.0,4.6,4.2,4.8,5.5,6.4,3.4,3.8];
lobes.forEach((l,i)=>{const start=l.p<0?trunkAt(mainAttachments[i]):anchors[l.p].clone(),outward=new THREE.Vector3(l.c.x,0,l.c.z).normalize(),end=l.c.clone().add(outward.multiplyScalar(-l.r.x*.28)).add(new THREE.Vector3(0,-l.r.y*.30,0)),dist=start.distanceTo(end),radius=l.p<0?.40:Math.max(.16,.28-dist*.010);curvedBranch(start,end,radius,j(1.0),.10+rnd()*.32,l.p<0?10:7);anchors[i]=end.clone()});

// 06 — SECONDARY / TERTIARY WOOD. Dense endpoints support natural leafy shoots.
const shootBases=[];
lobes.forEach((l,i)=>{const base=anchors[i],secondary=25+Math.floor(rnd()*7);for(let n=0;n<secondary;n++){const a=rnd()*6.283,u=j(.78),rad=.35+.56*rnd(),target=l.c.clone().add(new THREE.Vector3(Math.cos(a)*l.r.x*rad,u*l.r.y,Math.sin(a)*l.r.z*rad));curvedBranch(base,target,.070+rnd()*.070,j(.34),j(.13),5);shootBases.push({p:target.clone(),li:i});const forks=4+Math.floor(rnd()*2);for(let f=0;f<forks;f++){const tip=target.clone().add(new THREE.Vector3(j(l.r.x*.56),j(l.r.y*.38),j(l.r.z*.56)));curvedBranch(target,tip,.024+rnd()*.024,j(.15),j(.05),3);shootBases.push({p:tip.clone(),li:i})}}});
const unitGeos=[new THREE.CylinderGeometry(.78,1,1,9,1,false),new THREE.CylinderGeometry(.72,1,1,7,1,false),new THREE.CylinderGeometry(.66,1,1,5,1,false)],branchMats=[oldBranchMat,oldBranchMat,youngBranchMat];
branchBuckets.forEach((items,b)=>{if(!items.length)return;const inst=new THREE.InstancedMesh(unitGeos[b],branchMats[b],items.length);inst.castShadow=b<2;inst.receiveShadow=b===0;items.forEach((s,k)=>{delta.subVectors(s.b,s.a);mid.copy(s.a).add(s.b).multiplyScalar(.5);quat.setFromUnitVectors(up,delta.clone().normalize());scaleV.set(s.r,delta.length(),s.r);matrix.compose(mid,quat,scaleV);inst.setMatrixAt(k,matrix)});inst.instanceMatrix.needsUpdate=true;scene.add(inst)});

// 07 — REALISTIC LEAFY SHOOTS. A twig is a bent shoot with nodes; leaves alternate along it.
//      No radial spike sprays and no free-floating foliage.
const fineTwigs=[],leafAttachments=[];
function addFineTwig(a,b,r){fineTwigs.push({a:a.clone(),b:b.clone(),r})}
function phyllotaxisSide(axis,index,phase=0){const ref=Math.abs(axis.y)<.88?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0),u=new THREE.Vector3().crossVectors(axis,ref).normalize(),v=new THREE.Vector3().crossVectors(axis,u).normalize(),ang=phase+index*2.399963;return u.multiplyScalar(Math.cos(ang)).add(v.multiplyScalar(Math.sin(ang))).normalize()}
function addLeafNode(attach,axis,li,index,phase){leafAttachments.push({attach:attach.clone(),axis:axis.clone().normalize(),side:phyllotaxisSide(axis,index,phase),li})}
function insideLobe(p,l,scale=1.18){const dx=(p.x-l.c.x)/(l.r.x*scale),dy=(p.y-l.c.y)/(l.r.y*scale),dz=(p.z-l.c.z)/(l.r.z*scale);return dx*dx+dy*dy+dz*dz<1}
function growShortSideShoot(origin,parentAxis,l,li,phase){let axis=parentAxis.clone().add(new THREE.Vector3(j(.55),j(.30),j(.55))).normalize(),p=origin.clone();const count=2+Math.floor(rnd()*2);for(let n=0;n<count;n++){axis.add(new THREE.Vector3(j(.10),j(.07),j(.10))).normalize();let q=p.clone().add(axis.clone().multiplyScalar(.065+rnd()*.055));if(!insideLobe(q,l,1.22)){axis.lerp(l.c.clone().sub(p).normalize(),.32).normalize();q=p.clone().add(axis.clone().multiplyScalar(.060+rnd()*.050))}addFineTwig(p,q,.0038-n*.0007);addLeafNode(q,axis,li,n,phase);p=q}}
shootBases.forEach(sb=>{const l=lobes[sb.li],radial=sb.p.clone().sub(l.c);if(radial.lengthSq()<.02)radial.set(j(1),.15,j(1));radial.normalize();const stemAxis=radial.clone().add(new THREE.Vector3(j(.22),.05+j(.12),j(.22))).normalize(),stemEnd=sb.p.clone().add(stemAxis.clone().multiplyScalar(.075+rnd()*.070));addFineTwig(sb.p,stemEnd,.008+rnd()*.003);const shootCount=1+(rnd()<.72?1:0);for(let s=0;s<shootCount;s++){let axis=stemAxis.clone().add(new THREE.Vector3(j(.34),j(.18),j(.34))).normalize(),p=stemEnd.clone(),phase=rnd()*6.283;const nodes=7+Math.floor(rnd()*4);for(let n=0;n<nodes;n++){axis.add(new THREE.Vector3(j(.075),j(.050),j(.075))).normalize();const terminal=n>=nodes-3,len=(terminal?.048:.075)+rnd()*(terminal?.040:.065);let q=p.clone().add(axis.clone().multiplyScalar(len));if(!insideLobe(q,l,1.20)){axis.lerp(l.c.clone().sub(p).normalize(),.28).normalize();q=p.clone().add(axis.clone().multiplyScalar(len*.82))}const radius=Math.max(.0028,.0068*(1-n/(nodes+2)));addFineTwig(p,q,radius);addLeafNode(q,axis,sb.li,n,phase);if(n>1&&n<nodes-2&&rnd()<.18)growShortSideShoot(q,axis,l,sb.li,phase+n*.9);p=q}}});
const fineTwigGeo=new THREE.CylinderGeometry(.74,1,1,5,1,false),fineTwigInst=new THREE.InstancedMesh(fineTwigGeo,twigMat,fineTwigs.length);fineTwigInst.castShadow=false;fineTwigInst.receiveShadow=true;fineTwigs.forEach((s,k)=>{delta.subVectors(s.b,s.a);mid.copy(s.a).add(s.b).multiplyScalar(.5);quat.setFromUnitVectors(up,delta.clone().normalize());scaleV.set(s.r,delta.length(),s.r);matrix.compose(mid,quat,scaleV);fineTwigInst.setMatrixAt(k,matrix)});fineTwigInst.instanceMatrix.needsUpdate=true;scene.add(fineTwigInst);

// 08 — LEAF + PETIOLE GEOMETRY. The petiole leaves a real node and the blade begins at its end.
function makeLeaf(){const s=new THREE.Shape();s.moveTo(0,0);s.lineTo(.07,.08);[[.16,.18],[.31,.23],[.36,.34],[.25,.42],[.44,.52],[.45,.65],[.30,.71],[.39,.84],[.32,.96],[.16,.98],[.20,1.10],[.09,1.18],[0,1.28],[-.09,1.18],[-.20,1.10],[-.16,.98],[-.32,.96],[-.39,.84],[-.30,.71],[-.45,.65],[-.44,.52],[-.25,.42],[-.36,.34],[-.31,.23],[-.16,.18],[-.07,.08]].forEach(v=>s.lineTo(...v));s.closePath();return new THREE.ShapeGeometry(s)}
const leafGeo=makeLeaf(),leafSpecs=leafMats.map(()=>[]),petioles=[];const localY=new THREE.Vector3(0,1,0),sunDir=sun.position.clone().normalize(),crownCentre=new THREE.Vector3(0,9.35,.1);let leafCount=0;const MAX_LEAVES=120000;
function materialBucket(p,li){const l=lobes[li],dx=(p.x-l.c.x)/l.r.x,dy=(p.y-l.c.y)/l.r.y,dz=(p.z-l.c.z)/l.r.z,depth=Math.min(1,Math.sqrt(dx*dx+dy*dy+dz*dz)),radial=p.clone().sub(crownCentre).normalize(),sunFacing=Math.max(-1,Math.min(1,radial.dot(sunDir))),exposure=.58*depth+.42*((sunFacing+1)*.5)+j(.12);return Math.max(0,Math.min(leafMats.length-1,Math.floor(exposure*leafMats.length)))}
function attachLeaf(node){if(leafCount>=MAX_LEAVES)return;const axis=node.axis.clone().normalize(),side=node.side.clone().normalize(),petLen=.035+rnd()*.035,leafBase=node.attach.clone().add(side.clone().multiplyScalar(petLen));petioles.push({a:node.attach.clone(),b:leafBase.clone(),r:.0016+rnd()*.0009});const leafDir=side.clone().multiplyScalar(.88).add(axis.clone().multiplyScalar(.12+j(.10))).add(new THREE.Vector3(0,.035+j(.055),0)).normalize(),q=new THREE.Quaternion().setFromUnitVectors(localY,leafDir),roll=new THREE.Quaternion().setFromAxisAngle(leafDir,j(.38));q.premultiply(roll);const size=.085+rnd()*.045,b=materialBucket(leafBase,node.li);leafSpecs[b].push({p:leafBase,q,s:new THREE.Vector3(size*(.80+rnd()*.20),size,size)});leafCount++}
leafAttachments.forEach(attachLeaf);

// 09 — PETIOLES + LEAVES
const petioleGeo=new THREE.CylinderGeometry(.62,1,1,4,1,false),petioleInst=new THREE.InstancedMesh(petioleGeo,petioleMat,petioles.length);petioleInst.castShadow=false;petioleInst.receiveShadow=true;petioles.forEach((s,k)=>{delta.subVectors(s.b,s.a);mid.copy(s.a).add(s.b).multiplyScalar(.5);quat.setFromUnitVectors(up,delta.clone().normalize());scaleV.set(s.r,delta.length(),s.r);matrix.compose(mid,quat,scaleV);petioleInst.setMatrixAt(k,matrix)});petioleInst.instanceMatrix.needsUpdate=true;scene.add(petioleInst);
leafSpecs.forEach((items,i)=>{if(!items.length)return;const inst=new THREE.InstancedMesh(leafGeo,leafMats[i],items.length);inst.castShadow=false;inst.receiveShadow=true;items.forEach((v,k)=>{matrix.compose(v.p,v.q,v.s);inst.setMatrixAt(k,matrix)});inst.instanceMatrix.needsUpdate=true;scene.add(inst)});

// 10 — CHEAP CANOPY SELF-SHADE + FILLED GROUND SHADOW
const shadowMat=new THREE.MeshBasicMaterial({color:0x000000,colorWrite:false,depthWrite:false});
const shadowGeo=new THREE.SphereGeometry(1,14,8),shadowBlobs=[{p:[0,9.1,.1],s:[6.8,2.8,6.2]},{p:[-4.5,8.5,-.2],s:[3.6,2.2,3.9]},{p:[4.5,8.4,.2],s:[3.7,2.2,3.9]},{p:[-.4,11.1,-.2],s:[5.1,2.0,4.8]},{p:[0,7.1,.2],s:[5.8,1.8,5.3]}];
shadowBlobs.forEach(v=>{const m=new THREE.Mesh(shadowGeo,shadowMat);m.position.set(...v.p);m.scale.set(...v.s);m.castShadow=true;m.receiveShadow=false;scene.add(m)});

// 11 — SMALL EPICORMIC SHOOTS
for(let n=0;n<9;n++){const y=2.7+rnd()*3.7,a=rnd()*6.283,r=trunkR(y),p=new THREE.Vector3(.0055*y*y+Math.cos(a)*r,y,Math.sin(a)*r),d=new THREE.Vector3(Math.cos(a),.35+rnd()*.28,Math.sin(a)).normalize(),q=p.clone().add(d.multiplyScalar(.35+rnd()*.45));woodMesh(p,q,.026,.010,youngBranchMat,5)}

// 12 — RENDER
console.log(`oak: ${fineTwigs.length} fine twig segments, ${petioles.length} petioles, ${leafCount} attached leaves`);
document.querySelector('#status').style.display='none';function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.24,6000);
</script>
</body>
