<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Lavender — 3D study</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cfdcc4;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}#title b{display:block;font:600 22px Georgia,serif}#title span{font-size:12px;font-style:italic;opacity:.76}#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none;transition:opacity 1s}#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;padding:10px 14px;border-radius:20px;background:#ffffffdd;font-size:13px;box-shadow:0 4px 20px #0002;pointer-events:none}#gear{position:fixed;right:12px;top:12px;z-index:5;width:38px;height:38px;border:0;border-radius:19px;background:#172117cc;color:#fff;font-size:18px}#panel{display:none;position:fixed;right:12px;top:58px;z-index:5;width:220px;padding:12px;border-radius:12px;background:#f5f7f0ee;box-shadow:0 5px 22px #0003;font-size:12px}#panel.show{display:block}#panel label{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:7px;margin:7px 0}#panel input{min-width:0;width:100%}#panel .buttons{display:flex;gap:7px;margin-top:10px}#panel button{flex:1;border:0;border-radius:8px;padding:8px;background:#263722;color:#fff}
</style>
</head>
<body>
<div id="title"><b>English lavender</b><span>Lavandula angustifolia · flowering clump</span></div>
<div id="status">Growing lavender…</div>
<div id="hint">Drag to orbit · pinch / scroll to inspect</div>
<button id="gear">⚙</button>
<div id="panel">
<label><span>Seed</span><input id="seedInput" type="number" value="88231"></label>
<label><span>Stems</span><input id="densityInput" type="range" min="0.6" max="1.5" step="0.05" value="1.0"></label>
<label><span>Flowers</span><input id="flowerInput" type="range" min="0.6" max="1.6" step="0.05" value="1.05"></label>
<label><span>Spread</span><input id="spreadInput" type="range" min="0.65" max="1.45" step="0.05" value="1.0"></label>
<label><span>Randomness</span><input id="randomInput" type="range" min="0.05" max="0.45" step="0.02" value="0.18"></label>
<div class="buttons"><button id="regen">Regenerate</button><button id="newSeed">New seed</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module" src="./tree.js"></script>
</body>
</html>
