<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tree — English oak</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#c9d4c1;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}#title b{display:block;font:600 22px Georgia,serif}#title span{font-size:12px;font-style:italic;opacity:.7}#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none}</style></head><body><div id="title"><b>English oak</b><span>Quercus robur · mature open-grown specimen</span></div><div id="hint">Drag to orbit · pinch / scroll to inspect</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
// 01 — SCENE: neutral outdoor light, low camera perspective and room for a broad crown.
const scene=new THREE.Scene();scene.background=new THREE.Color(0xc9d4c1);scene.fog=new THREE.FogExp2(0xc9d4c1,.006);const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.018,300);camera.position.set(27,12,31);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,8.2,0);controls.enableDamping=true;controls.minDistance=.12;controls.maxDistance=80;controls.zoomToCursor=true;scene.add(new THREE.HemisphereLight(0xe9f0df,0x514939,2.1));const sun=new THREE.DirectionalLight(0xffefd0,3);sun.position.set(-16,27,11);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=29;sun.shadow.camera.bottom=-9;scene.add(sun);const ground=new THREE.Mesh(new THREE.CircleGeometry(55,96),new THREE.MeshStandardMaterial({color:0x74845c,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// 02 — DETERMINISTIC VARIATION. One individual tree, not a new random tree on each load.
let seed=41027;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646},j=a=>(rnd()-.5)*a;const barkDark=new THREE.MeshStandardMaterial({color:0x3d342c,roughness:1,flatShading:true}),barkMid=new THREE.MeshStandardMaterial({color:0x514438,roughness:1,flatShading:true}),youngBark=new THREE.MeshStandardMaterial({color:0x665641,roughness:.98});const fissureMat=new THREE.MeshStandardMaterial({color:0x211d19,roughness:1});const deadMat=new THREE.MeshStandardMaterial({color:0x756a59,roughness:1});const leafMats=[0x294b25,0x31572a,0x3b622f,0x456b35,0x365d2b].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.9,side:THREE.DoubleSide}));
// 03 — WOOD. Slightly faceted, tapered segments retain visible branch hierarchy.
function wood(a,b,r0,r1,age=1,dead=false){const d=new THREE.Vector3().subVectors(b,a),len=d.length(),sides=r0>.55?12:r0>.18?9:6,g=new THREE.CylinderGeometry(r1,r0,len,sides,Math.max(2,Math.ceil(len)),false);const pos=g.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),rr=Math.hypot(x,z),noise=1+j(Math.min(.12,r0*.16));if(rr>.001){pos.setX(i,x*noise);pos.setZ(i,z*noise)}}g.computeVertexNormals();const mat=dead?deadMat:age>.7?barkMid:youngBark,m=new THREE.Mesh(g,mat);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());m.castShadow=m.receiveShadow=true;scene.add(m);return m}
// 04 — MATURE BARK RELIEF. Dark vertical/interlocking grooves sit just above the old bole surface.
function barkGrooves(y0,y1,baseR,count=34){for(let n=0;n<count;n++){const a=n/count*Math.PI*2+j(.09),start=y0+rnd()*.45,end=Math.min(y1,start+.55+rnd()*1.5),mid=(start+end)/2,r=baseR(mid)+.018;const x=Math.cos(a)*r,z=Math.sin(a)*r;const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(x,start,z),new THREE.Vector3(Math.cos(a+j(.07))*r,mid,Math.sin(a+j(.07))*r),new THREE.Vector3(Math.cos(a+j(.1))*r,end,Math.sin(a+j(.1))*r)]);const mesh=new THREE.Mesh(new THREE.TubeGeometry(curve,5,.018+rnd()*.018,4,false),fissureMat);mesh.castShadow=true;scene.add(mesh)}}
// 05 — OAK LEAF. Rounded lobes, very short petiole, small random size/orientation differences.
function makeLeaf(){const s=new THREE.Shape();s.moveTo(0,-.55);[[.11,-.49],[.23,-.48],[.31,-.38],[.24,-.29],[.43,-.20],[.47,-.07],[.34,.02],[.45,.15],[.40,.27],[.22,.32],[.29,.43],[.14,.53],[0,.63],[-.14,.53],[-.29,.43],[-.22,.32],[-.40,.27],[-.45,.15],[-.34,.02],[-.47,-.07],[-.43,-.20],[-.24,-.29],[-.31,-.38],[-.23,-.48],[-.11,-.49]].forEach(p=>s.lineTo(...p));return new THREE.ShapeGeometry(s)}const leafGeo=makeLeaf();function leaf(p,scale=.25){const m=new THREE.Mesh(leafGeo,leafMats[Math.floor(rnd()*leafMats.length)]);m.position.copy(p);m.scale.set(scale*(.72+rnd()*.5),scale*(.82+rnd()*.38),scale);m.rotation.set(j(1.1),rnd()*6.283,j(.85));m.castShadow=true;scene.add(m)}
// 06 — BOLE. A short, huge trunk divides relatively low: characteristic open-grown oak massing.
const trunk=[];function trunkRadius(y){return Math.max(.58,1.48-y*.082)}for(let i=0;i<=13;i++){const y=i*.72,x=.014*y*y+Math.sin(i*.7)*.045,z=Math.sin(i*.42)*.09;trunk.push(new THREE.Vector3(x,y,z));if(i)wood(trunk[i-1],trunk[i],trunkRadius((i-1)*.72),trunkRadius(y),1)}barkGrooves(.15,7.5,trunkRadius,52);
// 07 — ROOT FLARE: irregular buttresses rather than radial sticks.
for(let n=0;n<12;n++){const a=n/12*6.283+j(.18),r0=.82+j(.12),s=new THREE.Vector3(Math.cos(a)*r0,.42,Math.sin(a)*r0),m=new THREE.Vector3(Math.cos(a+j(.08))*(1.45+rnd()*.65),.13,Math.sin(a+j(.08))*(1.45+rnd()*.65)),e=new THREE.Vector3(Math.cos(a+j(.12))*(3+rnd()*2.6),.025,Math.sin(a+j(.12))*(3+rnd()*2.6));wood(s,m,.46+rnd()*.12,.20,1);wood(m,e,.20,.025,.8)}
// 08 — BRANCH ARCHITECTURE. Direction persists between generations; forks are unequal and crooked.
const tips=[];function grow(a,dir,len,r,depth,bias=0,deadChance=0){const nd=dir.clone();nd.x+=j(.16);nd.z+=j(.16);nd.y+=j(.12)+bias;nd.normalize();const b=a.clone().add(nd.clone().multiplyScalar(len));const isDead=depth<2&&rnd()<deadChance;wood(a,b,r,r*(depth>2?.72:.62),Math.min(1,r*2.2),isDead);if(isDead)return;if(depth===0){tips.push({p:b,d:nd});return}const forks=depth>=4?2:(rnd()<.62?2:3);for(let k=0;k<forks;k++){const child=nd.clone(),spread=depth>2?.58:.82;child.x+=j(spread);child.z+=j(spread);child.y+=j(.35)+(depth<3?.09:0);const dominance=k===0?1:.78+rnd()*.13;grow(b,child,len*(.60+rnd()*.12)*dominance,r*(.63+rnd()*.05),depth-1,bias*.55,deadChance)}}
// 09 — PRIMARY SCAFFOLD LIMBS. Unequal, low, spreading and deliberately asymmetric.
const limbs=[[2.65,.08,.13,6.7,.68],[3.25,2.55,.08,6.3,.63],[3.85,4.18,.16,6.1,.60],[4.45,5.48,.11,6.6,.60],[5.05,1.20,.24,5.9,.55],[5.65,3.10,.19,6.2,.54],[6.25,4.72,.28,5.5,.49],[6.85,.48,.32,5.3,.47],[7.45,2.03,.37,4.8,.43],[8.0,3.75,.41,4.5,.40],[8.55,5.32,.48,4.1,.36],[9.0,1.18,.53,3.8,.33]];limbs.forEach(([y,a,rise,len,r],idx)=>{const p=new THREE.Vector3(.014*y*y,y,Math.sin(y*.58)*.08),d=new THREE.Vector3(Math.cos(a),rise,Math.sin(a)).normalize();grow(p,d,len,r,idx<7?5:4,rise<.16?-.015:0,.035)});
// 10 — RETRENCHMENT / STAG-HEAD DETAIL: a few exposed dead upper shoots and broken ends.
[[8.0,2.7],[8.7,4.5],[7.7,.9]].forEach(([y,a])=>{const p=new THREE.Vector3(.014*y*y,y,0),d=new THREE.Vector3(Math.cos(a)*.55,.82,Math.sin(a)*.55).normalize();let q=p;for(let k=0;k<3;k++){const e=q.clone().add(d.clone().add(new THREE.Vector3(j(.18),j(.08),j(.18))).normalize().multiplyScalar(1.2-k*.22));wood(q,e,.11-k*.025,.075-k*.02,.5,true);q=e}});
// 11 — FOLIAGE. Oak leaves occur in loose bunches around terminal shoots; leave windows through crown.
tips.forEach((t,i)=>{if(rnd()<.09)return;const bunch=5+Math.floor(rnd()*7);for(let q=0;q<bunch;q++){const along=(rnd()-.35)*.45,p=t.p.clone().add(t.d.clone().multiplyScalar(along)).add(new THREE.Vector3(j(.68),j(.48),j(.68)));leaf(p,.22+rnd()*.12)}});
// 12 — EPICORMIC SHOOTS and minor imperfections around the old trunk.
for(let n=0;n<13;n++){const y=1.8+rnd()*5.8,a=rnd()*6.283,r=trunkRadius(y),p=new THREE.Vector3(.014*y*y+Math.cos(a)*r,y,Math.sin(a)*r),d=new THREE.Vector3(Math.cos(a),.28+rnd()*.32,Math.sin(a)).normalize();grow(p,d,.55+rnd()*.8,.04,1,.03,0)}
// 13 — RENDER.
function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.28,6000);
</script></body></html>
