<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Macro bee — high-detail insect zoom</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #dde5d8;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: #182018;
  }

  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    background: #dde5d8;
    touch-action: none;
    user-select: none;
    cursor: grab;
  }

  #stage.grabbing { cursor: grabbing; }

  #subject {
    position: absolute;
    left: 0;
    top: 0;
    width: 4920px;
    height: 3280px;
    max-width: none;
    transform-origin: 0 0;
    will-change: transform;
    pointer-events: none;
    -webkit-user-drag: none;
    image-rendering: auto;
  }

  #title {
    position: fixed;
    left: max(16px, env(safe-area-inset-left));
    top: max(14px, env(safe-area-inset-top));
    z-index: 20;
    padding: 9px 11px;
    border-radius: 12px;
    background: rgba(248, 250, 246, 0.78);
    backdrop-filter: blur(8px);
    box-shadow: 0 2px 16px rgba(28, 39, 27, 0.08);
    pointer-events: none;
  }

  #title b {
    display: block;
    font: 600 21px/1.05 Georgia, serif;
  }

  #title span {
    display: block;
    margin-top: 3px;
    font-size: 11px;
    opacity: 0.68;
  }

  #controls {
    position: fixed;
    right: max(12px, env(safe-area-inset-right));
    bottom: max(13px, env(safe-area-inset-bottom));
    z-index: 30;
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 5px;
    border-radius: 16px;
    background: rgba(23, 32, 24, 0.90);
    box-shadow: 0 4px 20px rgba(0,0,0,0.18);
  }

  #controls button {
    height: 38px;
    min-width: 42px;
    border: 0;
    border-radius: 11px;
    padding: 0 10px;
    background: transparent;
    color: #fff;
    font: 600 20px/1 system-ui;
    touch-action: manipulation;
    cursor: pointer;
  }

  #controls button:active {
    background: rgba(255,255,255,0.14);
  }

  #reset {
    min-width: 54px !important;
    font-size: 18px !important;
  }

  #quality {
    position: fixed;
    right: max(16px, env(safe-area-inset-right));
    bottom: calc(max(13px, env(safe-area-inset-bottom)) + 56px);
    z-index: 25;
    padding: 4px 7px;
    border-radius: 9px;
    background: rgba(23, 32, 24, 0.75);
    color: #fff;
    font-size: 9px;
    letter-spacing: .03em;
    opacity: 0;
    transition: opacity .2s ease;
    pointer-events: none;
  }

  #quality.show { opacity: 1; }

  .credit {
    position: fixed;
    left: max(12px, env(safe-area-inset-left));
    bottom: max(12px, env(safe-area-inset-bottom));
    z-index: 20;
    font-size: 10px;
    background: rgba(248, 250, 246, 0.78);
    padding: 5px 8px;
    border-radius: 10px;
    backdrop-filter: blur(8px);
    color: #253027;
  }

  .credit a {
    color: inherit;
    text-decoration: none;
  }

  .credit a:hover {
    text-decoration: underline;
  }

  #loading {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    background: #dde5d8;
    transition: opacity .35s ease;
  }

  #loading.hide {
    opacity: 0;
    pointer-events: none;
  }

  #loading div {
    padding: 10px 14px;
    border-radius: 999px;
    background: #fffddd;
    box-shadow: 0 4px 18px rgba(0,0,0,0.08);
    font-size: 13px;
  }

  #error {
    display: none;
    max-width: 340px;
    text-align: center;
    line-height: 1.35;
  }

  @media (max-width: 650px) {
    #title { padding: 8px 10px; }
    #title b { font-size: 18px; }
    .credit { font-size: 9px; max-width: 54vw; }
  }
</style>
</head>
<body>
  <div id="stage" aria-label="High-resolution macro photograph of a bee">
    <img id="subject" draggable="false" decoding="async" alt="Macro photograph of a bee on an orange flower">
  </div>

  <div id="title">
    <b>Macro bee</b>
    <span>High-detail insect zoom</span>
  </div>

  <div id="controls" aria-label="Zoom controls">
    <button id="minus" aria-label="Zoom out">−</button>
    <button id="reset" aria-label="Reset view">↺</button>
    <button id="plus" aria-label="Zoom in">+</button>
  </div>

  <div id="quality">HD</div>

  <div class="credit">
    <a href="https://commons.wikimedia.org/wiki/File:Macro_Bee_(52369853728).jpg" target="_blank" rel="noopener">
      Photo: Joshua Tree National Park / Carmen Aurrecoechea · Public domain
    </a>
  </div>

  <div id="loading">
    <div id="loadingText">Loading insect…</div>
    <div id="error">The insect image did not load. Refresh to try again.</div>
  </div>

<script>
(() => {
  const PREVIEW = 'https://commons.wikimedia.org/wiki/Special:FilePath/Macro_Bee_(52369853728).jpg?width=1800';
  const FULL = 'https://commons.wikimedia.org/wiki/Special:FilePath/Macro_Bee_(52369853728).jpg';

  const W = 4920;
  const H = 3280;

  const stage = document.getElementById('stage');
  const img = document.getElementById('subject');
  const loading = document.getElementById('loading');
  const loadingText = document.getElementById('loadingText');
  const error = document.getElementById('error');
  const quality = document.getElementById('quality');

  let x = 0;
  let y = 0;
  let scale = 1;
  let homeScale = 1;
  let minScale = 1;
  let maxScale = 1;

  let previewReady = false;
  let fullReady = false;
  let fullRequested = false;
  let source = 'preview';

  const pointers = new Map();
  let gesture = null;

  const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
  const dist = (a, b) => Math.hypot(b.x - a.x, b.y - a.y);
  const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

  function showQuality(text) {
    quality.textContent = text;
    quality.classList.add('show');
    clearTimeout(showQuality.timer);
    showQuality.timer = setTimeout(() => quality.classList.remove('show'), 1200);
  }

  function constrain() {
    const dw = W * scale;
    const dh = H * scale;

    if (dw <= stage.clientWidth) x = (stage.clientWidth - dw) / 2;
    else x = clamp(x, stage.clientWidth - dw, 0);

    if (dh <= stage.clientHeight) y = (stage.clientHeight - dh) / 2;
    else y = clamp(y, stage.clientHeight - dh, 0);
  }

  function render() {
    constrain();
    img.style.transform = `translate3d(${x}px, ${y}px, 0) scale(${scale})`;

    if (scale / homeScale >= 1.35) requestFull();
  }

  function home() {
    homeScale = Math.max(stage.clientWidth / W, stage.clientHeight / H);
    minScale = homeScale;

    /* capped before blur gets too ugly */
    maxScale = homeScale * 5;

    scale = homeScale;
    x = (stage.clientWidth - W * scale) / 2;
    y = (stage.clientHeight - H * scale) / 2;
    render();
  }

  function zoomAt(px, py, factor) {
    const next = clamp(scale * factor, minScale, maxScale);
    if (next === scale) return;

    const ix = (px - x) / scale;
    const iy = (py - y) / scale;

    scale = next;
    x = px - ix * scale;
    y = py - iy * scale;
    render();
  }

  function requestFull() {
    if (fullRequested || fullReady) return;

    fullRequested = true;
    showQuality('HD loading…');

    const hi = new Image();
    hi.decoding = 'async';

    hi.onload = () => {
      fullReady = true;
      source = 'full';
      img.src = FULL;
      showQuality('HD');
    };

    hi.onerror = () => {
      fullRequested = false;
      showQuality('Preview only');
    };

    hi.src = FULL;
  }

  function beginGesture() {
    const p = [...pointers.values()];

    if (p.length === 1) {
      gesture = { type: 'pan', px: p[0].x, py: p[0].y, x, y };
      stage.classList.add('grabbing');
    } else if (p.length >= 2) {
      const a = p[0];
      const b = p[1];
      const m = mid(a, b);

      gesture = {
        type: 'pinch',
        d: Math.max(1, dist(a, b)),
        scale,
        x,
        y,
        ix: (m.x - x) / scale,
        iy: (m.y - y) / scale
      };
      stage.classList.add('grabbing');
    }
  }

  stage.addEventListener('pointerdown', e => {
    stage.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    beginGesture();
  });

  stage.addEventListener('pointermove', e => {
    if (!pointers.has(e.pointerId)) return;

    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    const p = [...pointers.values()];

    if (p.length === 1 && gesture?.type === 'pan') {
      x = gesture.x + p[0].x - gesture.px;
      y = gesture.y + p[0].y - gesture.py;
      render();
      return;
    }

    if (p.length >= 2) {
      if (gesture?.type !== 'pinch') beginGesture();

      const a = p[0];
      const b = p[1];
      const m = mid(a, b);
      const next = clamp(gesture.scale * dist(a, b) / gesture.d, minScale, maxScale);

      scale = next;
      x = m.x - gesture.ix * scale;
      y = m.y - gesture.iy * scale;
      render();
    }
  });

  function releasePointer(e) {
    pointers.delete(e.pointerId);
    if (pointers.size) beginGesture();
    else {
      gesture = null;
      stage.classList.remove('grabbing');
    }
  }

  stage.addEventListener('pointerup', releasePointer);
  stage.addEventListener('pointercancel', releasePointer);

  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const rect = stage.getBoundingClientRect();
    zoomAt(
      e.clientX - rect.left,
      e.clientY - rect.top,
      Math.exp(-e.deltaY * 0.0015)
    );
  }, { passive: false });

  stage.addEventListener('dblclick', e => {
    const rect = stage.getBoundingClientRect();
    zoomAt(e.clientX - rect.left, e.clientY - rect.top, 1.8);
  });

  document.getElementById('plus').onclick = () => {
    zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1.5);
  };

  document.getElementById('minus').onclick = () => {
    zoomAt(stage.clientWidth / 2, stage.clientHeight / 2, 1 / 1.5);
  };

  document.getElementById('reset').onclick = home;

  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(home, 100);
  });

  img.onload = () => {
    if (!previewReady) {
      previewReady = true;
      home();
      loading.classList.add('hide');
      setTimeout(() => loading.remove(), 450);
    }
  };

  img.onerror = () => {
    if (source === 'preview') {
      source = 'full';
      img.src = FULL;
    } else {
      loadingText.style.display = 'none';
      error.style.display = 'block';
    }
  };

  img.src = PREVIEW;

  if ('requestIdleCallback' in window) {
    requestIdleCallback(() => requestFull(), { timeout: 6000 });
  } else {
    setTimeout(requestFull, 6000);
  }
})();
</script>
</body>
</html>
