<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>English oak — deep zoom</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#dfe7dc;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#182018}#viewer{position:fixed;inset:0;background:#dfe7dc;touch-action:none}#title{position:fixed;left:max(16px,env(safe-area-inset-left));top:max(14px,env(safe-area-inset-top));z-index:20;padding:9px 11px;border-radius:12px;background:#f8faf6c9;backdrop-filter:blur(8px);box-shadow:0 2px 16px #1c271b18;pointer-events:none}#title b{display:block;font:600 21px/1.05 Georgia,serif}#title span{display:block;margin-top:3px;font-size:11px;opacity:.68}#controls{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(13px,env(safe-area-inset-bottom));z-index:30;display:flex;align-items:center;gap:5px;padding:5px;border-radius:16px;background:#172018e8;box-shadow:0 4px 20px #0003}#controls button{height:38px;min-width:40px;border:0;border-radius:11px;padding:0 10px;background:transparent;color:#fff;font:600 20px/1 system-ui;touch-action:manipulation}#controls button:active{background:#ffffff22}#zoom{min-width:72px!important;font-size:12px!important}.credit{position:fixed;left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));z-index:20;font-size:10px;background:#f8faf6c9;padding:5px 8px;border-radius:10px;backdrop-filter:blur(8px);color:#253027}.credit a{color:inherit;text-decoration:none}.credit a:hover{text-decoration:underline}#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:#dfe7dc;transition:opacity .35s}#loading.hide{opacity:0;pointer-events:none}#loading div{padding:10px 14px;border-radius:999px;background:#fffddd;box-shadow:0 4px 18px #0001;font-size:13px}#error{display:none;max-width:320px;text-align:center;line-height:1.35}@media(max-width:650px){#title{padding:8px 10px}#title b{font-size:18px}.credit{font-size:9px;max-width:54vw}}
</style>
</head>
<body>
<div id="viewer" aria-label="Deep zoom photograph of an English oak"></div>
<div id="title"><b>English oak</b><span>Quercus robur · deep zoom</span></div>
<div id="controls"><button id="minus" aria-label="Zoom out">−</button><button id="zoom" aria-label="Reset zoom">100%</button><button id="plus" aria-label="Zoom in">+</button></div>
<div class="credit"><a href="https://commons.wikimedia.org/wiki/File:Solitary_Quercus_robur.jpg" target="_blank" rel="noopener">Photo: Krzysztof Golik · CC BY-SA 4.0</a></div>
<div id="loading"><div id="loadingText">Loading high-resolution oak…</div><div id="error">The high-resolution image service did not load. Refresh to try again.</div></div>
<script src="https://cdn.jsdelivr.net/npm/openseadragon@6.0.2/build/openseadragon/openseadragon.min.js"></script>
<script>
(()=>{
const tileSource='https://tools.wmflabs.org/zoomviewer/proxy.php?iiif=Solitary_Quercus_robur.jpg/info.json';
const loading=document.getElementById('loading'),loadingText=document.getElementById('loadingText'),error=document.getElementById('error'),zoomLabel=document.getElementById('zoom');
let homeZoom=1,ready=false,clamping=false;
const viewer=OpenSeadragon({
 id:'viewer',tileSources:tileSource,prefixUrl:'https://cdn.jsdelivr.net/npm/openseadragon@6.0.2/build/openseadragon/images/',
 showNavigationControl:false,gestureSettingsTouch:{pinchToZoom:true,flickEnabled:true,clickToZoom:false,dblClickToZoom:true},
 gestureSettingsMouse:{scrollToZoom:true,clickToZoom:false,dblClickToZoom:true},
 animationTime:.28,blendTime:.08,constrainDuringPan:true,visibilityRatio:1,homeFillsViewer:true,maxZoomPixelRatio:25,immediateRender:false
});
function pct(){if(!ready)return;zoomLabel.textContent=Math.round(viewer.viewport.getZoom()/homeZoom*100)+'%'}
function clampMin(){if(!ready||clamping)return;const z=viewer.viewport.getZoom();if(z<homeZoom){clamping=true;viewer.viewport.zoomTo(homeZoom,null,true);viewer.viewport.applyConstraints(true);clamping=false}pct()}
viewer.addHandler('open',()=>{
 viewer.viewport.goHome(true);homeZoom=viewer.viewport.getZoom();ready=true;viewer.viewport.minZoomLevel=homeZoom;viewer.viewport.applyConstraints(true);pct();loading.classList.add('hide');setTimeout(()=>loading.remove(),450);
});
viewer.addHandler('zoom',clampMin);viewer.addHandler('animation',pct);viewer.addHandler('animation-finish',()=>{viewer.viewport.applyConstraints(true);clampMin()});
viewer.addHandler('open-failed',()=>{loadingText.style.display='none';error.style.display='block'});
document.getElementById('plus').onclick=()=>{if(!ready)return;viewer.viewport.zoomBy(1.5);viewer.viewport.applyConstraints()};
document.getElementById('minus').onclick=()=>{if(!ready)return;viewer.viewport.zoomBy(1/1.5);viewer.viewport.applyConstraints()};
zoomLabel.onclick=()=>{if(!ready)return;viewer.viewport.goHome();};
window.addEventListener('resize',()=>{if(!ready)return;setTimeout(()=>{viewer.viewport.goHome(true);homeZoom=viewer.viewport.getZoom();viewer.viewport.minZoomLevel=homeZoom;pct()},80)});
})();
</script>
</body>
</html>
