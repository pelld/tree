<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tree — English oak branch study</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd7c5;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}
#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}#title b{display:block;font:600 22px Georgia,serif}#title span{font-size:12px;font-style:italic;opacity:.76}
#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none;transition:opacity 1s}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;padding:10px 14px;border-radius:20px;background:#ffffffdd;font-size:13px;box-shadow:0 4px 20px #0002;pointer-events:none}
#gear{position:fixed;right:12px;top:12px;z-index:5;width:38px;height:38px;border:0;border-radius:19px;background:#172117cc;color:white;font-size:18px}
#panel{display:none;position:fixed;right:12px;top:58px;z-index:5;width:220px;padding:12px;border-radius:12px;background:#f5f7f0ee;box-shadow:0 5px 22px #0003;font-size:12px}#panel.show{display:block}#panel label{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:7px;margin:7px 0}#panel input{min-width:0;width:100%}#panel .buttons{display:flex;gap:7px;margin-top:10px}#panel button{flex:1;border:0;border-radius:8px;padding:8px;background:#263722;color:#fff}
</style>
</head>
<body>
<div id="title"><b>English oak</b><span>branch study · one scaffold limb, no leaves</span></div>
<div id="status">Growing oak branch…</div>
<div id="hint">Drag to orbit · pinch / scroll to inspect</div>
<button id="gear" aria-label="Tree settings">⚙</button>
<div id="panel">
  <label><span>Seed</span><input id="seedInput" type="number" value="88231"></label>
  <label><span>Tree size</span><input id="sizeInput" type="range" min="0.75" max="1.35" step="0.05" value="1"></label>
  <label><span>Branching</span><input id="branchInput" type="range" min="0.7" max="1.5" step="0.05" value="1.05"></label>
  <label><span>Randomness</span><input id="randomInput" type="range" min="0.35" max="1.35" step="0.05" value="0.82"></label>
  <div class="buttons"><button id="regen">Regenerate</button><button id="newSeed">New seed</button></div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

// 01 — SCENE
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcbd7c5);scene.fog=new THREE.FogExp2(0xcbd7c5,.0038);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.03,350);camera.position.set(20,10.5,28);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.04;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-3.8,6.6,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=.18;controls.maxDistance=70;controls.zoomToCursor=true;
scene.add(new THREE.HemisphereLight(0xdce8d5,0x4a4237,1.45));const sun=new THREE.DirectionalLight(0xffefd0,3.15);sun.position.set(-18,29,14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-28;sun.shadow.camera.right=28;sun.shadow.camera.top=28;sun.shadow.camera.bottom=-10;sun.shadow.bias=-.00018;scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(55,80),new THREE.MeshStandardMaterial({color:0x788861,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// 02 — MATERIALS
const barkMat=new THREE.MeshStandardMaterial({color:0x493b30,roughness:1});
const oldBranchMat=new THREE.MeshStandardMaterial({color:0x524136,roughness:1});
const youngBranchMat=new THREE.MeshStandardMaterial({color:0x5b4736,roughness:1});
const fineBranchMat=new THREE.MeshStandardMaterial({color:0x4a3d2e,roughness:1});
const twigMat=new THREE.MeshStandardMaterial({color:0x373524,roughness:1});
const woodMats=[barkMat,oldBranchMat,oldBranchMat,youngBranchMat,fineBranchMat,twigMat];
const treeRoot=new THREE.Group();scene.add(treeRoot);let generatedMeshes=[];

// 03 — SEEDED RANDOMNESS
let seed=88231,randomness=.82;
function resetRandom(v){seed=Math.max(1,Math.floor(v)||1)%2147483647;if(seed===0)seed=1}
function rnd(){seed=seed*16807%2147483647;return(seed-1)/2147483646}
function jitter(a){return(rnd()-.5)*a*randomness}
function randRange(a,b){return a+(b-a)*rnd()}

// 04 — BRANCH DATA MODEL
const branches=[];const MAX_BRANCHES=3200;
function radiusAt(branch,t){return branch.r1+(branch.r0-branch.r1)*Math.pow(1-t,.78)}
function tangentAt(branch,t){if(!branch.curve)branch.curve=new THREE.CatmullRomCurve3(branch.points,false,'centripetal');return branch.curve.getTangentAt(THREE.MathUtils.clamp(t,0,1)).normalize()}
function pointAt(branch,t){if(!branch.curve)branch.curve=new THREE.CatmullRomCurve3(branch.points,false,'centripetal');return branch.curve.getPointAt(THREE.MathUtils.clamp(t,0,1))}
function makeBranch(start,direction,length,r0,r1,order,parent=null,character={}){
  if(branches.length>=MAX_BRANCHES)return null;
  const steps=order===0?14:order===1?11:order===2?9:order===3?8:order===4?7:6;
  const points=[start.clone()]; let p=start.clone(), d=direction.clone().normalize(); const startHeight=start.y;
  for(let i=1;i<=steps;i++){
    const t=i/steps; const outward=new THREE.Vector3(p.x,0,p.z); if(outward.lengthSq()>.02) outward.normalize();
    const wander=(order===0?.016:order===1?.028:order===2?.046:order===3?.062:order===4?.085:.10)*randomness;
    d.add(new THREE.Vector3(jitter(wander),jitter(wander*.60),jitter(wander))).normalize();
    if(order===0){
      const leaderBias=new THREE.Vector3(.025,1,.008).normalize(); d.lerp(leaderBias,.14);
    }else if(order===1){
      const high=THREE.MathUtils.clamp((startHeight-2.0)/7.5,0,1), targetY=.06+.14*high-(.10-.02*high)*t+(character.droop||0)*t;
      d.y=THREE.MathUtils.lerp(d.y,targetY,.18); if(outward.lengthSq()) d.addScaledVector(outward,.022); d.normalize();
    }else{
      const upBias=order===2?.01:order===3?.024:order===4?.042:.06; d.y+=upBias*(1-Math.abs(d.y));
      if(outward.lengthSq()) d.addScaledVector(outward,order>=4?.015:.025); if(character.droop) d.y+=character.droop*t*.25; d.normalize();
    }
    const segLen=length/steps*(.94+rnd()*.13); p=p.clone().add(d.clone().multiplyScalar(segLen)); points.push(p.clone());
  }
  const branch={start:start.clone(),end:points.at(-1).clone(),length,r0,r1,diameter:r0*2,order,parent,children:[],points,curve:null,phase:rnd()*Math.PI*2};
  branches.push(branch); if(parent) parent.children.push(branch); return branch;
}

// 05 — SMOOTH CONTINUOUS TAPERED WOOD
function taperedTube(branch){
  const curve=new THREE.CatmullRomCurve3(branch.points,false,'centripetal'); branch.curve=curve;
  const segments=branch.order===0?46:branch.order===1?34:branch.order===2?24:branch.order===3?17:branch.order===4?12:8;
  const sides=branch.order===0?14:branch.order===1?11:branch.order===2?9:branch.order===3?7:branch.order===4?6:5;
  const g=new THREE.TubeGeometry(curve,segments,1,sides,false), pos=g.attributes.position, uv=g.attributes.uv, c=new THREE.Vector3(), v=new THREE.Vector3();
  for(let i=0;i<pos.count;i++){
    const t=uv.getX(i); curve.getPointAt(t,c); v.set(pos.getX(i),pos.getY(i),pos.getZ(i)).sub(c);
    const ripple=1+(branch.order<=2?.014:.008)*Math.sin(t*16+branch.phase)+(branch.order===0?jitter(.006):0), r=radiusAt(branch,t)*ripple;
    v.multiplyScalar(r); pos.setXYZ(i,c.x+v.x,c.y+v.y,c.z+v.z);
  }
  g.computeVertexNormals(); return g;
}
function renderWood(){
  const buckets=Array.from({length:6},()=>[]); for(const b of branches) buckets[b.order].push(taperedTube(b));
  buckets.forEach((geoms,order)=>{
    if(!geoms.length) return; const merged=mergeGeometries(geoms,false); geoms.forEach(g=>g.dispose());
    const mesh=new THREE.Mesh(merged,woodMats[order]); mesh.castShadow=order<=4; mesh.receiveShadow=true; treeRoot.add(mesh); generatedMeshes.push(mesh);
  });
}

// 06 — ONE OAK SCAFFOLD LIMB STUDY
function buildStudy(size,branchDensity){
  branches.length=0;
  const trunkH=10.4*size;
  const trunk=makeBranch(new THREE.Vector3(0,0,0),new THREE.Vector3(.015,1,.006),trunkH,1.32*size,.24*size,0,null);

  // restrained buttress roots just to seat the trunk
  const rootCount=4+Math.floor(rnd()*2);
  for(let i=0;i<rootCount;i++){
    const a=Math.PI*.9+i/rootCount*Math.PI*1.1+jitter(.22),dir=new THREE.Vector3(Math.cos(a),-.025+rnd()*.02,Math.sin(a)).normalize(),len=randRange(1.05,1.75)*size;
    makeBranch(new THREE.Vector3(jitter(.06),.12,jitter(.06)),dir,len,randRange(.18,.24)*size,.035*size,1,trunk,{droop:-.05});
  }

  // single large lower-left scaffold limb
  const attachT=.44+jitter(.015), attach=pointAt(trunk,attachT), attachR=radiusAt(trunk,attachT);
  const primaryDir=new THREE.Vector3(-1,.14,-.12).normalize();
  const mainLimb=makeBranch(attach,primaryDir,7.8*size,attachR*.50,attachR*.18,1,trunk,{droop:-.04});

  function lateralDirection(parent,t,childOrder){
    const tang=tangentAt(parent,t), ref=Math.abs(tang.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0), u=new THREE.Vector3().crossVectors(tang,ref).normalize(), v=new THREE.Vector3().crossVectors(tang,u).normalize();
    const ang=randRange(.70,2.35)*(rnd()<.52?-1:1), side=u.clone().multiplyScalar(Math.cos(ang)).add(v.clone().multiplyScalar(Math.sin(ang))).normalize();
    const origin=pointAt(parent,t), outward=new THREE.Vector3(origin.x,0,origin.z); if(outward.lengthSq()>.02) outward.normalize();
    const dir=tang.clone().multiplyScalar(randRange(.40,.58)).add(side.multiplyScalar(randRange(.72,.98)));
    if(outward.lengthSq()) dir.addScaledVector(outward,childOrder<=2?.10:.05);
    dir.y+=childOrder<=2?.03:.055;
    if(parent.order<=2&&rnd()<.12) dir.y-=randRange(.06,.16);
    return dir.normalize();
  }
  function continuationDirection(parent){
    const tang=tangentAt(parent,.995), origin=parent.end, outward=new THREE.Vector3(origin.x,0,origin.z); if(outward.lengthSq()>.02) outward.normalize();
    const d=tang.clone().add(new THREE.Vector3(jitter(.08),jitter(.05),jitter(.08))); if(outward.lengthSq()) d.addScaledVector(outward,.022);
    if(parent.order>=3) d.y+=.03; return d.normalize();
  }
  function terminalDirection(parent,t){
    const tang=tangentAt(parent,t), ref=Math.abs(tang.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0), u=new THREE.Vector3().crossVectors(tang,ref).normalize(), v=new THREE.Vector3().crossVectors(tang,u).normalize(), ang=rnd()*Math.PI*2;
    return tang.clone().multiplyScalar(randRange(.76,.90)).add(u.multiplyScalar(Math.cos(ang)*randRange(.16,.30))).add(v.multiplyScalar(Math.sin(ang)*randRange(.16,.30))).add(new THREE.Vector3(0,.02+jitter(.03),0)).normalize();
  }

  function spawn(parent){
    if(!parent||parent.order>=5||branches.length>=MAX_BRANCHES) return;
    const order=parent.order, next=order+1;

    // one clear continuation keeps the branch flowing outward and tapering toward a point
    const contR0=Math.max(.0022*size,parent.r1*randRange(.88,.97));
    const contRatio=next===2?randRange(.56,.66):next===3?randRange(.48,.58):next===4?randRange(.36,.48):randRange(.12,.18);
    const contR1=Math.max(next===5?.00055*size:.0015*size,contR0*contRatio);
    const contLen=parent.length*(order===1?randRange(.60,.74):order===2?randRange(.54,.66):order===3?randRange(.47,.58):randRange(.38,.48));
    const cont=makeBranch(parent.end,continuationDirection(parent),Math.max(.12*size,contLen),contR0,contR1,next,parent,{droop:0});
    if(cont) spawn(cont);

    // laterals spaced along the branch; denser but smaller toward the outer orders
    let lateralBase=order===1?4.3:order===2?3.9:order===3?3.3:2.6;
    let lateralCount=Math.max(1,Math.round(lateralBase*branchDensity*randRange(.92,1.18)));
    const startT=order===1?.18:order===4?.34:.20, endT=order===4?.93:.84;
    for(let i=0;i<lateralCount&&branches.length<MAX_BRANCHES;i++){
      const frac=(i+1)/(lateralCount+1), biased=order>=3?Math.pow(frac,.76):frac, t=THREE.MathUtils.clamp(startT+(endT-startT)*biased+jitter(order>=3?.03:.05),.14,.95);
      const origin=pointAt(parent,t), localR=radiusAt(parent,t);
      const rf=order===1?randRange(.30,.42):order===2?randRange(.27,.38):order===3?randRange(.22,.32):randRange(.16,.24);
      const r0=Math.max(.0017*size,localR*rf), r1=Math.max(next===5?.0005*size:.0012*size,r0*(next===5?randRange(.08,.14):randRange(.24,.38)));
      const lf=order===1?randRange(.36,.52):order===2?randRange(.31,.45):order===3?randRange(.26,.39):randRange(.18,.30);
      const len=Math.max(.11*size,parent.length*lf), droop=next<=3&&rnd()<.10?-randRange(.03,.09):0;
      const dir=order===4?terminalDirection(parent,t):lateralDirection(parent,t,next);
      const child=makeBranch(origin,dir,len,r0,r1,next,parent,{droop});
      if(child) spawn(child);
    }

    // small terminal fan near the ends of fine branches to capture oak twigging
    if(order===4&&branches.length<MAX_BRANCHES){
      const fanCount=Math.max(1,Math.round((1.6+rnd()*1.4)*branchDensity));
      for(let k=0;k<fanCount&&branches.length<MAX_BRANCHES;k++){
        const t=randRange(.82,.99), origin=pointAt(parent,t), localR=radiusAt(parent,t), r0=Math.max(.0014*size,localR*randRange(.16,.24)), r1=.00045*size, len=Math.max(.09*size,parent.length*randRange(.14,.22));
        makeBranch(origin,terminalDirection(parent,t),len,r0,r1,5,parent,{droop:0});
      }
    }
  }

  spawn(mainLimb);
}

// 07 — BUILD / REBUILD
function clearTree(){for(const m of generatedMeshes){if(m.geometry&&m.geometry!==ground.geometry)m.geometry.dispose();treeRoot.remove(m)}generatedMeshes=[];while(treeRoot.children.length)treeRoot.remove(treeRoot.children[0])}
function generate(){
  document.querySelector('#status').style.display='block'; document.querySelector('#status').textContent='Growing oak branch…';
  setTimeout(()=>{
    clearTree(); const size=+document.querySelector('#sizeInput').value, branchDensity=+document.querySelector('#branchInput').value; randomness=+document.querySelector('#randomInput').value; resetRandom(+document.querySelector('#seedInput').value);
    buildStudy(size,branchDensity); renderWood(); console.log(`oak branch study: ${branches.length} woody branches`); document.querySelector('#status').style.display='none';
  },20);
}

// 08 — UI + RENDER LOOP
document.querySelector('#gear').onclick=()=>document.querySelector('#panel').classList.toggle('show');
document.querySelector('#regen').onclick=generate; document.querySelector('#newSeed').onclick=()=>{document.querySelector('#seedInput').value=Math.floor(1+Math.random()*999999999); generate()};
function animate(){controls.update(); renderer.render(scene,camera); requestAnimationFrame(animate)}
animate(); generate(); addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight)}); setTimeout(()=>document.querySelector('#hint').style.opacity=.24,6000);
</script>
</body>
</html>
