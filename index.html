<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tree — English oak branch study</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd7c5;font-family:system-ui;color:#182016}
canvas{display:block;touch-action:none}
#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}
#title b{display:block;font:600 22px Georgia,serif}
#title span{font-size:12px;font-style:italic;opacity:.76}
#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none;transition:opacity 1s}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;padding:10px 14px;border-radius:20px;background:#ffffffdd;font-size:13px;box-shadow:0 4px 20px #0002;pointer-events:none}
#gear{position:fixed;right:12px;top:12px;z-index:5;width:38px;height:38px;border:0;border-radius:19px;background:#172117cc;color:#fff;font-size:18px}
#panel{display:none;position:fixed;right:12px;top:58px;z-index:5;width:220px;padding:12px;border-radius:12px;background:#f5f7f0ee;box-shadow:0 5px 22px #0003;font-size:12px}
#panel.show{display:block}
#panel label{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:7px;margin:7px 0}
#panel input{min-width:0;width:100%}
#panel .buttons{display:flex;gap:7px;margin-top:10px}
#panel button{flex:1;border:0;border-radius:8px;padding:8px;background:#263722;color:#fff}
</style>
</head>
<body>
<div id="title"><b>English oak</b><span>branch study · staged scaffold hierarchy · no leaves</span></div>
<div id="status">Growing oak branch…</div>
<div id="hint">Drag to orbit · pinch / scroll to inspect</div>
<button id="gear">⚙</button>
<div id="panel">
  <label><span>Seed</span><input id="seedInput" type="number" value="88231"></label>
  <label><span>Branching</span><input id="densityInput" type="range" min="0.75" max="1.25" step="0.05" value="1"></label>
  <label><span>Randomness</span><input id="randomInput" type="range" min="0.1" max="0.6" step="0.05" value="0.20"></label>
  <div class="buttons"><button id="regen">Regenerate</button><button id="newSeed">New seed</button></div>
</div>

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

// 01 — SCENE
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xcbd7c5);
scene.fog=new THREE.FogExp2(0xcbd7c5,.0032);

const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.03,220);
camera.position.set(11.4,8.0,19.8);

const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.06;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(-4.7,5.2,-.3);
controls.enableDamping=true;
controls.dampingFactor=.06;
controls.minDistance=.18;
controls.maxDistance=50;
controls.zoomToCursor=true;

scene.add(new THREE.HemisphereLight(0xdce8d5,0x4a4237,1.55));
const sun=new THREE.DirectionalLight(0xffefd0,3.0);
sun.position.set(-14,24,11);
sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-7;
scene.add(sun);

const ground=new THREE.Mesh(
  new THREE.CircleGeometry(40,72),
  new THREE.MeshStandardMaterial({color:0x788861,roughness:1})
);
ground.rotation.x=-Math.PI/2;
ground.receiveShadow=true;
scene.add(ground);

// 02 — MODEL + SEEDED RANDOMNESS
const mats=[0x493b30,0x514136,0x554437,0x594838,0x493b2f].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));
const treeRoot=new THREE.Group();
scene.add(treeRoot);

let meshes=[];
const branches=[];
let seed=88231,randomness=.20;

function reset(v){seed=Math.max(1,Math.floor(v)||1)%2147483647;if(!seed)seed=1}
function rnd(){seed=seed*16807%2147483647;return(seed-1)/2147483646}
function rr(a,b){return a+(b-a)*rnd()}
function jit(a){return(rnd()-.5)*a*randomness}

function branch(points,r0,r1,order,parent=null){
  const curve=new THREE.CatmullRomCurve3(points,false,'centripetal');
  const b={points,r0,r1,order,parent,children:[],curve,length:curve.getLength(),phase:rnd()*6.283};
  if(parent)parent.children.push(b);
  branches.push(b);
  return b;
}
function pointAt(b,t){return b.curve.getPointAt(THREE.MathUtils.clamp(t,0,1))}
function tangentAt(b,t){return b.curve.getTangentAt(THREE.MathUtils.clamp(t,0,1)).normalize()}
function radiusAt(b,t){return b.r1+(b.r0-b.r1)*Math.pow(1-t,.76)}
function frameAt(parent,t){
  const tan=tangentAt(parent,t);
  const ref=Math.abs(tan.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0);
  const u=new THREE.Vector3().crossVectors(tan,ref).normalize();
  const v=new THREE.Vector3().crossVectors(u,tan).normalize();
  return{tan,u,v};
}
function dirAround(parent,t,azimuth,angle,verticalBias=0){
  const {tan,u,v}=frameAt(parent,t);
  const radial=u.clone().multiplyScalar(Math.cos(azimuth)).add(v.clone().multiplyScalar(Math.sin(azimuth))).normalize();
  const d=tan.clone().multiplyScalar(Math.cos(angle)).add(radial.multiplyScalar(Math.sin(angle)));
  d.y+=verticalBias;
  return d.normalize();
}

// 03 — GROW ONE ORGANIC AXIS
// Every child initially shares its parent's tangent, so the fork has a natural crotch,
// then progressively adopts its own direction.
function growAxis(parent,t,targetDir,len,r0,r1,order,{rise=0,droop=0,wander=1}={}){
  const start=pointAt(parent,t);
  const parentTan=tangentAt(parent,t);
  const steps=order===2?18:order===3?15:12;
  const pts=[start.clone()];
  let p=start.clone();

  for(let i=1;i<=steps;i++){
    const f=i/steps;
    const endTurn=order===2?.86:order===3?.80:.74;
    const ease=THREE.MathUtils.smoothstep(f,.045,endTurn);
    const d=parentTan.clone().lerp(targetDir,ease);
    const wig=(order===2?.010:order===3?.017:.024)*wander;
    d.x+=jit(wig);
    d.z+=jit(wig);
    d.y+=jit(wig*.48)+rise*Math.sin(Math.PI*f)-droop*f*f;
    d.normalize();
    p=p.clone().add(d.multiplyScalar(len/steps*(.993+rr(-.010,.014))));
    pts.push(p.clone());
  }
  return branch(pts,r0,r1,order,parent);
}

// 04 — SMOOTH TAPER + BRANCH COLLARS
function render(){
  const buckets=Array.from({length:5},()=>[]);

  for(const b of branches){
    const seg=b.order===0?48:b.order===1?54:b.order===2?40:b.order===3?30:22;
    const sides=b.order===0?14:b.order===1?12:b.order===2?10:b.order===3?8:6;
    const g=new THREE.TubeGeometry(b.curve,seg,1,sides,false);
    const pos=g.attributes.position,uv=g.attributes.uv,c=new THREE.Vector3(),v=new THREE.Vector3();

    for(let i=0;i<pos.count;i++){
      const t=uv.getX(i);
      b.curve.getPointAt(t,c);
      v.set(pos.getX(i),pos.getY(i),pos.getZ(i)).sub(c);

      const collar=b.parent&&t<.15
        ?1+(b.order===2?.24:b.order===3?.15:.08)*(1-t/.15)
        :1;

      const r=radiusAt(b,t)*collar*(1+(b.order<3?.0045:.0022)*Math.sin(15*t+b.phase));
      v.multiplyScalar(r);
      pos.setXYZ(i,c.x+v.x,c.y+v.y,c.z+v.z);
    }

    g.computeVertexNormals();
    buckets[b.order].push(g);
  }

  buckets.forEach((gs,o)=>{
    if(!gs.length)return;
    const merged=mergeGeometries(gs,false);
    gs.forEach(g=>g.dispose());
    const m=new THREE.Mesh(merged,mats[o]);
    m.castShadow=true;
    m.receiveShadow=true;
    treeRoot.add(m);
    meshes.push(m);
  });
}

// 05 — STRUCTURAL GROWTH UNIT
// A mature branch is not a sequence of terminal Ys. Along each axis there is usually
// a smaller lateral before the next major fork. The continuation stays stronger.
// At the terminal fork, cross-sectional area is approximately conserved:
// continuation ≈ 0.82 parent radius, lateral ≈ 0.57 parent radius.
function growUnit(axis,depth,phase,density=1){
  if(depth<=0||axis.order>=4)return;

  const nextOrder=Math.min(4,axis.order+1);

  // A modest lateral part-way along the axis.
  const midT=rr(.48,.64);
  const midR=radiusAt(axis,midT);
  const midAngle=axis.order===2?rr(.52,.68):rr(.42,.58);
  const midAz=phase+(rnd()<.5?-1:1)*rr(1.15,1.85);
  const midBias=rr(-.035,.075);
  const midDir=dirAround(axis,midT,midAz,midAngle,midBias);
  const mid=growAxis(
    axis,midT,midDir,
    axis.length*(axis.order===2?rr(.38,.47):rr(.32,.41))*density,
    midR*rr(.40,.48),
    midR*rr(.10,.14),
    nextOrder,
    {rise:midBias>0?.003:0,droop:midBias<0?.012:0,wander:.52}
  );

  // The distal fork: a strong continuation and a smaller lateral.
  const t=.985;
  const r=radiusAt(axis,t);
  const contDir=dirAround(axis,t,phase+jit(.08),rr(.12,.22),axis.order===2?rr(.025,.070):rr(.015,.050));
  const latAz=phase+(rnd()<.5?-1:1)*rr(1.65,2.25);
  const latBias=rr(-.030,.080);
  const latDir=dirAround(axis,t,latAz,axis.order===2?rr(.54,.72):rr(.45,.62),latBias);

  // Approximate area-preserving fork: .82² + .57² ≈ 1.
  const cont0=r*rr(.80,.84);
  const lat0=r*rr(.54,.59);

  const cont=growAxis(
    axis,t,contDir,
    axis.length*(axis.order===2?rr(.61,.70):rr(.54,.63)),
    cont0,cont0*rr(.40,.49),nextOrder,
    {rise:.003,wander:.40}
  );
  const lat=growAxis(
    axis,t,latDir,
    axis.length*(axis.order===2?rr(.46,.55):rr(.39,.49)),
    lat0,lat0*rr(.32,.40),nextOrder,
    {rise:latBias>0?.002:0,droop:latBias<0?.010:0,wander:.48}
  );

  if(depth>1){
    growUnit(cont,depth-1,phase+rr(.38,.72),density*.97);
    growUnit(lat,depth-1,phase-rr(.48,.82),density*.90);
    if(depth>2)growUnit(mid,depth-1,phase+rr(.80,1.20),density*.88);
  }
}

// 06 — ONE MATURE OAK SCAFFOLD LIMB
function build(density){
  branches.length=0;

  const trunkPts=[
    new THREE.Vector3(0,0,0),
    new THREE.Vector3(.02,1.25,.01),
    new THREE.Vector3(.04,2.50,.02),
    new THREE.Vector3(.02,3.75,.04),
    new THREE.Vector3(-.02,4.95,.06),
    new THREE.Vector3(-.05,5.65,.08)
  ];
  const trunk=branch(trunkPts,1.0,.54,0,null);
  const attach=pointAt(trunk,.73);
  const tr=radiusAt(trunk,.73);

  // The primary scaffold is long, crooked and gradually tapering.
  const p=[
    attach.clone(),
    attach.clone().add(new THREE.Vector3(-.72,.30,-.02)),
    attach.clone().add(new THREE.Vector3(-1.62,.58,-.10)),
    attach.clone().add(new THREE.Vector3(-2.65,.78,-.23)),
    attach.clone().add(new THREE.Vector3(-3.70,.86,-.38)),
    attach.clone().add(new THREE.Vector3(-4.72,.82,-.50)),
    attach.clone().add(new THREE.Vector3(-5.68,.70,-.56)),
    attach.clone().add(new THREE.Vector3(-6.55,.58,-.52)),
    attach.clone().add(new THREE.Vector3(-7.30,.57,-.40))
  ];
  const primary=branch(p,tr*.64,tr*.16,1,trunk);

  // Three major secondaries distributed along the scaffold.
  // They deliberately occupy different planes but remain readable from the default side view.
  const specs=[
    {t:.27,dir:new THREE.Vector3(-1,.58,-.28),len:4.15,base:.54,tip:.16},
    {t:.47,dir:new THREE.Vector3(-1,-.18,.34),len:3.55,base:.47,tip:.15,droop:.035},
    {t:.64,dir:new THREE.Vector3(-1,.46,.30),len:3.35,base:.45,tip:.14}
  ];

  const systems=[];
  for(const s of specs){
    const r=radiusAt(primary,s.t);
    const sec=growAxis(
      primary,s.t,s.dir.clone().normalize(),s.len,
      r*s.base,r*s.tip,2,
      {rise:s.dir.y>0?.005:0,droop:s.droop||0,wander:.38}
    );
    systems.push(sec);
  }

  // The outer end of the scaffold divides into two substantial co-dominant axes.
  const forkT=.94,forkR=radiusAt(primary,forkT);
  const upper=growAxis(primary,forkT,new THREE.Vector3(-1,.50,-.22).normalize(),3.30,forkR*.80,forkR*.20,2,{rise:.006,wander:.34});
  const outer=growAxis(primary,forkT,new THREE.Vector3(-1,.10,.36).normalize(),3.05,forkR*.65,forkR*.18,2,{wander:.34});
  systems.push(upper,outer);

  // Two further structural generations. Still no twigs.
  systems.forEach((s,i)=>growUnit(s,2,i*.83,+density));
}

// 07 — UI
function clear(){
  for(const m of meshes){
    if(m.geometry)m.geometry.dispose();
    treeRoot.remove(m);
  }
  meshes=[];
  while(treeRoot.children.length)treeRoot.remove(treeRoot.children[0]);
}

function generate(){
  document.querySelector('#status').style.display='block';
  setTimeout(()=>{
    clear();
    randomness=+document.querySelector('#randomInput').value;
    reset(+document.querySelector('#seedInput').value);
    build(+document.querySelector('#densityInput').value);
    render();
    document.querySelector('#status').style.display='none';
    console.log(`oak limb: ${branches.length} woody axes`);
  },20);
}

document.querySelector('#gear').onclick=()=>document.querySelector('#panel').classList.toggle('show');
document.querySelector('#regen').onclick=generate;
document.querySelector('#newSeed').onclick=()=>{
  document.querySelector('#seedInput').value=Math.floor(1+Math.random()*999999999);
  generate();
};

function animate(){
  controls.update();
  renderer.render(scene,camera);
  requestAnimationFrame(animate);
}
animate();
generate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

setTimeout(()=>document.querySelector('#hint').style.opacity=.24,6000);
</script>
</body>
</html>
