<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tree — English oak</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd7c5;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}
#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}#title b{display:block;font:600 22px Georgia,serif}#title span{font-size:12px;font-style:italic;opacity:.7}
#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none;transition:opacity 1s}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:4;padding:10px 14px;border-radius:20px;background:#ffffffcc;font-size:13px;box-shadow:0 4px 20px #0002;pointer-events:none}
</style>
</head>
<body>
<div id="title"><b>English oak</b><span>Quercus robur · mature open-grown specimen</span></div>
<div id="status">Growing oak…</div>
<div id="hint">Drag to orbit · pinch / scroll to inspect</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

// 01 — SCENE. The whole crown is framed first; close inspection comes from zooming in.
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcbd7c5);scene.fog=new THREE.FogExp2(0xcbd7c5,.0037);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.02,320);camera.position.set(30,13.5,35);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,7.6,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=.12;controls.maxDistance=90;controls.zoomToCursor=true;
scene.add(new THREE.HemisphereLight(0xeaf2e2,0x554b3b,2.25));const sun=new THREE.DirectionalLight(0xffefd1,2.9);sun.position.set(-17,28,13);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-24;sun.shadow.camera.right=24;sun.shadow.camera.top=30;sun.shadow.camera.bottom=-8;scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(58,80),new THREE.MeshStandardMaterial({color:0x788861,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// 02 — ONE REPEATABLE INDIVIDUAL. Variation is deterministic so every pass improves the same tree.
let seed=88231;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646};const j=a=>(rnd()-.5)*a;
const barkMat=new THREE.MeshStandardMaterial({color:0x493b30,roughness:1,flatShading:true});const oldBranchMat=new THREE.MeshStandardMaterial({color:0x514134,roughness:1,flatShading:true});const youngBranchMat=new THREE.MeshStandardMaterial({color:0x62503a,roughness:.98});const fissureMat=new THREE.MeshStandardMaterial({color:0x2a211b,roughness:1});
const leafMats=[0x244821,0x2d5326,0x355d2b,0x3d6530,0x315728,0x456d35,0x294d24].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.88,side:THREE.DoubleSide}));

// 03 — HEAVY WOOD. The bole is substantial but no longer dominates the tree.
function woodMesh(a,b,r0,r1,material=barkMat,sides=11){const d=new THREE.Vector3().subVectors(b,a),len=d.length(),g=new THREE.CylinderGeometry(r1,r0,len,sides,3,false),pos=g.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),z=pos.getZ(i),n=1+j(Math.min(.07,r0*.11));pos.setX(i,x*n);pos.setZ(i,z*n)}g.computeVertexNormals();const m=new THREE.Mesh(g,material);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());m.castShadow=m.receiveShadow=true;scene.add(m);return m}
const trunkR=y=>Math.max(.34,.94-y*.058);let last=new THREE.Vector3(0,0,0);const trunkPoints=[last.clone()];for(let i=1;i<=18;i++){const y=i*.58,p=new THREE.Vector3(.0055*y*y+Math.sin(i*.62)*.035,y,Math.sin(i*.43)*.06);woodMesh(last,p,trunkR((i-1)*.58),trunkR(y),barkMat,12);last=p;trunkPoints.push(p)}

// 04 — ROOT FLARE. Broad buttresses disappear into the soil instead of forming a radial star.
for(let n=0;n<8;n++){const a=n/8*6.283+j(.25),s=new THREE.Vector3(Math.cos(a)*.72,.33,Math.sin(a)*.72),m=new THREE.Vector3(Math.cos(a+j(.10))*(1.15+rnd()*.35),.12,Math.sin(a+j(.10))*(1.15+rnd()*.35)),e=new THREE.Vector3(Math.cos(a+j(.12))*(1.75+rnd()*.55),.018,Math.sin(a+j(.12))*(1.75+rnd()*.55));woodMesh(s,m,.30+rnd()*.07,.14,barkMat,8);woodMesh(m,e,.14,.035,barkMat,7)}

// 05 — BARK FISSURES ON THE LOWER BOLE.
for(let n=0;n<46;n++){const a=n/46*6.283+j(.08),y=.2+rnd()*5.2,len=.45+rnd()*1.25,r=trunkR(y)+.014,curve=new THREE.CatmullRomCurve3([new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r),new THREE.Vector3(Math.cos(a+j(.065))*r,y+len*.48,Math.sin(a+j(.065))*r),new THREE.Vector3(Math.cos(a+j(.09))*r,y+len,Math.sin(a+j(.09))*r)]);scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,4,.014+rnd()*.010,3,false),fissureMat))}

// 06 — INSTANCED BRANCH SEGMENTS. Curves are assembled from short tapered units so limbs bend and twist.
const branchBuckets=[[],[],[]];const up=new THREE.Vector3(0,1,0),mid=new THREE.Vector3(),delta=new THREE.Vector3(),quat=new THREE.Quaternion(),scaleV=new THREE.Vector3(),matrix=new THREE.Matrix4();
function queueSegment(a,b,r){const bucket=r>.18?0:r>.055?1:2;branchBuckets[bucket].push({a:a.clone(),b:b.clone(),r})}
function curvedBranch(a,b,r0,bend=.5,sag=.15,segments=8){const d=new THREE.Vector3().subVectors(b,a),perp=new THREE.Vector3(-d.z,0,d.x);if(perp.lengthSq()<.001)perp.set(1,0,0);perp.normalize();const c1=a.clone().add(d.clone().multiplyScalar(.30)).add(perp.clone().multiplyScalar(bend)).add(new THREE.Vector3(0,-Math.abs(sag),0));const c2=a.clone().add(d.clone().multiplyScalar(.68)).add(perp.clone().multiplyScalar(-bend*.35)).add(new THREE.Vector3(0,Math.abs(sag)*.65,0));const curve=new THREE.CatmullRomCurve3([a,c1,c2,b]),pts=curve.getPoints(segments);for(let i=0;i<segments;i++){const t=i/segments,r=Math.max(.012,r0*(1-t*.72));queueSegment(pts[i],pts[i+1],r)}return b.clone()}

// 07 — CANOPY VOLUMES. The crown is designed first as overlapping, irregular billows.
const lobes=[
 {c:new THREE.Vector3(-6.3,7.4,-1.4),r:new THREE.Vector3(3.2,2.0,2.8),p:-1},
 {c:new THREE.Vector3(-5.1,9.4, 2.5),r:new THREE.Vector3(3.1,2.3,2.8),p:0},
 {c:new THREE.Vector3(-4.0,10.8,-3.0),r:new THREE.Vector3(3.0,2.2,2.7),p:0},
 {c:new THREE.Vector3(-2.0,12.0,1.2),r:new THREE.Vector3(3.2,2.1,2.8),p:-1},
 {c:new THREE.Vector3( 0.8,12.5,-1.7),r:new THREE.Vector3(3.2,2.1,2.8),p:-1},
 {c:new THREE.Vector3( 3.7,11.2,2.0),r:new THREE.Vector3(3.3,2.2,2.9),p:-1},
 {c:new THREE.Vector3( 5.7,9.3,-1.5),r:new THREE.Vector3(3.2,2.3,2.8),p:5},
 {c:new THREE.Vector3( 6.5,7.3,2.3),r:new THREE.Vector3(3.3,2.1,2.9),p:-1},
 {c:new THREE.Vector3( 4.2,7.0,-3.6),r:new THREE.Vector3(3.1,2.0,2.7),p:7},
 {c:new THREE.Vector3( 0.8,7.8,-4.7),r:new THREE.Vector3(3.1,2.1,2.8),p:-1},
 {c:new THREE.Vector3(-3.4,7.2,-4.1),r:new THREE.Vector3(3.1,2.0,2.7),p:9},
 {c:new THREE.Vector3(-1.6,7.8, 4.6),r:new THREE.Vector3(3.2,2.2,2.9),p:-1},
 {c:new THREE.Vector3( 2.6,7.8, 4.3),r:new THREE.Vector3(3.1,2.1,2.8),p:11},
 {c:new THREE.Vector3( 0.0,9.8, 0.7),r:new THREE.Vector3(3.0,2.2,2.7),p:3},
 {c:new THREE.Vector3(-5.7,6.2, 2.0),r:new THREE.Vector3(2.8,1.8,2.5),p:0},
 {c:new THREE.Vector3( 5.2,6.1, 0.1),r:new THREE.Vector3(2.8,1.8,2.5),p:7}
];
const anchors=[];
function trunkAt(y){return new THREE.Vector3(.0055*y*y,y,Math.sin((y/.58)*.43)*.06)}
const mainAttachments=[3.0,3.5,4.1,4.6,5.2,5.7,6.2,4.0,5.0,4.6,4.2,4.8,5.5,6.4,3.4,3.8];
lobes.forEach((l,i)=>{let start;if(l.p<0){start=trunkAt(mainAttachments[i]);}else{start=anchors[l.p].clone()}const outward=new THREE.Vector3(l.c.x,0,l.c.z).normalize();const end=l.c.clone().add(outward.clone().multiplyScalar(-l.r.x*.28)).add(new THREE.Vector3(0,-l.r.y*.30,0));const dist=start.distanceTo(end),radius=l.p<0?.40:Math.max(.16,.28-dist*.010);curvedBranch(start,end,radius,j(1.0),.10+rnd()*.32,l.p<0?10:7);anchors[i]=end.clone()});

// 08 — LOCAL CROWN ARCHITECTURE. Save the fine branch ends: these become the origins of visible leafy shoots.
const shootBases=[];
lobes.forEach((l,i)=>{const base=anchors[i];const secondary=11+Math.floor(rnd()*6);for(let n=0;n<secondary;n++){const a=rnd()*6.283,u=j(.72),rad=.40+.48*rnd(),target=l.c.clone().add(new THREE.Vector3(Math.cos(a)*l.r.x*rad,u*l.r.y,Math.sin(a)*l.r.z*rad));curvedBranch(base,target,.10+rnd()*.08,j(.34),j(.13),5);shootBases.push({p:target.clone(),li:i});const forks=2+Math.floor(rnd()*3);for(let f=0;f<forks;f++){const tip=target.clone().add(new THREE.Vector3(j(l.r.x*.46),j(l.r.y*.34),j(l.r.z*.46)));curvedBranch(target,tip,.035+rnd()*.028,j(.15),j(.05),3);shootBases.push({p:tip.clone(),li:i})}}});

// 09 — BUILD ALL BRANCHES IN THREE DRAW CALLS.
const unitGeos=[new THREE.CylinderGeometry(.78,1,1,9,1,false),new THREE.CylinderGeometry(.72,1,1,7,1,false),new THREE.CylinderGeometry(.66,1,1,5,1,false)],branchMats=[oldBranchMat,oldBranchMat,youngBranchMat];
branchBuckets.forEach((items,b)=>{if(!items.length)return;const inst=new THREE.InstancedMesh(unitGeos[b],branchMats[b],items.length);inst.castShadow=b<2;inst.receiveShadow=b===0;items.forEach((s,k)=>{delta.subVectors(s.b,s.a);mid.copy(s.a).add(s.b).multiplyScalar(.5);quat.setFromUnitVectors(up,delta.clone().normalize());scaleV.set(s.r,delta.length(),s.r);matrix.compose(mid,quat,scaleV);inst.setMatrixAt(k,matrix)});inst.instanceMatrix.needsUpdate=true;scene.add(inst)});

// 09B — FINE TWIG SPRAYS. Leaves now have visible woody support when the canopy is inspected closely.
const fineTwigSegments=[],twigLeafSites=[];
function addFineTwig(a,b,r){fineTwigSegments.push({a:a.clone(),b:b.clone(),r})}
shootBases.forEach(sb=>{const l=lobes[sb.li],outward=sb.p.clone().sub(l.c);if(outward.lengthSq()<.01)outward.set(j(1),.2,j(1));outward.normalize();const sprays=2+(rnd()<.60?1:0);for(let s=0;s<sprays;s++){const d=outward.clone().add(new THREE.Vector3(j(.70),j(.42),j(.70))).normalize(),p1=sb.p.clone().add(d.clone().multiplyScalar(.24+rnd()*.28)),d2=d.clone().add(new THREE.Vector3(j(.32),j(.22),j(.32))).normalize(),p2=p1.clone().add(d2.clone().multiplyScalar(.24+rnd()*.32));addFineTwig(sb.p,p1,.010+rnd()*.005);addFineTwig(p1,p2,.006+rnd()*.004);twigLeafSites.push({p:p2.clone(),d:d2.clone()});for(let b=0;b<2;b++){const sd=d.clone().add(new THREE.Vector3(j(1.05),j(.65),j(1.05))).normalize(),sideTip=p1.clone().add(sd.clone().multiplyScalar(.16+rnd()*.24));addFineTwig(p1,sideTip,.005+rnd()*.003);twigLeafSites.push({p:sideTip.clone(),d:sd.clone()})}}});
const fineTwigGeo=new THREE.CylinderGeometry(.72,1,1,5,1,false),fineTwigInst=new THREE.InstancedMesh(fineTwigGeo,youngBranchMat,fineTwigSegments.length);fineTwigInst.castShadow=false;fineTwigSegments.forEach((s,k)=>{delta.subVectors(s.b,s.a);mid.copy(s.a).add(s.b).multiplyScalar(.5);quat.setFromUnitVectors(up,delta.clone().normalize());scaleV.set(s.r,delta.length(),s.r);matrix.compose(mid,quat,scaleV);fineTwigInst.setMatrixAt(k,matrix)});fineTwigInst.instanceMatrix.needsUpdate=true;scene.add(fineTwigInst);

// 10 — FULL SUMMER OAK FOLIAGE. Denser again, but with a large share of leaves grouped around real twig tips.
function makeLeaf(){const s=new THREE.Shape();s.moveTo(0,-.50);[[.10,-.46],[.23,-.44],[.30,-.34],[.23,-.27],[.42,-.17],[.45,-.05],[.31,.04],[.42,.16],[.37,.27],[.20,.31],[.27,.42],[.13,.51],[0,.60],[-.13,.51],[-.27,.42],[-.20,.31],[-.37,.27],[-.42,.16],[-.31,.04],[-.45,-.05],[-.42,-.17],[-.23,-.27],[-.30,-.34],[-.23,-.44],[-.10,-.46]].forEach(v=>s.lineTo(...v));return new THREE.ShapeGeometry(s)}
const leafGeo=makeLeaf(),leafSpecs=leafMats.map(()=>[]);let leafCount=0;const MAX_LEAVES=210000;
function addLeaf(p,size,tiltBias=0){if(leafCount>=MAX_LEAVES)return;const e=new THREE.Euler(Math.PI*.5+j(.85)+tiltBias,rnd()*6.283,j(.70)),q=new THREE.Quaternion().setFromEuler(e);const sx=size*(.72+rnd()*.42),sy=size*(.82+rnd()*.30);leafSpecs[Math.floor(rnd()*leafSpecs.length)].push({p:p.clone(),q,s:new THREE.Vector3(sx,sy,size)});leafCount++}

// 10A — Leaves clustered tightly around the new twig ends.
twigLeafSites.forEach(site=>{const count=7+Math.floor(rnd()*8);for(let n=0;n<count;n++){const a=rnd()*6.283,rad=.035+rnd()*.14,p=site.p.clone().add(site.d.clone().multiplyScalar(j(.10))).add(new THREE.Vector3(Math.cos(a)*rad,j(.10),Math.sin(a)*rad));addLeaf(p,.103+rnd()*.050,j(.12))}});

// 10B — Dense local foliage keeps the crown visually continuous at normal viewing distance.
lobes.forEach(l=>{const fr=l.r.clone().multiplyScalar(1.10),count=3600+Math.floor(rnd()*1000);for(let n=0;n<count;n++){const theta=rnd()*6.283,z=2*rnd()-1,ring=Math.sqrt(Math.max(0,1-z*z));const shell=.16+.84*Math.pow(rnd(),.58);const p=l.c.clone().add(new THREE.Vector3(Math.cos(theta)*ring*fr.x*shell,z*fr.y*shell,Math.sin(theta)*ring*fr.z*shell));p.x+=j(.18);p.y+=j(.13);p.z+=j(.18);addLeaf(p,.116+rnd()*.056,j(.12))}for(let n=0;n<760;n++){const p=l.c.clone().add(new THREE.Vector3(j(fr.x*1.20),j(fr.y*1.02),j(fr.z*1.20)));if(((p.x-l.c.x)**2/(fr.x*fr.x)+(p.y-l.c.y)**2/(fr.y*fr.y)+(p.z-l.c.z)**2/(fr.z*fr.z))<1)addLeaf(p,.112+rnd()*.052)}});

// 10C — Bridges erase the remaining boundaries between the old canopy volumes.
const bridgePairs=[];for(let i=0;i<lobes.length;i++){const nearest=[];for(let k=0;k<lobes.length;k++){if(i===k)continue;nearest.push({k,d:lobes[i].c.distanceTo(lobes[k].c)})}nearest.sort((a,b)=>a.d-b.d);for(let n=0;n<3;n++){const k=nearest[n].k,a=Math.min(i,k),b=Math.max(i,k),key=a+'-'+b;if(!bridgePairs.some(x=>x.key===key))bridgePairs.push({a,b,key})}}
bridgePairs.forEach(pair=>{const A=lobes[pair.a],B=lobes[pair.b],avg=new THREE.Vector3().addVectors(A.r,B.r).multiplyScalar(.18);for(let n=0;n<1100&&leafCount<MAX_LEAVES;n++){const t=.12+rnd()*.76,p=A.c.clone().lerp(B.c,t),taper=Math.sin(Math.PI*t);p.x+=j(avg.x*(.55+.45*taper));p.y+=j(avg.y*(.55+.45*taper));p.z+=j(avg.z*(.55+.45*taper));addLeaf(p,.108+rnd()*.048,j(.10))}});

// 10D — The broad crown envelope fills any remaining slots while staying close to the existing canopy.
const crownCentre=new THREE.Vector3(0,9.35,.1),crownR=new THREE.Vector3(9.0,4.7,8.3);let attempts=0;
while(leafCount<MAX_LEAVES&&attempts<320000){attempts++;const theta=rnd()*6.283,z=2*rnd()-1,ring=Math.sqrt(Math.max(0,1-z*z)),shell=.18+.82*Math.pow(rnd(),.66),p=crownCentre.clone().add(new THREE.Vector3(Math.cos(theta)*ring*crownR.x*shell,z*crownR.y*shell,Math.sin(theta)*ring*crownR.z*shell));let nearest=99;for(const l of lobes){const dx=(p.x-l.c.x)/(l.r.x*1.28),dy=(p.y-l.c.y)/(l.r.y*1.28),dz=(p.z-l.c.z)/(l.r.z*1.28);nearest=Math.min(nearest,dx*dx+dy*dy+dz*dz)}if(nearest<1.12){p.x+=j(.15);p.y+=j(.10);p.z+=j(.15);addLeaf(p,.104+rnd()*.046,j(.08))}}

// Leaves themselves do not cast detailed shadows: the ground only needs the filled crown silhouette.
leafSpecs.forEach((items,i)=>{if(!items.length)return;const inst=new THREE.InstancedMesh(leafGeo,leafMats[i],items.length);inst.castShadow=false;items.forEach((v,k)=>{matrix.compose(v.p,v.q,v.s);inst.setMatrixAt(k,matrix)});inst.instanceMatrix.needsUpdate=true;scene.add(inst)});

// 10E — SIMPLE FILLED CANOPY SHADOW. Invisible overlapping ellipsoids cast one soft, solid tree-shaped outline.
const shadowMat=new THREE.MeshBasicMaterial({color:0x000000,colorWrite:false,depthWrite:false});
const shadowGeo=new THREE.SphereGeometry(1,14,8),shadowBlobs=[
 {p:[0,9.25,.1],s:[7.1,3.1,6.6]},
 {p:[-4.7,8.6,-.2],s:[3.8,2.5,4.2]},
 {p:[4.8,8.5,.2],s:[3.9,2.5,4.2]},
 {p:[-.5,11.2,-.2],s:[5.5,2.4,5.2]},
 {p:[0,7.2,.3],s:[6.2,2.1,5.8]}
];
shadowBlobs.forEach(v=>{const m=new THREE.Mesh(shadowGeo,shadowMat);m.position.set(...v.p);m.scale.set(...v.s);m.castShadow=true;m.receiveShadow=false;scene.add(m)});

// 11 — A FEW SMALL SHOOTS AROUND THE OLD BOLE, NOT A FOREST OF SPIKES.
for(let n=0;n<9;n++){const y=2.7+rnd()*3.7,a=rnd()*6.283,r=trunkR(y),p=new THREE.Vector3(.0055*y*y+Math.cos(a)*r,y,Math.sin(a)*r),d=new THREE.Vector3(Math.cos(a),.35+rnd()*.28,Math.sin(a)).normalize(),q=p.clone().add(d.multiplyScalar(.35+rnd()*.45));woodMesh(p,q,.026,.010,youngBranchMat,5)}

// 12 — RENDER.
document.querySelector('#status').style.display='none';function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.24,6000);
</script>
</body>
</html>
