<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tree — English oak branch study</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd7c5;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}
#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}#title b{display:block;font:600 22px Georgia,serif}#title span{font-size:12px;font-style:italic;opacity:.76}
#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none;transition:opacity 1s}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;padding:10px 14px;border-radius:20px;background:#ffffffdd;font-size:13px;box-shadow:0 4px 20px #0002;pointer-events:none}
#gear{position:fixed;right:12px;top:12px;z-index:5;width:38px;height:38px;border:0;border-radius:19px;background:#172117cc;color:#fff;font-size:18px}
#panel{display:none;position:fixed;right:12px;top:58px;z-index:5;width:220px;padding:12px;border-radius:12px;background:#f5f7f0ee;box-shadow:0 5px 22px #0003;font-size:12px}#panel.show{display:block}#panel label{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:7px;margin:7px 0}#panel input{min-width:0;width:100%}#panel .buttons{display:flex;gap:7px;margin-top:10px}#panel button{flex:1;border:0;border-radius:8px;padding:8px;background:#263722;color:#fff}
</style>
</head>
<body>
<div id="title"><b>English oak</b><span>branch study · scaffold → secondary → tertiary → twig</span></div>
<div id="status">Growing oak branch…</div><div id="hint">Drag to orbit · pinch / scroll to inspect</div><button id="gear">⚙</button>
<div id="panel"><label><span>Seed</span><input id="seedInput" type="number" value="88231"></label><label><span>Branching</span><input id="branchInput" type="range" min="0.75" max="1.35" step="0.05" value="1"></label><label><span>Randomness</span><input id="randomInput" type="range" min="0.25" max="1" step="0.05" value="0.55"></label><div class="buttons"><button id="regen">Regenerate</button><button id="newSeed">New seed</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';

// 01 — SCENE
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcbd7c5);scene.fog=new THREE.FogExp2(0xcbd7c5,.0034);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.03,220);camera.position.set(13.5,8.8,22);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.06;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-4.2,5.1,-.35);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=.18;controls.maxDistance=55;controls.zoomToCursor=true;
scene.add(new THREE.HemisphereLight(0xdce8d5,0x4a4237,1.55));const sun=new THREE.DirectionalLight(0xffefd0,3.0);sun.position.set(-15,24,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;sun.shadow.camera.top=22;sun.shadow.camera.bottom=-7;scene.add(sun);
const ground=new THREE.Mesh(new THREE.CircleGeometry(42,72),new THREE.MeshStandardMaterial({color:0x788861,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);

// 02 — MATERIALS + RANDOMNESS
const mats=[0x493b30,0x514136,0x554437,0x5a4938,0x4a3d2e,0x373524].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));
const treeRoot=new THREE.Group();scene.add(treeRoot);let meshes=[];let seed=88231,randomness=.55;const branches=[];
function reset(v){seed=Math.max(1,Math.floor(v)||1)%2147483647}function rnd(){seed=seed*16807%2147483647;return(seed-1)/2147483646}function rr(a,b){return a+(b-a)*rnd()}function jit(a){return(rnd()-.5)*a*randomness}

// 03 — BRANCH MODEL
function curveBranch(points,r0,r1,order,parent=null){const b={points,r0,r1,order,parent,children:[],curve:new THREE.CatmullRomCurve3(points,false,'centripetal'),phase:rnd()*6.283};if(parent)parent.children.push(b);branches.push(b);return b}
function pointAt(b,t){return b.curve.getPointAt(THREE.MathUtils.clamp(t,0,1))}function tangentAt(b,t){return b.curve.getTangentAt(THREE.MathUtils.clamp(t,0,1)).normalize()}function radiusAt(b,t){return b.r1+(b.r0-b.r1)*Math.pow(1-t,.78)}
function frame(tan){const ref=Math.abs(tan.y)<.9?new THREE.Vector3(0,1,0):new THREE.Vector3(1,0,0),u=new THREE.Vector3().crossVectors(tan,ref).normalize(),v=new THREE.Vector3().crossVectors(tan,u).normalize();return{u,v}}

// A child starts in the parent's direction, then bends away. This removes the 'sticks glued on' look.
function organicChild(parent,t,targetDir,len,r0,r1,order,shape={}){
  const start=pointAt(parent,t),parentTan=tangentAt(parent,t),steps=order===2?10:order===3?8:order===4?7:6,pts=[start.clone()];let p=start.clone();
  for(let i=1;i<=steps;i++){
    const f=i/steps,ease=THREE.MathUtils.smoothstep(f,.04,.72),d=parentTan.clone().lerp(targetDir,ease);
    d.x+=jit(order<=2?.025:.045);d.y+=jit(order<=2?.018:.03);d.z+=jit(order<=2?.025:.045);
    if(shape.up)d.y+=shape.up*Math.sin(Math.PI*f);if(shape.droop)d.y-=shape.droop*f*f;d.normalize();
    p=p.clone().add(d.multiplyScalar(len/steps*(.96+rr(-.035,.045))));pts.push(p.clone());
  }
  return curveBranch(pts,r0,r1,order,parent);
}
function targetAround(parent,t,az,angle,up=0){const tang=tangentAt(parent,t),{u,v}=frame(tang),side=u.clone().multiplyScalar(Math.cos(az)).add(v.clone().multiplyScalar(Math.sin(az))).normalize();return tang.clone().multiplyScalar(Math.cos(angle)).add(side.multiplyScalar(Math.sin(angle))).add(new THREE.Vector3(0,up,0)).normalize()}

// 04 — RENDER SMOOTH TAPER
function render(){const buckets=Array.from({length:6},()=>[]);for(const b of branches){const seg=b.order===0?40:b.order===1?38:b.order===2?26:b.order===3?18:b.order===4?12:8,sides=b.order===0?14:b.order===1?12:b.order===2?9:b.order===3?7:b.order===4?6:5,g=new THREE.TubeGeometry(b.curve,seg,1,sides,false),pos=g.attributes.position,uv=g.attributes.uv,c=new THREE.Vector3(),v=new THREE.Vector3();for(let i=0;i<pos.count;i++){const t=uv.getX(i);b.curve.getPointAt(t,c);v.set(pos.getX(i),pos.getY(i),pos.getZ(i)).sub(c);const r=radiusAt(b,t)*(1+(b.order<3?.01:.005)*Math.sin(16*t+b.phase));v.multiplyScalar(r);pos.setXYZ(i,c.x+v.x,c.y+v.y,c.z+v.z)}g.computeVertexNormals();buckets[b.order].push(g)}buckets.forEach((gs,o)=>{if(!gs.length)return;const merged=mergeGeometries(gs,false);gs.forEach(g=>g.dispose());const m=new THREE.Mesh(merged,mats[o]);m.castShadow=o<5;m.receiveShadow=true;treeRoot.add(m);meshes.push(m)})}

// 05 — ONE DELIBERATELY CONSTRUCTED OAK LIMB
function build(density){
  branches.length=0;
  // Short support bole only. It is not meant to be the whole tree in this study.
  const trunkPts=[new THREE.Vector3(0,0,0),new THREE.Vector3(.02,1.8,.01),new THREE.Vector3(.04,3.6,.02),new THREE.Vector3(.06,5.4,.03),new THREE.Vector3(.08,7.0,.04)];
  const trunk=curveBranch(trunkPts,1.15,.66,0,null);

  // Main scaffold: rises from the bole, arches, then becomes nearly horizontal and finishes slightly down.
  const attach=pointAt(trunk,.62),tr=radiusAt(trunk,.62);
  const p=[attach.clone(),attach.clone().add(new THREE.Vector3(-1.15,.35,-.08)),attach.clone().add(new THREE.Vector3(-2.7,.72,-.28)),attach.clone().add(new THREE.Vector3(-4.45,.78,-.55)),attach.clone().add(new THREE.Vector3(-6.1,.58,-.82)),attach.clone().add(new THREE.Vector3(-7.55,.30,-1.03)),attach.clone().add(new THREE.Vector3(-8.7,.12,-1.08))];
  const primary=curveBranch(p,tr*.52,.095,1,trunk);

  // Five secondaries: different sizes and planes, but all emerge smoothly from the primary.
  const specs=[
    {t:.22,az:-1.05,ang:.73,len:3.35,up:.18},
    {t:.36,az:1.18,ang:.86,len:3.9,up:.22},
    {t:.50,az:-1.30,ang:.78,len:3.05,up:.12},
    {t:.66,az:1.02,ang:.70,len:2.65,up:.16},
    {t:.79,az:-.92,ang:.64,len:2.15,up:.10}
  ];
  const secondaries=[];
  for(const s of specs){const baseR=radiusAt(primary,s.t),dir=targetAround(primary,s.t,s.az,s.ang,s.up),sec=organicChild(primary,s.t,dir,s.len,baseR*rr(.32,.39),baseR*rr(.085,.11),2,{up:.08,droop:rnd()<.16?.05:0});secondaries.push(sec)}

  function growSecondary(sec,idx){
    const n=Math.max(2,Math.round((2.5+(idx%2)*.5)*density));
    for(let i=0;i<n;i++){
      const t=.30+(i+1)/(n+1)*.52+jit(.035),baseR=radiusAt(sec,t),az=(i%2?1:-1)*rr(.92,1.36),ang=rr(.70,.95),dir=targetAround(sec,t,az,ang,rr(.04,.11));
      const ter=organicChild(sec,t,dir,rr(1.25,1.85)*(1-.12*t),baseR*rr(.28,.36),baseR*rr(.065,.09),3,{up:.07,droop:rnd()<.1?.04:0});growTertiary(ter);
    }
    // modest continuation so the secondary itself visibly tapers to a fine end
    const t=.96,baseR=radiusAt(sec,t),dir=tangentAt(sec,t).clone().add(new THREE.Vector3(jit(.05),.035,jit(.05))).normalize();
    const ter=organicChild(sec,t,dir,rr(1.05,1.45),baseR*.92,baseR*.18,3,{up:.04});growTertiary(ter);
  }
  function growTertiary(ter){
    const n=Math.max(2,Math.round(rr(2.0,2.8)*density));
    for(let i=0;i<n;i++){
      const t=.36+(i+1)/(n+1)*.46+jit(.03),baseR=radiusAt(ter,t),az=(i%2?1:-1)*rr(.75,1.2),ang=rr(.64,.90),dir=targetAround(ter,t,az,ang,rr(.04,.10));
      const fine=organicChild(ter,t,dir,rr(.62,.95),baseR*rr(.24,.32),baseR*rr(.065,.095),4,{up:.055});growFine(fine);
    }
    const t=.96,baseR=radiusAt(ter,t),dir=tangentAt(ter,t).clone().add(new THREE.Vector3(jit(.06),.04,jit(.06))).normalize();
    const fine=organicChild(ter,t,dir,rr(.58,.82),baseR*.90,baseR*.18,4,{up:.05});growFine(fine);
  }
  function growFine(fine){
    const n=Math.max(2,Math.round(rr(2.0,2.8)*density));
    for(let i=0;i<n;i++){
      const t=.50+(i+1)/(n+1)*.38+jit(.02),baseR=radiusAt(fine,t),az=(i%2?1:-1)*rr(.55,1.0),ang=rr(.48,.72),dir=targetAround(fine,t,az,ang,rr(.025,.065));
      organicChild(fine,t,dir,rr(.24,.38),Math.max(.0045,baseR*rr(.18,.24)),.0014,5,{up:.035});
    }
    const t=.965,baseR=radiusAt(fine,t),dir=tangentAt(fine,t).clone().add(new THREE.Vector3(jit(.04),.025,jit(.04))).normalize();
    organicChild(fine,t,dir,rr(.28,.42),Math.max(.0045,baseR*.88),.0012,5,{up:.025});
  }
  secondaries.forEach(growSecondary);
}

// 06 — UI
function clear(){for(const m of meshes){if(m.geometry)m.geometry.dispose();treeRoot.remove(m)}meshes=[];while(treeRoot.children.length)treeRoot.remove(treeRoot.children[0])}
function generate(){document.querySelector('#status').style.display='block';setTimeout(()=>{clear();randomness=+document.querySelector('#randomInput').value;reset(+document.querySelector('#seedInput').value);build(+document.querySelector('#branchInput').value);render();document.querySelector('#status').style.display='none';console.log(`branch study: ${branches.length} woody sections`)},20)}
document.querySelector('#gear').onclick=()=>document.querySelector('#panel').classList.toggle('show');document.querySelector('#regen').onclick=generate;document.querySelector('#newSeed').onclick=()=>{document.querySelector('#seedInput').value=Math.floor(1+Math.random()*999999999);generate()};function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();generate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.24,6000);
</script>
</body></html>
