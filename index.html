<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tree — English oak branch study</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd7c5;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}

#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none;transition:opacity 1s}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;padding:10px 14px;border-radius:20px;background:#ffffffdd;font-size:13px;box-shadow:0 4px 20px #0002;pointer-events:none}
#gear{position:fixed;right:12px;top:12px;z-index:5;width:38px;height:38px;border:0;border-radius:19px;background:#172117cc;color:#fff;font-size:18px}
#panel{display:none;position:fixed;right:12px;top:58px;z-index:5;width:220px;padding:12px;border-radius:12px;background:#f5f7f0ee;box-shadow:0 5px 22px #0003;font-size:12px}#panel.show{display:block}#panel label{display:grid;grid-template-columns:82px 1fr;align-items:center;gap:7px;margin:7px 0}#panel input{min-width:0;width:100%}#panel .buttons{display:flex;gap:7px;margin-top:10px}#panel button{flex:1;border:0;border-radius:8px;padding:8px;background:#263722;color:#fff}
</style>
</head>
<body>
<div id="title"><b>English oak</b><span>branch study · mature scaffold limb · no leaves</span></div>
<div id="status">Growing oak branch…</div><div id="hint">Drag to orbit · pinch / scroll to inspect</div>
<button id="gear">⚙</button>
<div id="panel">
<label><span>Seed</span><input id="seedInput" type="number" value="88231"></label>
<label><span>Fine growth</span><input id="densityInput" type="range" min="0.7" max="1.35" step="0.05" value="1"></label>
<label><span>Randomness</span><input id="randomInput" type="range" min="0.2" max="1.1" step="0.05" value="0.55"></label>
<div class="buttons"><button id="regen">Regenerate</button><button id="newSeed">New seed</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';

const scene=new THREE.Scene();scene.background=new THREE.Color(0xcbd7c5);scene.fog=new THREE.FogExp2(0xcbd7c5,.0035);const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,.03,250);camera.position.set(16.5,8.7,25.5);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.45));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.06;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(-3.1,5.2,0);controls.enableDamping=true;controls.dampingFactor=.06;controls.minDistance=.2;controls.maxDistance=60;controls.zoomToCursor=true;scene.add(new THREE.HemisphereLight(0xdce8d5,0x4a4237,1.55));const sun=new THREE.DirectionalLight(0xffefd0,3.0);sun.position.set(-15,25,12);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=24;sun.shadow.camera.bottom=-7;scene.add(sun);const ground=new THREE.Mesh(new THREE.CircleGeometry(45,72),new THREE.MeshStandardMaterial({color:0x788861,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const mats=[0x493b30,0x514136,0x554437,0x594838,0x493b2f,0x353326].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));const treeRoot=new THREE.Group();scene.add(treeRoot);let meshes=[];const branches=[];let seed=88231,randomness=.55;function reset(v){seed=Math.max(1,Math.floor(v)||1)%2147483647;if(!seed)seed=1}function rnd(){seed=seed*16807%2147483647;return(seed-1)/2147483646}function rr(a,b){return a+(b-a)*rnd()}function jit(a){return(rnd()-.5)*a*randomness}

function build(density){branches.length=0;const trunk=add(new THREE.Vector3(0,0,0),new THREE.Vector3(.015,1,.004),7.7,1.18,.38,0,null,{rise:.03,wander:.35});const attach=pointAt(trunk,.58),tr=radiusAt(trunk,.58);const primary=add(attach,new THREE.Vector3(-1,.25,-.07),8.5,tr*.62,.055,1,trunk,{rise:.10,settle:.27,wander:.55});const specs=[{t:.23,len:3.7,side:.34,up:.31,forward:.80},{t:.37,len:2.7,side:-.48,up:-.05,forward:.84},{t:.51,len:3.35,side:-.30,up:.37,forward:.78},{t:.66,len:2.85,side:.46,up:.24,forward:.82},{t:.79,len:2.15,side:.28,up:-.02,forward:.87}];const secondaries=[];for(const s of specs){const base=pointAt(primary,s.t),r=radiusAt(primary,s.t),dir=flowingDir(primary,s.t,{side:s.side+jit(.08),up:s.up+jit(.06),forward:s.forward});secondaries.push(add(base,dir,s.len*rr(.94,1.06),r*rr(.34,.43),r*rr(.055,.085),2,primary,{rise:s.up>0?.08:.02,settle:s.up<0?.05:0,wander:.8}))}

function growTertiary(ter,index){const n=Math.max(2,Math.round((2.2+rr(0,.9))*density));for(let i=0;i<n;i++){const t=.38+(i+1)/(n+1)*.49+jit(.03),r=radiusAt(ter,t),dir=flowingDir(ter,t,{side:(i%2?1:-1)*rr(.24,.42),up:rr(.06,.15),forward:rr(.80,.90)});const fine=add(pointAt(ter,t),dir,rr(.62,.95),r*rr(.23,.31),r*rr(.040,.065),4,ter,{rise:.035,wander:1.0});growFine(fine,index+i)}const t=.97,r=radiusAt(ter,t),dir=tangentAt(ter,t).clone().add(new THREE.Vector3(jit(.05),.025,jit(.05))).normalize(),fine=add(pointAt(ter,t),dir,rr(.55,.78),r*.88,r*.10,4,ter,{rise:.025,wander:.9});growFine(fine,index+5)}

function clear(){for(const m of meshes){if(m.geometry)m.geometry.dispose();treeRoot.remove(m)}meshes=[];while(treeRoot.children.length)treeRoot.remove(treeRoot.children[0])}function generate(){document.querySelector('#status').style.display='block';setTimeout(()=>{clear();randomness=+document.querySelector('#randomInput').value;reset(+document.querySelector('#seedInput').value);build(+document.querySelector('#densityInput').value);render();document.querySelector('#status').style.display='none';console.log(`oak limb: ${branches.length} woody sections`)},20)}document.querySelector('#gear').onclick=()=>document.querySelector('#panel').classList.toggle('show');document.querySelector('#regen').onclick=generate;document.querySelector('#newSeed').onclick=()=>{document.querySelector('#seedInput').value=Math.floor(1+Math.random()*999999999);generate()};function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();generate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.24,6000);
