<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Tree — English oak</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#cbd7c5;font-family:system-ui;color:#182016}canvas{display:block;touch-action:none}#title{position:fixed;left:18px;top:15px;z-index:2;pointer-events:none;text-shadow:0 1px 8px #fff}#title b{display:block;font:600 22px Georgia,serif}#title span{font-size:12px;font-style:italic;opacity:.7}#hint{position:fixed;bottom:15px;left:50%;transform:translateX(-50%);background:#172117d9;color:#fff;border-radius:20px;padding:8px 13px;font-size:12px;z-index:2;white-space:nowrap;pointer-events:none}</style></head><body><div id="title"><b>English oak</b><span>Quercus robur · mature open-grown specimen</span></div><div id="hint">Drag to orbit · pinch / scroll to inspect</div><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script><script type="module">
import * as THREE from 'three';import{OrbitControls}from'three/addons/controls/OrbitControls.js';
// 01 — SCENE
const scene=new THREE.Scene();scene.background=new THREE.Color(0xcbd7c5);scene.fog=new THREE.FogExp2(0xcbd7c5,.005);const camera=new THREE.PerspectiveCamera(39,innerWidth/innerHeight,.018,300);camera.position.set(28,13,32);const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,8,0);controls.enableDamping=true;controls.minDistance=.12;controls.maxDistance=80;controls.zoomToCursor=true;scene.add(new THREE.HemisphereLight(0xeaf2e2,0x514939,2.15));const sun=new THREE.DirectionalLight(0xffefd0,2.8);sun.position.set(-16,27,11);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=-22;sun.shadow.camera.right=22;sun.shadow.camera.top=29;sun.shadow.camera.bottom=-9;scene.add(sun);const ground=new THREE.Mesh(new THREE.CircleGeometry(55,96),new THREE.MeshStandardMaterial({color:0x788861,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// 02 — MATERIALS / REPEATABLE TREE
let seed=73019;const rnd=()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646},j=a=>(rnd()-.5)*a;const bark=new THREE.MeshStandardMaterial({color:0x493d32,roughness:1,flatShading:true}),young=new THREE.MeshStandardMaterial({color:0x62513d,roughness:1}),dark=new THREE.MeshStandardMaterial({color:0x27211c,roughness:1});const leafMats=[0x244721,0x2d5427,0x365e2c,0x406832,0x31582a,0x486f38].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.9,side:THREE.DoubleSide}));
// 03 — WOODY SEGMENTS
function wood(a,b,r0,r1,old=true){const d=new THREE.Vector3().subVectors(b,a),len=d.length(),g=new THREE.CylinderGeometry(r1,r0,len,r0>.4?11:r0>.09?7:5,2,false);const p=g.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i),n=1+j(Math.min(.10,r0*.18));p.setX(i,x*n);p.setZ(i,z*n)}g.computeVertexNormals();const m=new THREE.Mesh(g,old?bark:young);m.position.copy(a).add(b).multiplyScalar(.5);m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize());m.castShadow=m.receiveShadow=true;scene.add(m)}
// 04 — LEAF
function leafShape(){const s=new THREE.Shape();s.moveTo(0,-.53);[[.12,-.48],[.26,-.45],[.31,-.34],[.23,-.26],[.43,-.16],[.45,-.04],[.30,.05],[.42,.17],[.36,.29],[.19,.32],[.27,.43],[.13,.52],[0,.62],[-.13,.52],[-.27,.43],[-.19,.32],[-.36,.29],[-.42,.17],[-.30,.05],[-.45,-.04],[-.43,-.16],[-.23,-.26],[-.31,-.34],[-.26,-.45],[-.12,-.48]].forEach(v=>s.lineTo(...v));return new THREE.ShapeGeometry(s)}const leafGeo=leafShape();function leaf(p,s=.25){const m=new THREE.Mesh(leafGeo,leafMats[Math.floor(rnd()*leafMats.length)]);m.position.copy(p);m.scale.set(s*(.7+rnd()*.55),s*(.8+rnd()*.4),s);m.rotation.set(j(1.3),rnd()*6.283,j(1));m.castShadow=true;scene.add(m)}
// 05 — STOUT SHORT BOLE + ROOT FLARE
const tr=r=>Math.max(.64,1.5-r*.09);let prev=new THREE.Vector3(0,0,0);for(let i=1;i<=12;i++){const y=i*.66,p=new THREE.Vector3(.008*y*y+Math.sin(i*.65)*.04,y,Math.sin(i*.4)*.07);wood(prev,p,tr((i-1)*.66),tr(y));prev=p}for(let n=0;n<12;n++){const a=n/12*6.283+j(.18),s=new THREE.Vector3(Math.cos(a)*.76,.38,Math.sin(a)*.76),m=new THREE.Vector3(Math.cos(a+j(.08))*(1.4+rnd()*.7),.12,Math.sin(a+j(.08))*(1.4+rnd()*.7)),e=new THREE.Vector3(Math.cos(a+j(.12))*(3+rnd()*2.3),.02,Math.sin(a+j(.12))*(3+rnd()*2.3));wood(s,m,.43,.17);wood(m,e,.17,.025)}
// 06 — BARK FISSURES
for(let n=0;n<48;n++){const a=n/48*6.283+j(.08),y=.2+rnd()*5.6,len=.5+rnd()*1.4,r=tr(y)+.015,curve=new THREE.CatmullRomCurve3([new THREE.Vector3(Math.cos(a)*r,y,Math.sin(a)*r),new THREE.Vector3(Math.cos(a+j(.07))*r,y+len*.5,Math.sin(a+j(.07))*r),new THREE.Vector3(Math.cos(a+j(.1))*r,y+len,Math.sin(a+j(.1))*r)]);scene.add(new THREE.Mesh(new THREE.TubeGeometry(curve,4,.018,3,false),dark))}
// 07 — CROWN ENGINE. Long-lived direction, many short extension units, unequal forks and lateral shoots.
const tips=[];function shoot(a,dir,len,r,order,energy=1){let d=dir.clone();d.x+=j(.12);d.z+=j(.12);d.y+=j(.10);d.normalize();const steps=order>3?3:2;let p=a.clone();for(let s=0;s<steps;s++){const dd=d.clone();dd.x+=j(.11);dd.z+=j(.11);dd.y+=j(.08);dd.normalize();const q=p.clone().add(dd.multiplyScalar(len/steps));wood(p,q,r*(1-s*.10),r*(.9-s*.10),r>.11);p=q;d.lerp(dd,.7).normalize();if(order<=2&&rnd()<.72){const side=d.clone();side.x+=j(1.05);side.z+=j(1.05);side.y+=j(.45)+.08;shoot(p,side,len*.34,r*.48,Math.max(0,order-2),energy*.7)}}if(order===0){tips.push({p,d,energy});return}const children=order>=4?3:(rnd()<.62?3:2);for(let k=0;k<children;k++){const c=d.clone(),spread=order>3?.52:order>1?.72:.92;c.x+=j(spread);c.z+=j(spread);c.y+=j(.34)+(order<3?.08:0);const dominant=k===0?1:.72+rnd()*.18;shoot(p,c,len*(.57+rnd()*.11)*dominant,r*(.58+rnd()*.07),order-1,energy*dominant)}}
// 08 — PRIMARY LIMBS. Fewer giant radial spokes; each immediately develops a broad subordinate crown.
const limbs=[[2.7,.15,.17,5.5,.70],[3.35,2.55,.13,5.3,.66],[4.05,4.22,.20,5.4,.62],[4.75,5.55,.18,5.1,.57],[5.35,1.35,.27,4.9,.54],[5.95,3.25,.24,4.8,.51],[6.5,4.85,.34,4.5,.47],[7.0,.55,.39,4.2,.43],[7.45,2.25,.45,3.8,.38],[7.8,4.0,.52,3.5,.34]];limbs.forEach(([y,a,rise,len,r])=>{const p=new THREE.Vector3(.008*y*y,y,Math.sin(y*.4)*.07),d=new THREE.Vector3(Math.cos(a),rise,Math.sin(a)).normalize();shoot(p,d,len,r,5,1)});
// 09 — FILLING BRANCH SYSTEM. This is what removes the dead/dieback appearance: secondary crown volumes overlap.
for(let n=0;n<18;n++){const y=3.2+rnd()*4.6,a=rnd()*6.283,rise=.18+rnd()*.48,p=new THREE.Vector3(.008*y*y,y,Math.sin(y*.4)*.07),d=new THREE.Vector3(Math.cos(a),rise,Math.sin(a)).normalize();shoot(p,d,2.7+rnd()*1.5,.16+rnd()*.11,4,.82)}
// 10 — FOLIAGE MASSES. Individual leaves remain real geometry, but clusters overlap around the peripheral shoot network.
tips.forEach(t=>{if(rnd()<.025)return;const bunch=9+Math.floor(rnd()*11);for(let q=0;q<bunch;q++){const radius=.28+rnd()*.78,theta=rnd()*6.283,phi=(rnd()-.5)*1.2,p=t.p.clone().add(new THREE.Vector3(Math.cos(theta)*radius,Math.sin(phi)*radius*.65,Math.sin(theta)*radius));leaf(p,.20+rnd()*.12)}if(rnd()<.55){const back=t.p.clone().add(t.d.clone().multiplyScalar(-.35));for(let q=0;q<5+Math.floor(rnd()*6);q++)leaf(back.clone().add(new THREE.Vector3(j(.7),j(.5),j(.7))),.19+rnd()*.1)}});
// 11 — INTERNAL / EPICORMIC GREENERY softens the abrupt trunk-to-crown transition.
for(let n=0;n<22;n++){const y=2.2+rnd()*5.3,a=rnd()*6.283,r=tr(y),p=new THREE.Vector3(.008*y*y+Math.cos(a)*r,y,Math.sin(a)*r),d=new THREE.Vector3(Math.cos(a),.25+rnd()*.4,Math.sin(a)).normalize();shoot(p,d,.65+rnd()*.75,.035,1,.55)}
// 12 — RENDER
function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.25,6000);
</script></body></html>
