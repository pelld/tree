<!doctype html>
<html lang="en">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Tree — English oak branch study</title>
<style>

</style>
</head>
<body>
<div id="title"><b>English oak</b><span>branch study · one mature scaffold limb · no leaves</span></div>
<div id="status">Growing oak branch…</div><div id="hint">Drag to orbit · pinch / scroll to inspect</div>
<button id="gear">⚙</button>
<div id="panel">
<label><span>Seed</span><input id="seedInput" type="number" value="88231"></label>
<label><span>Fine growth</span><input id="densityInput" type="range" min="0.75" max="1.35" step="0.05" value="1"></label>
<label><span>Randomness</span><input id="randomInput" type="range" min="0.2" max="1" step="0.05" value="0.48"></label>
<div class="buttons"><button id="regen">Regenerate</button><button id="newSeed">New seed</button></div></div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/"}}</script>
<script type="module">

const mats=[0x493b30,0x514136,0x554437,0x594838,0x493b2f,0x353326].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:1}));const treeRoot=new THREE.Group();scene.add(treeRoot);let meshes=[];const branches=[];let seed=88231,randomness=.48;function reset(v){seed=Math.max(1,Math.floor(v)||1)%2147483647;if(!seed)seed=1}function rnd(){seed=seed*16807%2147483647;return(seed-1)/2147483646}function rr(a,b){return a+(b-a)*rnd()}function jit(a){return(rnd()-.5)*a*randomness}

const specs=[{t:.24,az:-1.65,angle:.74,len:3.15,bias:.10,r:.39},{t:.36,az:.72,angle:.88,len:4.15,bias:.18,r:.42},{t:.50,az:2.48,angle:.78,len:3.55,bias:-.02,r:.36,droop:.05},{t:.64,az:-.42,angle:.70,len:2.95,bias:.12,r:.34},{t:.77,az:1.82,angle:.64,len:2.35,bias:.02,r:.31},{t:.86,az:-2.55,angle:.57,len:1.65,bias:.08,r:.27}];const secondaries=[];for(const s of specs){const r=radiusAt(primary,s.t),dir=divergentDir(primary,s.t,s.az+jit(.09),s.angle+jit(.05),s.bias+jit(.035));secondaries.push(organicChild(primary,s.t,dir,s.len*rr(.95,1.05),r*s.r,r*rr(.070,.095),2,{rise:s.bias>0?.010:0,droop:s.droop||0,wander:.72}))}

function clear(){for(const m of meshes){if(m.geometry)m.geometry.dispose();treeRoot.remove(m)}meshes=[];while(treeRoot.children.length)treeRoot.remove(treeRoot.children[0])}function generate(){document.querySelector('#status').style.display='block';setTimeout(()=>{clear();randomness=+document.querySelector('#randomInput').value;reset(+document.querySelector('#seedInput').value);build(+document.querySelector('#densityInput').value);render();document.querySelector('#status').style.display='none';console.log(`oak limb: ${branches.length} woody sections`)},20)}document.querySelector('#gear').onclick=()=>document.querySelector('#panel').classList.toggle('show');document.querySelector('#regen').onclick=generate;document.querySelector('#newSeed').onclick=()=>{document.querySelector('#seedInput').value=Math.floor(1+Math.random()*999999999);generate()};function animate(){controls.update();renderer.render(scene,camera);requestAnimationFrame(animate)}animate();generate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});setTimeout(()=>document.querySelector('#hint').style.opacity=.24,6000);
